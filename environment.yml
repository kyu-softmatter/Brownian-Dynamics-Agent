# bdbot run environment — a reproducible definition
#
#   conda env create -f environment.yml      (to create it fresh)
#   conda env update -f environment.yml -n simulation_bot --prune   (to update an existing one)
#
# The environment currently in use: simulation_bot  (an existing environment, extended)
# Verification status: 2026-08-03, macOS 26.5 arm64, 15 API smoke tests pass on the hoomd 7.1.0 CPU build
#            (see docs/hoomd_capabilities.md)
name: simulation_bot

channels:
  - conda-forge

dependencies:
  - python=3.12

  # ── the simulation engine ──────────────────────────────────────────
  # The docs are for v7.1.1 but the installed build is 7.1.0. That is a patch difference and every API surveyed is identical.
  # osx-arm64 has no CUDA build, so the CPU build is selected automatically.
  - hoomd=7.1
  - gsd

  # ── analysis ──────────────────────────────────────────────────────
  - freud
  - numpy
  - scipy
  - pandas
  - pyarrow          # Parquet (the observables table)
  - h5py             # hoomd.write.HDF5Log

  # ── plotting ──────────────────────────────────────────────────────
  - matplotlib

  # ── spec, units, CLI ──────────────────────────────────────────────
  - pydantic         # the SimSpec / PhysicalSystem / Observation schemas
  - pint             # ⭐️ dimensional physical quantities — the unit safety of rule 3
  - typer            # CLI
  - rich             # CLI output
  - pyyaml

  # ── tests ─────────────────────────────────────────────────────────
  - pytest

  # Optional: batch distillation of papers (master plan §15.9). Not normally needed —
  # small-volume distillation is handled by Claude Code's /bd-distill.
  # - pip
  # - pip:
  #     - anthropic
