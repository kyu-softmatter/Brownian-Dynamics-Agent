# ── ③ 모호한 것 (반드시 채울 것) ───────────────────────────────────────
ambiguities:
  - id: A1
    issue: "A는 무차원인가, 아니면 길이³ 차원을 갖는가?"
    detail: |
      U/kT = A/r³ 이 차원적으로 성립하려면 둘 중 하나여야 한다.
        (i)  r을 입자 지름 단위로 읽음 → A 무차원.  U/kT = A (d/r)³
        (ii) r을 µm로 읽음            → [A] = µm³. U/kT = A[µm³]/r[µm]³
    impact: |
      d = 1 µm 앵커를 쓰면 (i)과 (ii)가 수치적으로 완전히 일치한다.
      d ≠ 1 µm 이면 두 해석이 d³배 어긋난다.
    lean: "(i) 무차원 A"
    resolution: |
      d = 5 µm 로 확정되었으므로(사용자 2026-08-03) 두 해석이 125배 갈린다.
      해석 (ii)면 A=100 에서도 Γ = 0.238 로 스윕 전 구간이 kT 아래여서
      rdf·voronoi에 WCA 배제부피 말고는 아무 구조도 안 나온다.
      스케치의 목표(final configuration / structure analysis)와 일관된 것은
      해석 (i) 뿐이므로 (i)로 진행한다.  ★ 이건 목표로부터의 추론이며 확인 필요.
      근거: scratch/soft_r3_design.py §0
    proposed_by: assistant    # ★ 목표로부터의 추론 — 사용자 확인 대기

  - id: A2
    issue: "★ 밀도(면적분율 φ 또는 박스 크기 L)가 없다"
    detail: |
      구조(rdf·voronoi)를 정하는 실제 제어 파라미터는 A 단독이 아니라
      평균간격에서의 결합세기 Γ ≡ U(a_mean)/kT = A (d/a_mean)³ 이다
      (a_mean = L/√N, 2D).
    impact: |
      같은 A=100 이라도 a_mean=1.2d 면 Γ=57.9, a_mean=4.3d 면 Γ=1.26 —
      전혀 다른 물리(결정 vs 약상관 유체). 밀도 없이는 A 스윕이 정의되지 않는다.
      → scratch/intake_scales.py 의 Γ 표 참조
    lean: null
    resolution: "φ = 0.35 (a_mean = 1.498 d = 7.49 µm). 사용자 확인 2026-08-03"
    confirmed_by: user
    consequence: "Γ = 0.030 / 0.297 / 2.975 / 29.75 — 약상관 유체에서 결정 후보까지 덮음"

  - id: A3
    issue: "배제부피 코어(하드코어 / WCA)가 있는가? 아니면 순수 점입자인가?"
    detail: |
      A ≲ 5 에서는 r⁻³ 반발만으로 겹침을 막지 못한다.
      U(r)=5kT 가 되는 거리:  A=0.1 → 0.271d,  A=1 → 0.585d  (둘 다 지름 안쪽)
    impact: |
      물리: 코어가 없으면 A=0.1, 1 은 '입자가 서로 관통하는' 계가 된다.
      수치: dt 결정이 뒤집힌다. 코어 없으면 작은 A가 더 어렵고(깊이 관통 →
            국소 강성 급증), 코어가 있으면 큰 A가 더 어렵다.
    resolution: "WCA 코어를 d에 추가 (ε = kT). 사용자 확인 2026-08-03"
    confirmed_by: user
    consequence: |
      실제 계산해보니 코어가 있어도 A=0.1·1 이 가장 뻣뻣했다 — 이 두 경우는
      r⁻³가 약해(Γ≤0.3) 입자가 WCA 코어까지 접근하기 때문이다.
      A=100 은 케이지에 갇혀 1.34d 이하로 못 와서 오히려 dt가 5.6배 느슨하다.
      → '큰 A가 더 어렵다'는 위 예상은 틀렸다 (scratch/soft_r3_design.py §2)

  - id: A4
    issue: "주기경계인가?"
    note: "박스만 그려져 있고 명시 없음. 'final configuration / rdf'는 보통 주기계"
    lean: "주기 (2D, Lx=Ly)"
    resolution: >
      실행으로 확정: 2D 주기 정사각 박스. 7개 런 전부 주기 경계로 실행했고 최소이미지 여유 2.00× 를 검사로 확인했다. lean('주기')이 맞았다.
    confirmed_by: run     # 실행으로 확정

  - id: A5
    issue: "컷오프를 어디에 둘 것인가? (r⁻³는 꼬리가 길다)"
    detail: |
      U(r_c) = u_c·kT 를 만족하는 r_c = (A/u_c)^(1/3) d.
        u_c=0.01 → A=100 에서 r_c = 21.5 d
      최소이미지(r_c < L/2)와 함께 풀면 결합세기에 상한이 생긴다:
        Γ_max = N^(3/2) u_c / 8      ← A와 무관
        N=100, u_c=0.01 → Γ_max = 1.25 (약상관 유체까지만)
    impact: |
      ★ 스케치의 N=100 으로는 강한 결합 구조를 볼 수 없다.
        Γ=10 → N ≥ 400,  Γ=60 → N ≥ 1321 (u_c=0.01 기준)
      함정 7(최소이미지 누락, 과거 +1856% 오차)이 정확히 이 지점이다.
    resolution: |
      N = 400 으로 늘림 (사용자 확인 2026-08-03: 'N을 늘려 r_c를 제대로 확보').
      다만 절단 기준을 '절대 kT'에서 **a_mean의 배수**로 바꿨다 — 2D r⁻³의
      꼬리 에너지는 1/r_c 로만 줄어서 절대 기준으로는 어떤 r_c도 '충분'하지 않다.
      구조(rdf·voronoi)를 좌우하는 것은 꼬리가 아니라 근거리이므로
      r_c = 5 a_mean = 7.49 d 로 잡고, N=400에서 r_c = 5·7·9 a_mean 수렴 확인을 붙인다.
      최소이미지 여유 2.00×. 근거: scratch/soft_r3_design.py §3
    confirmed_by: user

