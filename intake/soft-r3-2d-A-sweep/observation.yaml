# ── ⑥ contrast with 1-A (the DoD of Phase 1-B) ────────────────────────
contrast_with_1A:
  same:
    - "reference scale strategy thermal (σ=d, E=kT, τ=τ_B) — the unit system is not changed per system"
    - "the property relations γ = 3πηd, D_t = kT/γ"
    - "τ_p (inertia) is for the model-validity check only — never compared against dt"
    - "dt is inverted from '1% of the fastest physical timescale'"
    - "the relaxation time is defined from the local curvature: trap τ_k=γ/k  ↔  pair τ_int(r)=γ/U''(r)"
  different:
    - "★ the particle is the same, so τ_B is the same too (d=5µm → τ_B = 242.05 s, identical to 1-A).
       But in 1-A the trap caught it in 4 ms so τ_B was never realized — 'decoration' — whereas
       here τ_B is **the actual governing timescale**. The same number is meaningless in one case
       and dominant in another — which is both why the reference scale may be held fixed, and
       the mirror image of the 1-A lesson that 'the governing timescale can differ from the reference scale'"
    - "new length scales come out of A and the density: r_u(A,c), a_mean, r_c"
    - "the geometry check becomes a real gate for the first time (1-A always passed with ℓ_k=20nm)"
    - "τ_int is a function of r rather than a constant — dt is only fixed once r_min has been estimated"
    - "no analytic solution → verification is by the limit (dilute → g(r)=exp(-βU))"
