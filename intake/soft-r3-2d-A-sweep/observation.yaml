stated_goals:
  - "final configuration"
  - "rdf (radial distribution function)"
  - "voronoi plot"
  - "other structure analysis"

# ── ③ what is ambiguous (must be filled in) ───────────────────────────
ambiguities:
  - id: A1
    issue: "is A dimensionless, or does it carry a dimension of length³?"
    detail: |
      For U/kT = A/r³ to hold dimensionally, one of these two must be true.
        (i)  read r in units of the particle diameter → A dimensionless.  U/kT = A (d/r)³
        (ii) read r in µm                             → [A] = µm³. U/kT = A[µm³]/r[µm]³
    impact: |
      With a d = 1 µm anchor, (i) and (ii) coincide numerically and exactly.
      For d ≠ 1 µm the two readings differ by a factor d³.
    lean: "(i) dimensionless A"
    resolution: |
      Since d = 5 µm is now fixed (user 2026-08-03), the two readings differ by 125×.
      Under reading (ii), even A=100 gives Γ = 0.238, so the whole sweep sits below kT
      and rdf/voronoi show no structure beyond the WCA excluded volume.
      The only reading consistent with the sketch's goals (final configuration /
      structure analysis) is (i), so (i) is what we proceed with.
      ★ This is an inference from the goals and needs confirmation.
      Basis: scratch/soft_r3_design.py §0
    proposed_by: assistant    # ★ inferred from the goals — awaiting user confirmation

  - id: A2
    issue: "★ the density (area fraction φ, or the box size L) is missing"
    detail: |
      The actual control parameter that sets the structure (rdf/voronoi) is not A alone
      but the coupling strength at the mean spacing, Γ ≡ U(a_mean)/kT = A (d/a_mean)³
      (a_mean = L/√N, in 2D).
    impact: |
      At the same A=100, a_mean=1.2d gives Γ=57.9 and a_mean=4.3d gives Γ=1.26 —
      entirely different physics (crystal vs weakly correlated fluid). Without a
      density the A sweep is not defined.
      → see the Γ table in scratch/intake_scales.py
    lean: null
    resolution: "φ = 0.35 (a_mean = 1.498 d = 7.49 µm). User-confirmed 2026-08-03"
    confirmed_by: user
    consequence: "Γ = 0.030 / 0.297 / 2.975 / 29.75 — covers weakly correlated fluid through crystal candidate"

  - id: A3
    issue: "is there an excluded-volume core (hard core / WCA)? Or are these pure point particles?"
    detail: |
      At A ≲ 5 the r⁻³ repulsion alone does not prevent overlap.
      The distance at which U(r)=5kT:  A=0.1 → 0.271d,  A=1 → 0.585d  (both inside the diameter)
    impact: |
      Physics: without a core, A=0.1 and 1 become systems in which 'the particles pass through
      each other'.
      Numerics: the dt decision flips. Without a core, small A is harder (deep penetration →
            the local stiffness shoots up); with a core, large A is harder.
    resolution: "add a WCA core at d (ε = kT). User-confirmed 2026-08-03"
    confirmed_by: user
    consequence: |
      Once actually computed, A=0.1 and 1 were the stiffest even with the core — because in
      those two cases r⁻³ is weak (Γ≤0.3) so the particles do reach the WCA core.
      A=100 is caged and cannot come closer than 1.34d, so its dt is in fact 5.6× looser.
      → the expectation above, that 'large A is harder', was wrong (scratch/soft_r3_design.py §2)

  - id: A4
    issue: "is the boundary periodic?"
    note: "only a box is drawn, nothing stated. 'final configuration / rdf' usually implies a periodic system"
    lean: "periodic (2D, Lx=Ly)"
    resolution: >
      Settled by running: a 2D periodic square box. All 7 runs were run with periodic boundaries and the minimum-image margin of 2.00× was confirmed by a check. The lean ('periodic') was right.
    confirmed_by: run     # settled by running

  - id: A5
    issue: "where should the cutoff go? (r⁻³ has a long tail)"
    detail: |
      The r_c satisfying U(r_c) = u_c·kT is r_c = (A/u_c)^(1/3) d.
        u_c=0.01 → r_c = 21.5 d at A=100
      Solving that together with minimum image (r_c < L/2) puts a ceiling on the coupling strength:
        Γ_max = N^(3/2) u_c / 8      ← independent of A
        N=100, u_c=0.01 → Γ_max = 1.25 (only up to a weakly correlated fluid)
    impact: |
      ★ With the sketch's N=100, strongly coupled structure cannot be seen.
        Γ=10 → N ≥ 400,  Γ=60 → N ≥ 1321 (on the u_c=0.01 criterion)
      Trap 7 (a missing minimum image, a past +1856% error) is exactly this point.
    resolution: |
      N raised to 400 (user-confirmed 2026-08-03: 'raise N so that r_c is properly accommodated').
      The truncation criterion was however changed from 'absolute kT' to **a multiple of a_mean** —
      the tail energy of the 2D r⁻³ falls off only as 1/r_c, so on an absolute criterion no r_c
      is ever 'sufficient'.
      What governs the structure (rdf/voronoi) is not the tail but the short range, so
      r_c = 5 a_mean = 7.49 d is taken, with an r_c = 5·7·9 a_mean convergence check attached at N=400.
      Minimum-image margin 2.00×. Basis: scratch/soft_r3_design.py §3
    confirmed_by: user

