# ── ② structured ──────────────────────────────────────────────────────
system_guess: "soft-repulsive colloids in a 2D periodic box (r⁻³ pair potential), a sweep of the coupling strength A"

entities:
  - kind: particle
    note: "drawn as 8 circles inside the box (schematic). The count is stated separately on the right as N=100"
  - kind: pair_interaction
    form: "soft repulsive power law"
    expression: "U_ij/kT = A / r_ij^3,  r_ij = |r_i - r_j|"
    note: "no sign stated. Read as repulsive since A>0"
  - kind: box
    note: "2D square (L_x = L_y). Whether the boundary is periodic is not stated — only a box is drawn"

stated_quantities:
  - symbol: A
    value: [0.1, 1, 10, 100]
    unit: null                # ★ the dimension is ambiguous — ambiguities A1
    source: "top of the sketch, explicit"
    confidence: 1
  - symbol: N
    value: 100
    unit: dimensionless
    source: "right side of the sketch, 'N = 100 ? particles'"
    confidence: 1
    note: "1 illegible symbol after the 100 — see unread_regions"
  - symbol: L_x/L_y
    value: null
    unit: null
    source: "sketch: only the relation 'L_x = L_y', with no number"
