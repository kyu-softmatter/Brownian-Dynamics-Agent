# ── ⑥ 1-A와의 대조 (Phase 1-B의 DoD) ──────────────────────────────────
contrast_with_1A:
  same:
    - "기준 스케일 전략 thermal (σ=d, E=kT, τ=τ_B) — 단위계는 계마다 바꾸지 않음"
    - "γ = 3πηd, D_t = kT/γ 물성 유도식"
    - "τ_p (관성) 는 모델 타당성 검사 전용 — dt와 비교하지 않음"
    - "dt는 '가장 빠른 물리 시간척도의 1%'에서 역산"
    - "이완시간을 국소 곡률에서 정의: 트랩 τ_k=γ/k  ↔  페어 τ_int(r)=γ/U''(r)"
  different:
    - "★ 입자가 같아서 τ_B 도 같다 (d=5µm → τ_B = 242.05 s, 1-A와 동일).
       그런데 1-A에서는 트랩이 4 ms에 붙잡아 τ_B가 실현되지 않는 '장식'이었고,
       여기서는 τ_B가 **실제 지배 시간척도**다. 같은 숫자가 한 케이스에서는
       무의미하고 다른 케이스에서는 지배적 — 기준 스케일을 고정해도 되는 이유이자,
       '지배 시간척도는 기준 스케일과 다를 수 있다'는 1-A 교훈의 대칭 사례"
    - "새 길이척도가 A와 밀도에서 나온다: r_u(A,c), a_mean, r_c"
    - "기하 검사가 처음으로 진짜 게이트가 된다 (1-A는 ℓ_k=20nm로 항상 통과)"
    - "τ_int가 상수가 아니라 r의 함수 — r_min을 추정해야 dt가 정해진다"
    - "해석해 없음 → 검증은 극한(희박 → g(r)=exp(-βU)) 대조로"
