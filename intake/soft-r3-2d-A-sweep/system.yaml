# L2 PhysicalSystem — 차원 있는 물리계 (SI). 원칙 3: 이것이 먼저 확정되어야 한다.
# 출처: intake/soft-r3-2d-A-sweep/observation.yaml (사람 확인 2026-08-03)
# 유도 계산: scratch/soft_r3_design.py  (재현 가능)
# tier 0=직접입력/핸드북 · 1=문헌+검증/확인된 관례 · 2=문헌 미검증 · 3=임의 가정

label: soft-r3-2d-A-sweep
derived_from: observation.yaml   # ★ L2 불변식 (§5.4): 이 물리계의 근거 L0
description: >
  2D 주기박스 안의 소프트 반발 콜로이드. r⁻³ 페어 퍼텐셜의 진폭 A를 4자릿수에 걸쳐
  스윕하며 최종 구조(rdf · voronoi)를 본다. 뉴턴 유체(물).
dimensions: 2

particle:
  diameter:
    value: 5.0
    unit: um
    source: "스케치 미기재. 다른 3개 스케치의 'R = 5 µm' 관례로 통일 — 사용자 확인 2026-08-03"
    tier: 1
  density:
    value: 2000
    unit: kg/m^3
    source: "실리카 가정. τ_p(모델 타당성 검사)에만 사용, BD 결과에 영향 없음"
    tier: 3
  count:
    value: 400
    unit: dimensionless
    source: >
      스케치는 N = 100. 최소이미지(r_c < L/2)를 지키면서 목표 결합세기에 도달하려면
      부족하여 400으로 상향 — 사용자 확인 2026-08-03.
      N=400이면 r_c = 5·7·9 a_mean 세 값을 모두 최소이미지 안에서 시험할 수 있다.
    tier: 1
    deviates_from_sketch: true

medium:
  kind: newtonian
  name: water
  temperature:
    value: 300
    unit: K
    source: "스케치 미기재. 1-A(trap-2d-5um)에서 확인된 300 K 승계"
    tier: 1
  viscosity:
    value: 0.851
    unit: mPa*s
    source: "물 @300K 핸드북값. 매질이 물임은 1-A에서 확인, 이 스케치엔 미기재"
    tier: 1

geometry:
  kind: periodic_square_2d
  area_fraction:
    value: 0.35
    unit: dimensionless
    source: "스케치 미기재 (밀도 없이는 A 스윕이 정의되지 않음). 사용자 확인 2026-08-03"
    tier: 1
  box_length:                 # 유도값: L = a_mean √N
    value: 149.80
    unit: um
    source: "derived: φ=0.35, N=400, d=5µm  →  a_mean=7.490µm, L=30.0 d"
    tier: 1
  periodic: true
  source_note: "스케치에 주기경계 명시 없음. rdf/최종구조 목표상 주기계로 읽음 (A4 미해소)"

interactions:
  - kind: pair.soft_r3
    form: "U(r)/kT = A (d/r)^3"
    amplitude_A:
      value: [0.1, 1.0, 10.0, 100.0]
      unit: dimensionless
      source: "sketch:sketch_01.jpeg 'A = 0.1, 1, 10, 100'"
      tier: 0
      interpretation: >
        A를 무차원으로, r을 지름 단위로 읽었다 (observation.yaml A1).
        d=5µm에서 대안 해석([A]=µm³)이면 Γ ≤ 0.24로 스윕 전 구간이 kT 아래가 되어
        스케치의 구조 관측 목표와 모순된다. ★ 목표로부터의 추론 — 확인 필요.
    cutoff:
      value: 37.45
      unit: um
      source: "r_c = 5 a_mean = 7.49 d. 절대 kT 기준이 아니라 a_mean 배수로 잡음 (A5)"
      tier: 1
      note: "2D r⁻³ 꼬리 에너지는 1/r_c 로만 수렴 — 절대 기준으로는 어떤 r_c도 불충분.
             구조는 근거리가 정하므로 a_mean 배수가 옳은 기준. 수렴 확인 필수."
      shift: true

  - kind: pair.wca
    form: "WCA (배제부피 코어)"
    sigma:
      value: 5.0
      unit: um
      source: "코어를 입자 지름에 둠 — 사용자 확인 2026-08-03"
      tier: 1
    epsilon:
      value: 1.0
      unit: kT
      source: "관례값. 코어 위치를 정하는 역할이며 A≥10에서는 입자가 도달하지 않아 무관"
      tier: 3
    cutoff: "2^(1/6) sigma = 5.612 um"

external: none

# ── 관측 목표 (스케치 명시) ────────────────────────────────────────────
targets:
  - name: final_configuration
  - name: radial_distribution_function     # g(r)
  - name: voronoi_tessellation
  - name: structure_analysis               # ψ₆(육방 질서), S(q) 등

# ── 유도된 스케일 (scratch/soft_r3_design.py) ──────────────────────────
derived_scales:
  gamma: {value: 4.0102e-8, unit: kg/s, expr: "3 pi eta d"}
  D_t: {value: 0.1033, unit: um^2/s, expr: "kT/gamma"}
  tau_B: {value: 242.05, unit: s, expr: "d^2/D_t", role: "기준 시간 · 지배 시간척도"}
  tau_p: {value: 3.264e-6, unit: s, expr: "m/gamma", role: "모델 검사 전용"}
  a_mean: {value: 7.490, unit: um, expr: "d sqrt(pi/(4 phi))", note: "= 1.498 d"}
  kT: {value: 4.1419e-21, unit: J}

# ── 무차원수 (두 스케일의 비) ──────────────────────────────────────────
dimensionless:
  reference: {length: d, time: tau_B, energy: kT, strategy: thermal}
  groups:
    - {name: "Gamma", expr: "U(a_mean)/kT = A (d/a_mean)^3",
       values: {A_0.1: 0.0297, A_1: 0.2975, A_10: 2.9749, A_100: 29.7486},
       meaning: "★ 이 계의 진짜 제어 파라미터. 결합 vs 열요동"}
    - {name: "phi", value: 0.35, meaning: "밀집도"}
    - {name: "a_mean/d", value: 1.498, meaning: "조밀계 (접촉 근방)"}
    - {name: "L/d", value: 29.96, meaning: "박스 = 입자 30개분"}
    - {name: "r_c/d", value: 7.49, meaning: "컷오프 = 5 a_mean"}
    - {name: "St", value: 1.349e-8, expr: "tau_p/tau_B", meaning: "관성 vs 확산"}

# ── 수치 (계마다 다름 — bd-physics §1.1) ───────────────────────────────
numerics:
  note: "dt는 A마다 다르다. 각 A에서 최근접 접근거리의 국소 곡률에서 역산."
  per_A:
    - {A: 0.1,   r_min_d: 0.924, dt_over_tau_B: 6.39e-6, limiter: "WCA 코어(유체)"}
    - {A: 1.0,   r_min_d: 0.937, dt_over_tau_B: 7.84e-6, limiter: "WCA 코어(유체)"}
    - {A: 10.0,  r_min_d: 0.997, dt_over_tau_B: 1.65e-5, limiter: "케이지 진동(결정)"}
    - {A: 100.0, r_min_d: 1.339, dt_over_tau_B: 3.59e-5, limiter: "케이지 진동(결정)"}
  production_tau_B: 100       # 통계 검사 T_obs ≥ 10² τ_B 를 만족하는 최소값
  equilibration: "측정으로 판정 (tools/postmortem.py EQ 진단). 선언하지 않는다"
  total_steps_estimate: 3.72e7   # 4개 A 합계. 독립 런이므로 병렬 실행 가능

# ── 실행 전에 반드시 할 것 ─────────────────────────────────────────────
required_convergence_checks:
  - id: CV1
    what: "dt 절반 수렴 — 비선형계라 편향 닫힌형태가 없다 (mater_plan §20 B)"
    target: "A=100 과 A=0.1 두 극단에서 g(r) 첫 피크 위치·높이가 안 움직이는지"
  - id: CV2
    what: "r_c 수렴 — r_c = 5, 7, 9 a_mean"
    target: "A=100 에서 g(r)·ψ₆ 비교. N=400이면 셋 다 최소이미지 안"
  - id: CV3
    what: "유한크기 — N = 400 vs 900 (같은 φ)"
    target: "강결합에서 상관길이 ξ < L/4 인지 사후 측정"

not_verified:
  - "A의 무차원 해석은 스케치 목표로부터의 추론이며 사용자 확인을 받지 않았다"
  - "r_min 추정(쌍 기준 5kT / 케이지 3σ)은 휴리스틱이다. 실행 후 실제 최소 접근거리를
     측정해 dt를 재검토해야 한다"
  - "Γ=29.7이 2D에서 결정인지는 확인하지 않았다. Lindemann 지표 u_rms/a = 0.035 는
     결정을 시사하나 판정은 실행 후 voronoi/ψ₆ 로 한다"
  - "문헌 대조 없음 (KB 문헌 0편). 2D r⁻³는 계면 상자성 콜로이드의 표준 모델로 알려져
     있고 녹음 전이의 Γ 값이 문헌에 있을 것으로 기억하나 **확인하지 않았다** —
     Phase 5에서 증류 대상"
