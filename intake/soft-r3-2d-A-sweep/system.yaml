# L2 PhysicalSystem — the dimensional physical system (SI). Rule 3: this is fixed first.
# Source: intake/soft-r3-2d-A-sweep/observation.yaml (human-confirmed 2026-08-03)
# Derivation: scratch/soft_r3_design.py  (reproducible)
# tier 0=direct input/handbook · 1=literature+verified / a confirmed convention
#      · 2=literature unverified · 3=arbitrary assumption

label: soft-r3-2d-A-sweep
derived_from: observation.yaml   # ★ the L2 invariant (§5.4): the L0 this system rests on
description: >
  Soft-repulsive colloids in a 2D periodic box. The amplitude A of the r⁻³ pair
  potential is swept over 4 decades and the final structure (rdf, voronoi) is
  examined. Newtonian fluid (water).
dimensions: 2

particle:
  diameter:
    value: 5.0
    unit: um
    source: "not stated in the sketch. Unified with the 'R = 5 µm' convention of the other three sketches — user-confirmed 2026-08-03"
    tier: 1
  density:
    value: 2000
    unit: kg/m^3
    source: "assumed silica. Used only for τ_p (the model-validity check); no effect on the BD result"
    tier: 3
  count:
    value: 400
    unit: dimensionless
    source: >
      The sketch says N = 100. That is not enough to reach the target coupling
      strength while respecting minimum image (r_c < L/2), so it was raised to 400 —
      user-confirmed 2026-08-03.
      At N=400 all three values r_c = 5, 7, 9 a_mean can be tested inside minimum
      image.
    tier: 1
    deviates_from_sketch: true

medium:
  kind: newtonian
  name: water
  temperature:
    value: 300
    unit: K
    source: "not stated in the sketch. Inherits the 300 K confirmed in 1-A (trap-2d-5um)"
    tier: 1
  viscosity:
    value: 0.851
    unit: mPa*s
    source: "handbook value for water @300K. The medium being water was confirmed in 1-A; this sketch does not state it"
    tier: 1

geometry:
  kind: periodic_square_2d
  area_fraction:
    value: 0.35
    unit: dimensionless
    source: "not stated in the sketch (without a density the A sweep is not defined). User-confirmed 2026-08-03"
    tier: 1
  box_length:                 # derived: L = a_mean √N
    value: 149.80
    unit: um
    source: "derived: φ=0.35, N=400, d=5µm  →  a_mean=7.490µm, L=30.0 d"
    tier: 1
  periodic: true
  source_note: "the sketch does not state a periodic boundary. Read as periodic given the rdf / final-structure goals (A4 unresolved)"

interactions:
  - kind: pair.soft_r3
    form: "U(r)/kT = A (d/r)^3"
    amplitude_A:
      value: [0.1, 1.0, 10.0, 100.0]
      unit: dimensionless
      source: "sketch:sketch_01.jpeg 'A = 0.1, 1, 10, 100'"
      tier: 0
      interpretation: >
        A was read as dimensionless and r in units of the diameter
        (observation.yaml A1).
        At d=5µm the alternative reading ([A]=µm³) gives Γ ≤ 0.24, putting the whole
        sweep below kT, which contradicts the sketch's structural-observation goal.
        ★ An inference from the goal — needs confirmation.
    cutoff:
      value: 37.45
      unit: um
      source: "r_c = 5 a_mean = 7.49 d. Set as a multiple of a_mean, not on an absolute kT criterion (A5)"
      tier: 1
      note: "the 2D r⁻³ tail energy converges only as 1/r_c — on an absolute criterion no
             r_c is sufficient. The structure is set at short range, so a multiple of
             a_mean is the right criterion. A convergence check is mandatory."
      shift: true

  - kind: pair.wca
    form: "WCA (the excluded-volume core)"
    sigma:
      value: 5.0
      unit: um
      source: "the core is placed at the particle diameter — user-confirmed 2026-08-03"
      tier: 1
    epsilon:
      value: 1.0
      unit: kT
      source: "the conventional value. Its role is to place the core, and at A≥10 the particles never reach it, so it is irrelevant"
      tier: 3
    cutoff: "2^(1/6) sigma = 5.612 um"

external: none

# ── observation targets (stated in the sketch) ─────────────────────────
targets:
  - name: final_configuration
  - name: radial_distribution_function     # g(r)
  - name: voronoi_tessellation
  - name: structure_analysis               # ψ₆ (hexagonal order), S(q), etc.

# ── derived scales (scratch/soft_r3_design.py) ─────────────────────────
derived_scales:
  gamma: {value: 4.0102e-8, unit: kg/s, expr: "3 pi eta d"}
  D_t: {value: 0.1033, unit: um^2/s, expr: "kT/gamma"}
  tau_B: {value: 242.05, unit: s, expr: "d^2/D_t", role: "the reference time and the governing timescale"}
  tau_p: {value: 3.264e-6, unit: s, expr: "m/gamma", role: "for the model check only"}
  a_mean: {value: 7.490, unit: um, expr: "d sqrt(pi/(4 phi))", note: "= 1.498 d"}
  kT: {value: 4.1419e-21, unit: J}

# ── dimensionless groups (ratios of two scales) ────────────────────────
dimensionless:
  reference: {length: d, time: tau_B, energy: kT, strategy: thermal}
  groups:
    - {name: "Gamma", expr: "U(a_mean)/kT = A (d/a_mean)^3",
       values: {A_0.1: 0.0297, A_1: 0.2975, A_10: 2.9749, A_100: 29.7486},
       meaning: "★ the real control parameter of this system. Coupling vs thermal fluctuation"}
    - {name: "phi", value: 0.35, meaning: "packing fraction"}
    - {name: "a_mean/d", value: 1.498, meaning: "a dense system (near contact)"}
    - {name: "L/d", value: 29.96, meaning: "the box is 30 particles across"}
    - {name: "r_c/d", value: 7.49, meaning: "the cutoff is 5 a_mean"}
    - {name: "St", value: 1.349e-8, expr: "tau_p/tau_B", meaning: "inertia vs diffusion"}

# ── numerics (per system — bd-physics §1.1) ────────────────────────────
numerics:
  note: "dt differs per A. It is inverted from the local curvature at the closest approach distance for each A."
  per_A:
    - {A: 0.1,   r_min_d: 0.924, dt_over_tau_B: 6.39e-6, limiter: "the WCA core (fluid)"}
    - {A: 1.0,   r_min_d: 0.937, dt_over_tau_B: 7.84e-6, limiter: "the WCA core (fluid)"}
    - {A: 10.0,  r_min_d: 0.997, dt_over_tau_B: 1.65e-5, limiter: "cage vibration (crystal)"}
    - {A: 100.0, r_min_d: 1.339, dt_over_tau_B: 3.59e-5, limiter: "cage vibration (crystal)"}
  production_tau_B: 100       # the smallest value satisfying the statistics check T_obs ≥ 10² τ_B
  equilibration: "decided by measurement (tools/postmortem.py EQ diagnosis). Never declared"
  total_steps_estimate: 3.72e7   # summed over the 4 A values. Independent runs, so they can run in parallel

# ── mandatory before running ───────────────────────────────────────────
required_convergence_checks:
  - id: CV1
    what: "dt halving convergence — a nonlinear system has no closed form for the bias (mater_plan §20 B)"
    target: "at the two extremes A=100 and A=0.1, whether g(r)'s first peak position and height stay put"
  - id: CV2
    what: "r_c convergence — r_c = 5, 7, 9 a_mean"
    target: "compare g(r) and ψ₆ at A=100. At N=400 all three are inside minimum image"
  - id: CV3
    what: "finite size — N = 400 vs 900 (at the same φ)"
    target: "measure after the fact whether the correlation length ξ < L/4 at strong coupling"

not_verified:
  - "the dimensionless reading of A is an inference from the sketch's goal and has not been user-confirmed"
  - "the r_min estimate (5kT on a pair basis / 3σ for the cage) is a heuristic. After running, the
     actual closest approach has to be measured and dt reconsidered"
  - "whether Γ=29.7 is a crystal in 2D was not confirmed. The Lindemann indicator u_rms/a = 0.035
     suggests a crystal, but the verdict comes after running, from voronoi and ψ₆"
  - "no literature comparison (0 papers in the KB). 2D r⁻³ is known as the standard model for
     interfacial paramagnetic colloids and I recall the melting-transition Γ being in the
     literature, but **I have not confirmed it** — a distillation target in Phase 5"
