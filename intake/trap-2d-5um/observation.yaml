# L0 Observation — what was read off the sketch. **Draft: awaiting human confirmation**
# Protocol: transcribe first → structure → state what is ambiguous or unread → leave
#           what is absent as null (never invent it)
# How to confirm: fill in confirmed: true/false on each item below, or correct the value.

source_files:
  - intake/trap-2d-5um/sketch_01.jpeg

# ── ① transcription (exactly as drawn. No interpretation) ──────────────
raw_transcription: |
  [left, the drawing]
    y axis (vertical) / x axis (horizontal), crossing at the origin
    one circle centred on the origin, with a small mark inside it
    "R = 5μm"  (with a line pointing at the circle)

  [right, the text]
    potential trap  at (0.0)
      U(r) = ½ k_t r²
      r = √(x² + y²)

    k_t = 10 pN/μm            T = 300 K. (~27°C)

# ── ② structured ──────────────────────────────────────────────────────
system_guess: "a Brownian particle in a 2D harmonic potential trap (optical-tweezer form)"

entities:
  - kind: particle
    note: "drawn as a circle near the origin. Appears to be 1, but not stated"
  - kind: external_potential
    form: "isotropic 2D harmonic"
    center: [0, 0]
    expression: "U(r) = 0.5 * k_t * r^2,  r = sqrt(x^2 + y^2)"

stated_quantities:
  - symbol: k_t
    value: 10
    unit: pN/um
    source: "lower right of the sketch, stated"
    confidence: 1
  - symbol: T
    value: 300
    unit: K
    source: "lower right of the sketch, stated (with ~27°C alongside)"
    confidence: 1
  - symbol: R
    value: 5
    unit: um
    source: "left of the sketch, pointing at the circle"
    confidence: 1
    note: "★ ambiguous what it is the radius of — see ambiguities"

stated_goals: []          # ★ no observation target is written on the sketch

# ── ③ what is ambiguous (must be filled in. If empty, look again) ──────
ambiguities:
  - id: A1
    issue: "what size is R = 5 µm?"
    options:
      - "the particle radius → d = 10 µm"
      - "the particle diameter → d = 5 µm"
    impact: |
      The equilibrium result ⟨x²⟩ = kT/k is independent of d, so there is no effect.
      Only the timescale differs, by exactly 2x (τ_k = 8.02 ms vs 4.01 ms).
    lean: "the particle radius (d=10µm)"
    resolution: "d = 5 µm (the diameter). User-confirmed 2026-08-03. → my guess was wrong"
    confirmed_by: user

  - id: A2
    issue: "how many particles are there?"
    note: "1 in the drawing. Whether to run several independent particles at once for statistics is a simulation choice."
    resolution: >
      Settled by execution: N = 1000 independent particles (the sketch shows 1). The particles in the trap do not interact, so it is purely a device for gaining a statistical multiple, and all 4 observables were confirmed to match their analytic solutions (runs/trap-2d-5um__a49f2508556b). A simulation choice (tier 3).
    confirmed_by: run     # settled by execution

  - id: A3
    issue: "what is to be measured? (no target written on the sketch)"
    note: |
      The abp-rod sketch had 'measure MSD, MSAD' but this one does not.
      Candidates: the position distribution P(x), ⟨x²⟩, position autocorrelation →
                  the relaxation time τ, the power spectrum (Lorentzian), inverting
                  for the trap stiffness (equipartition / PSD method)
    resolution: "all 4 of the proposed ones. User-confirmed 2026-08-03"
    confirmed_by: user

unread_regions: []        # nothing went unread. The handwriting is clear.

# ── ④ values absent from the sketch that have to be filled in (never
#      invented; the source is always stated) ──────────────────────────
missing_required:
  - symbol: eta
    what: "solvent viscosity"
    note: "the sketch does not say what the medium is. If water, 0.851 mPa·s at 300K (handbook, tier 0)"
    assumed_value: 0.851
    assumed_unit: mPa*s
    confidence: 1           # water confirmed (user, 2026-08-03). The value itself is handbook tier 0
    resolution: "water. User-confirmed 2026-08-03"
    confirmed_by: user
    followup: "a request to also do a non-Newtonian (viscoelastic) medium → a separate case via the medium.* module"

  - symbol: rho_p
    what: "particle density"
    note: "used only to compute τ_p (inertial relaxation). Silica 2000 / polystyrene 1050 kg/m³.
           No effect on the BD result; used only to decide whether the overdamped model is valid."
    assumed_value: 2000
    assumed_unit: kg/m^3
    confidence: 3           # an arbitrary assumption
    resolution: null

  - symbol: L
    kind: choice              # a simulation choice — it does not block L2
    what: "box size"
    note: "a simulation choice. ℓ_k=20nm, so any reasonable L has ample margin."
    resolution: null

  - symbol: dimensionality
    what: "is 2D settled?"
    note: "the sketch states x,y and r=√(x²+y²) → read as 2D. A real optical trap is 3D,
           but there is a convention of treating the axial direction separately."
    lean: "2D"
    resolution: "2D (the sketch states r=√(x²+y²))"
