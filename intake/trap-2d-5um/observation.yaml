# L0 Observation — 스케치에서 읽어낸 것. **초안: 사람 확인 대기**
# 프로토콜: 전사 먼저 → 구조화 → 모호/미판독 명시 → 없는 값은 null (지어내지 않음)
# 확인 방법: 아래 각 항목에 confirmed: true/false 를 채우거나 값을 고쳐주세요.

source_files:
  - intake/trap-2d-5um/sketch_01.jpeg

# ── ① 전사 (보이는 그대로. 해석 안 함) ─────────────────────────────────
raw_transcription: |
  [좌측 그림]
    y축(수직) / x축(수평), 원점에서 교차
    원점 중심의 원 하나, 원 안쪽에 작은 표시
    "R = 5μm"  (원을 가리키는 선과 함께)

  [우측 글]
    potential trap  at (0.0)
      U(r) = ½ k_t r²
      r = √(x² + y²)

    k_t = 10 pN/μm            T = 300 K. (~27°C)

# ── ② 구조화 ──────────────────────────────────────────────────────────
system_guess: "2D 조화 퍼텐셜 트랩 안의 브라운 입자 (광집게 형태)"

entities:
  - kind: particle
    note: "원점 부근에 원으로 그려짐. 개수는 1개로 보이나 명시 없음"
  - kind: external_potential
    form: "isotropic 2D harmonic"
    center: [0, 0]
    expression: "U(r) = 0.5 * k_t * r^2,  r = sqrt(x^2 + y^2)"

stated_quantities:
  - symbol: k_t
    value: 10
    unit: pN/um
    source: "스케치 우측 하단, 명시"
    confidence: 1
  - symbol: T
    value: 300
    unit: K
    source: "스케치 우측 하단, 명시 (~27°C 병기)"
    confidence: 1
  - symbol: R
    value: 5
    unit: um
    source: "스케치 좌측, 원을 가리킴"
    confidence: 1
    note: "★ 무엇의 반지름인지 모호 — ambiguities 참조"

stated_goals: []          # ★ 스케치에 관측 목표가 적혀 있지 않음

# ── ③ 모호한 것 (반드시 채울 것. 비어 있으면 다시 볼 것) ────────────────
ambiguities:
  - id: A1
    issue: "R = 5 µm 가 무엇의 크기인가?"
    options:
      - "입자 반지름 → d = 10 µm"
      - "입자 지름 → d = 5 µm"
    impact: |
      평형 결과 ⟨x²⟩ = kT/k 는 d에 무관하므로 영향 없음.
      시간척도만 정확히 2배 차이 (τ_k = 8.02 ms vs 4.01 ms).
    lean: "입자 반지름(d=10µm)"
    resolution: "d = 5 µm (지름). 사용자 확인 2026-08-03. → 내 추정이 틀렸음"
    confirmed_by: user

  - id: A2
    issue: "입자가 몇 개인가?"
    note: "그림에는 1개. 통계를 위해 독립 입자 여러 개를 동시에 돌릴지는 시뮬레이션 선택 사항."
    resolution: >
      실행으로 확정: N = 1000 독립 입자 앙상블 (스케치엔 1개). 트랩 안 입자들은 서로 상호작용하지 않으므로 통계 배수를 얻는 장치일 뿐이고, 관측량 4종이 해석해와 일치함을 확인했다 (runs/trap-2d-5um__a49f2508556b). 시뮬레이션 선택 사항 (tier 3).
    confirmed_by: run     # 실행으로 확정

  - id: A3
    issue: "무엇을 측정할 것인가? (스케치에 목표 미기재)"
    note: |
      abp-rod 스케치에는 'measure MSD, MSAD'가 있었으나 여기엔 없음.
      후보: 위치 분포 P(x), ⟨x²⟩, 위치 자기상관 → 이완시간 τ, 파워스펙트럼(Lorentzian),
            트랩 강성 역추정(equipartition / PSD 방법)
    resolution: "제시한 4종 전부. 사용자 확인 2026-08-03"
    confirmed_by: user

unread_regions: []        # 판독 못 한 부분 없음. 필기 선명.

# ── ④ 스케치에 없어서 채워야 하는 값 (지어내지 않고 출처 표기) ──────────
missing_required:
  - symbol: eta
    what: "용매 점도"
    note: "매질이 무엇인지 스케치에 없음. 물이라면 300K에서 0.851 mPa·s (핸드북, tier 0)"
    assumed_value: 0.851
    assumed_unit: mPa*s
    confidence: 1           # 물 확인됨 (사용자 2026-08-03). 값 자체는 핸드북 tier 0
    resolution: "물. 사용자 확인 2026-08-03"
    confirmed_by: user
    followup: "비뉴턴(점탄성) 매질도 하고 싶다는 요청 → medium.* 모듈로 별도 케이스"

  - symbol: rho_p
    what: "입자 밀도"
    note: "τ_p(관성 이완) 계산에만 쓰임. 실리카 2000 / 폴리스티렌 1050 kg/m³.
           BD 결과에는 영향 없고 '과감쇠 모델이 타당한가' 판정에만 사용."
    assumed_value: 2000
    assumed_unit: kg/m^3
    confidence: 3           # 임의 가정
    resolution: null

  - symbol: L
    kind: choice              # 시뮬레이션 선택 — L2를 막지 않는다
    what: "박스 크기"
    note: "시뮬레이션 선택 사항. ℓ_k=20nm 이므로 어떤 합리적 L이든 여유 충분."
    resolution: null

  - symbol: dimensionality
    what: "2D 확정?"
    note: "스케치가 x,y 와 r=√(x²+y²)로 명시 → 2D로 읽음. 실제 광집게는 3D이나
           축방향을 따로 보는 관례가 있음."
    lean: "2D"
    resolution: "2D (스케치가 r=√(x²+y²)로 명시)"
