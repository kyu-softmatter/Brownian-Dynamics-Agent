# L2 PhysicalSystem — the dimensional physical system (SI). Rule 3: this is fixed first.
# Source: intake/trap-2d-5um/observation.yaml (human-confirmed 2026-08-03)
# tier 0=direct input/handbook · 1=literature+verified · 2=literature unverified
#      · 3=arbitrary assumption

label: trap-2d-5um
derived_from: observation.yaml   # ★ the L2 invariant (§5.4): the L0 this system rests on
description: a Brownian particle in a 2D harmonic potential trap (optical tweezers). Newtonian fluid (water).
dimensions: 2

particle:
  diameter:
    value: 5.0
    unit: um
    source: "sketch:sketch_01.jpeg 'R = 5μm' + user confirmation (it is the diameter)"
    tier: 0
  density:
    value: 2000
    unit: kg/m^3
    source: "assumed silica. Used only for τ_p (the model-validity check); no effect on the BD result"
    tier: 3
  count:
    value: 1000
    unit: dimensionless
    source: "a simulation choice — an ensemble of independent particles for statistics. The sketch shows 1"
    tier: 3

medium:
  kind: newtonian
  name: water
  temperature:
    value: 300
    unit: K
    source: "sketch:sketch_01.jpeg 'T = 300 K. (~27°C)'"
    tier: 0
  viscosity:
    value: 0.851
    unit: mPa*s
    source: "handbook value for water @300K. The medium being water is user-confirmed"
    tier: 0

external:
  kind: harmonic_trap
  form: "U(r) = 0.5 * k_t * r^2,  r = sqrt(x^2 + y^2)"
  center: [0, 0]
  stiffness:
    value: 10
    unit: pN/um
    source: "sketch:sketch_01.jpeg 'k_t = 10 pN/μm'"
    tier: 0

interactions: none          # no pair potential — the particles are independent

# ── observation targets (user-confirmed: all 4) ────────────────────────
targets:
  - name: position_distribution      # P(x)  — Gaussian, σ = sqrt(kT/k)
  - name: mean_square_displacement   # <x²>  — kT/k
  - name: autocorrelation            # C(t)  — (kT/k)exp(-t/τ_k)
  - name: power_spectral_density     # S(f)  — Lorentzian, f_c = k/(2πγ)

# ── numerical targets (§1.2: dt is inverted from the bias) ─────────────
numerics:
  target_bias: 0.001        # 0.1% → dt/τ_fast = 2e-3
  equilibration_tau: 20     # multiples of the governing timescale (τ_k)
  production_tau: 2000
  samples_per_tau: 10       # time resolution for C(t) and the PSD
