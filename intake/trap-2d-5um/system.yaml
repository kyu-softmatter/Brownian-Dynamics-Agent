# L2 PhysicalSystem — 차원 있는 물리계 (SI). 원칙 3: 이것이 먼저 확정되어야 한다.
# 출처: intake/trap-2d-5um/observation.yaml (사람 확인 완료 2026-08-03)
# tier 0=직접입력/핸드북 · 1=문헌+검증 · 2=문헌 미검증 · 3=임의 가정

label: trap-2d-5um
derived_from: observation.yaml   # ★ L2 불변식 (§5.4): 이 물리계의 근거 L0
description: 2D 조화 퍼텐셜 트랩 안의 브라운 입자 (광집게). 뉴턴 유체(물).
dimensions: 2

particle:
  diameter:
    value: 5.0
    unit: um
    source: "sketch:sketch_01.jpeg 'R = 5μm' + 사용자 확인(지름)"
    tier: 0
  density:
    value: 2000
    unit: kg/m^3
    source: "실리카 가정. τ_p(모델 타당성 검사)에만 사용, BD 결과에 영향 없음"
    tier: 3
  count:
    value: 1000
    unit: dimensionless
    source: "시뮬레이션 선택 — 독립 입자 앙상블로 통계 확보. 스케치엔 1개"
    tier: 3

medium:
  kind: newtonian
  name: water
  temperature:
    value: 300
    unit: K
    source: "sketch:sketch_01.jpeg 'T = 300 K. (~27°C)'"
    tier: 0
  viscosity:
    value: 0.851
    unit: mPa*s
    source: "물 @300K 핸드북값. 매질이 물임은 사용자 확인"
    tier: 0

external:
  kind: harmonic_trap
  form: "U(r) = 0.5 * k_t * r^2,  r = sqrt(x^2 + y^2)"
  center: [0, 0]
  stiffness:
    value: 10
    unit: pN/um
    source: "sketch:sketch_01.jpeg 'k_t = 10 pN/μm'"
    tier: 0

interactions: none          # 페어 퍼텐셜 없음 — 입자들은 서로 독립

# ── 관측 목표 (사용자 확인: 4종 전부) ──────────────────────────────────
targets:
  - name: position_distribution      # P(x)  — Gaussian, σ = sqrt(kT/k)
  - name: mean_square_displacement   # <x²>  — kT/k
  - name: autocorrelation            # C(t)  — (kT/k)exp(-t/τ_k)
  - name: power_spectral_density     # S(f)  — Lorentzian, f_c = k/(2πγ)

# ── 수치 목표 (§1.2: 편향으로 dt 역산) ─────────────────────────────────
numerics:
  target_bias: 0.001        # 0.1% → dt/τ_fast = 2e-3
  equilibration_tau: 20     # 지배 시간척도(τ_k)의 배수
  production_tau: 2000
  samples_per_tau: 10       # C(t)·PSD 시간 해상도

# ── structural choices — the basis for this case's dimensionality (D9) ──────
#  knowledge/wiki/concepts/dimensionality-has-no-default.md
#  Not hashed into run_id: `dimensions` above is the physics value; this records
#  why. `physical.check_dim` cross-checks the two.
structure:
  dim:
    value: 2
    basis: given
    source_kind: artefact
    source_file: sketch_01.jpeg
    source: >-
      sketch_01.jpeg "U(r) = 1/2 k_t r^2,  r = sqrt(x^2+y^2)" — the formula
      fixes the plane, and that is checkable from the image alone.
      observation.yaml resolves `dimensionality` to "2D (스케치가 r=√(x²+y²)로
      명시)"; the 2026-08-03 date is the file-level confirmation in this file's
      own header (`사람 확인 완료 2026-08-03`), not a per-entry one.
    alternatives: [3]
    why_not: >-
      A real optical trap is 3D and L0 says so ("실제 광집게는 3D이나 축방향을 따로
      보는 관례가 있음"). `sufficient` ALSO holds here — no pair interactions and a
      separable harmonic trap make x, y, z exactly independent — but `given` takes
      precedence, so that is corroboration rather than the basis.
    what_would_change: >-
      Nothing for the observables this case measures: <x^2>, C(t), the PSD and
      f_c = k_t/(2 pi gamma) are per-component and carry no `dim`. It WOULD change
      <r^2> = dim*kT/k (x1.5) and the total MSD = 2*dim*D*t. Adding either of
      those makes the dimension load-bearing again.
  size:
    role: replication
    n: 1000
    n_physical: 1
    n_replicas: 1000
    stated_in_source: null      # the source is silent on N
    fixed_by: confirmed_by_run
    what_would_change: >-
      Nothing physical. The 1000 do not interact, so the box is a container for
      replicas and not a system: anchors sit on a 1d lattice (L = 32 d) and
      l_k = 20.4 nm = 0.00407 d, so anchor->edge is 123 l_k and anchor->anchor
      246 l_k. Raising n_replicas shrinks the error bar only; at N = 1000 the
      achieved statistical error on <x^2> is +/-0.0481%
      (runs/trap-2d-5um__a5ef4f45d589).
      ⚠ CORRECTED 2026-09-11: that was written "against goal.yaml's 5% target",
      but goal.yaml's decisive_precision is 5% ON f_c, its answering_quantity --
      a different observable. The comparison that belongs here is f_c's own
      error, +1.17%, against the 5%. <x^2>'s +/-0.0481% has no stated target.
      ⚠ +/-0.594% is the N = 200 SMOKE run (runs/trap-2d-5um__ed80885e01b3);
      quoting it beside N = 1000 was wrong by 12x, caught in review.
      ⚠ The original record justifies 1000 only as "a device to get a statistics
      multiple", settled `confirmed_by: run` after the four observables matched
      the analytic solution -- it was not inverted from a target.
      ⚠ NOT VERIFIED, recorded as a question: the existing check is `2 l_k / L`,
      i.e. the fluctuation against the whole box, while the distance a replica
      would actually have to cross is anchor->edge = 0.5 d. If that reading is
      right the check is 64x looser than the constraint it stands for -- but the
      check's own basis line says it guards the box, not the lattice cell, so
      the two may simply be guarding different things. Both pass here (123x).
