# L2 PhysicalSystem — `chain-relax-2d-dlvo`: the undriven (free-relaxation) counterpart of chain-bend-2d-dlvo.
# Literature: [P1] Pantina & Furst, PRL 94, 138301 (2005)
#             [P2] Pantina & Furst, Langmuir 24, 1141-1146 (2008)
# The properties and the DLVO derivation are all inherited from chain-bend-2d-dlvo (exactly as
# user-approved 2026-08-05) — what is newly fixed here is only external (none) and the initial
# condition (the initial condition itself is numerics/params, taken by the case script as the
# --init/--kink-angle arguments rather than by this YAML).
# tier 0=sketch · 1=user-fixed/derived · 2=extracted from the literature · 3=★my proposal (uncertainty stated)

label: chain-relax-2d-dlvo
derived_from: intake/chain-relax-2d-dlvo/observation.yaml
description: >
  A chain physically identical to chain-bend-2d-dlvo (the same PMMA beads, DLVO
  secondary-minimum bonds, no explicit bending/friction), but with the trap and oscillation
  driving removed entirely, watching only free relaxation (rule 8: build the static system
  first and add motion afterwards — this case is the "static stage" that chain-bend-2d-dlvo
  skipped). Two experiments: (a) a straight chain thermalized — the equipartition golden test
  of the bond's stretching (radial) degree of freedom. (b) impose an exact kink angle on the
  middle bond, release it, and observe whether the bow recovers elastically or spreads out
  diffusively.
dimensions: 2

particle:
  shape: sphere
  diameter:
    value: 1.47
    unit: um
    source: "[P1] p.1 '2a = 1.47 ± 0.01 µm' PMMA — inherited from chain-bend-2d-dlvo"
    tier: 2
  density:
    value: 1180
    unit: kg/m^3
    source: "★proposal: PMMA. Used only for τ_p (St, the model-validity check) — inherited from chain-bend-2d-dlvo"
    tier: 3
  surface_potential:
    value: 40
    unit: mV
    source: "[P1] p.1 'measured surface potential 40 ± 3 mV' — inherited from chain-bend-2d-dlvo"
    tier: 2
  count:
    value: [9]
    unit: dimensionless
    source: >
      ★proposal: the pilot chain length. Matched to the n=9 used most often in
      chain-bend-2d-dlvo so the two can be compared (observation.yaml missing_required:n_beads).
      Overridden with --n.
    tier: 3

medium:
  kind: newtonian
  name: water
  temperature: {value: 300, unit: K, source: "inherited from 1-A → inherited from chain-bend-2d-dlvo", tier: 1}
  viscosity: {value: 0.851, unit: mPa*s, source: "handbook, water@300K — inherited from chain-bend-2d-dlvo", tier: 1}
  relative_permittivity: {value: 78.5, unit: dimensionless, source: "handbook, water@298K (CRC) — inherited", tier: 1}
  ionic_strength:
    value: 10
    unit: mM
    source: >
      One of the MgCl2 concentrations [P1] swept (~10mM). Inherited verbatim from the value
      chain-bend-2d-dlvo settled on — the reason that case excluded 250mM (diverging with no
      barrier) and adopted 10mM (the textbook curve) applies to this case unchanged.
    tier: 2
    note: "MgCl2 (a 2:1 electrolyte). I = ½Σcᵢzᵢ² = 0.75×c_salt"

# ── interactions: a central pair potential only. No angle term, no friction term (deliberately) ──
interactions:
  - kind: pair.dlvo_secondary_minimum
    form: "U(h) = U_edl(h) + U_vdw(h), h=surface gap. HHF (constant potential, weak overlap) + Derjaguin non-retarded vdW"
    rationale: >
      The exact same expressions and implementation as chain-bend-2d-dlvo
      (dlvo_reduced_params/find_well/build_table_arrays/U_star/F_h_star in
      cases/chain_bend_dlvo_2d.py) are imported as they are — not redefined (this being the
      second case, it follows the precedent network already set by reusing them the same way).
      In practice it only acts on NN (nearest-neighbour) pairs (the cutoff is narrow), but
      being a global pair potential, non-adjacent beads can interact once the chain folds —
      which is not prevented (that is the real physics, and it connects directly to the
      "triangular" possibility of [P1]).
    hamaker_constant:
      value: 1.05e-20
      unit: J
      source: >
        A web-search value (PMMA-water-PMMA, primary source unconfirmed). Independently
        cross-checked in chain-bend-2d-dlvo: the Tabor-Winterton approximation (handbook
        permittivity and refractive index) gives A_calc=9.40e-21 J
        (−10.5%, the same order). Sensitivity checked: changing A by 4× keeps the well depth in
        the −4.9 to −25.5 kT range, which does not reach a JKR-scale bending stiffness — so the
        conclusion "the attraction is weak" is stable against the uncertainty in A. Full
        derivation: intake/chain-bend-2d-dlvo/system.yaml.
      tier: 2
    debye_length:
      value: 1.7618
      unit: nm
      source: "derived: κ⁻¹=√(ε0·εr·kT/(2·NA·e²·I)), MgCl2 10mM — inherited from chain-bend-2d-dlvo"
      tier: 1
    barrier_height:
      value: 416.390
      unit: dimensionless
      source: >
        derived: max U_tot(h)/kT @ h=0.508nm. Recomputed directly with the
        cases/chain_bend_dlvo_2d.find_well() this case imports (a 4000-point grid) —
        as network/system.yaml pointed out, the documented value in
        chain-bend-2d-dlvo/system.yaml (381.70@0.489nm) is an 8.3% low value coming out of the
        old dlvo_ledger.py (a coarse grid), so it is not used here and the recomputed value
        is adopted.
      tier: 1
      note: "unit=kT. Guarantees that a thermal transition into the primary minimum is effectively impossible"
    well_depth:
      value: -11.7155
      unit: dimensionless
      source: "derived (the same recomputation): the secondary minimum of U_tot(h)/kT @ h=11.161nm"
      tier: 1
      note: "unit=kT. On the scale of the thermal energy → the bond may be reversible/breakable"
    well_location:
      value: 11.161
      unit: nm
      source: "derived: argmin U_tot(h) (past the barrier)"
      tier: 1
    bond_stiffness:
      value: 1.99797e-3
      unit: N/m
      source: "derived: d²U_tot/dh² @ well_location = 1.042363e6 kT/d² (recomputed, 4000-point grid)"
      tier: 1
      note: "the radial (stretching) stiffness. The only harmonic (linear) stiffness mode in this case — dt is set from it too"
    max_tension:
      value: 810.412
      unit: dimensionless
      source: >
        derived: max|F_h_star(h)| for h>h_min (h*=0.009946, h=14.62nm — 3.46nm outside
        well_location). The criterion for the L3 geometry check (a safety check, not hard) of
        whether the bond stretching of the kink initial condition exceeds this value. Agrees on
        recomputation with the 810.4 kT/d of dlvo_tension_stiffening.py (a 1-D analysis) —
        a cross-check.
      tier: 1
      note: "unit=kT/d. Past this point the restoring force starts to weaken (outside the well; not
             rupture — out to the cutoff 0.06d=88nm it is still attractive)"

external: none   # ★★ the core difference of this case — no trap, no oscillation, no ghost particle

targets:
  - name: bond_length_variance      # ★ the equipartition golden test — compared against kT/k_bond
  - name: bend_angle_variance       # the thermal fluctuation of dtheta_i (G1: no grounds for it to be harmonic)
  - name: bow_relaxation            # kink → the relaxation time series (elastic recovery vs diffusion)
  - name: nnn_folding               # do next-nearest beads enter each other's DLVO well

derived_scales:
  source: "recomputed with cases/chain_bend_dlvo_2d.dlvo_reduced_params/find_well (2026-08-06),
           bdbot.materials.sphere_bulk. The physics is the same as chain-bend-2d-dlvo, so the derived values are the same."
  kT: {value: 4.141947e-21, unit: J, expr: "k_B T"}
  gamma: {value: 1.179011e-8, unit: kg/s, expr: "3 pi eta d"}
  D_t: {value: 3.513068e-13, unit: m^2/s, expr: "kT/gamma"}
  tau_B: {value: 6.151034, unit: s, expr: "d^2/D_t"}
  tau_p: {value: 1.664618e-7, unit: s, expr: "m/gamma", role: "inertial relaxation — for the model check only"}
  tau_bond:
    value: 5.901049e-6
    unit: s
    expr: "gamma/k_bond"
    role: "★★ the only stiffness mode in this system — it sets dt. tau_p/tau_bond=0.0282
           (2.8× over the 1e-2 criterion for neglecting inertia — the same unverified
           status as chain-bend-2d-dlvo; the physics is the same, so it is not re-verified)"
  sigma_bond: {value: 1.43982, unit: nm, expr: "sqrt(kT/k_bond)", role: "the width of the bond's stretching thermal fluctuation — the golden test's predicted value"}
  ell: {value: 1481.161, unit: nm, expr: "d + h_min", role: "bond length (the natural centre-to-centre length)"}

dimensionless:
  reference: {length: d, time: tau_B, energy: kT, strategy: thermal}
  groups:
    - {name: "well_depth/kT", value: -11.7155, meaning: "★ the bond is on the scale of the thermal energy — reversible"}
    - {name: "barrier/kT", value: 416.390, meaning: "a transition to the primary minimum is effectively impossible"}
    - {name: "bond_stiffness_star", value: 1.042363e6, meaning: "k_bond d²/kT — the stretching stiffness (not bending; bending is 0)"}
    - {name: "tau_bond/tau_B", value: 9.5931e-7, meaning: "6 orders of scale separation"}
    - {name: "St", value: 2.8209e-2, meaning: "tau_p/tau_bond — 2.8× over the criterion for neglecting inertia (soft, inherited)"}

numerics:
  dt:
    value: null
    unit: null
    source: "derived in L3 (cases/chain_relax_2d_dlvo.py) as dt = 1e-2 x tau_bond —
             tau_bond being the only stiffness mode in this system, there is no need to
             compare against trap/bending candidates (chain-bend-2d-dlvo had the trap tau_k as a candidate too)."
    tier: 1
  production_note: >
    The observation window needs only 'the equipartition statistics of the local bond mode',
    not 'the relaxation of the whole chain's shape' (tau_chain_diff ~ 1e7 tau_bond, see
    chain-bend-2d-dlvo), so it is far shorter — observation.yaml R2. Straight/thermalized
    T_obs=2e4 tau_bond, kink relaxation T_obs=3e3 tau_bond (the point being to catch the transient).
  stat_target_pct: 5.0
  equilibration: "straight mode: taken cheaply as a multiple of the local (bond) relaxation
                  (eq_scale x tau_bond/dt, inheriting the chain-bend-2d-dlvo convention). Kink
                  mode: no equilibration — recording starts right at t=0 (the moment of release),
                  the relaxation itself being what is observed."

not_verified:
  - "★★ the core unverified item: whether the equipartition of the bond's stretching (radial)
     degree of freedom (⟨δℓ²⟩=kT/k_bond) holds exactly in the DLVO table potential transplanted
     into this case — chain-bend-2d-dlvo has the trap and the driving mixed in, so it never
     isolated and measured purely thermalized bond stretching. If it is off, it is a transplant bug."
  - "★★ the core unverified item (hypothesis): the fluctuation width of the bending (angular)
     degree of freedom — G1 only says 'the linear stiffness is 0' and predicts nothing about the
     actual magnitude of the fluctuation (higher-order terms dominate). This run is the first
     measurement of that magnitude — measurement, since there is no prediction."
  - "Whether the NNN (two-bonds-away) gap keeps enough margin outside the cutoff (0.06d) at the
     kink angle 0.30 rad · n=9 combination is checked by the L3 geometry check, but the criterion
     for 'enough' (the safety factor) is a ★proposal"
  - "The unverified status of tau_p/tau_bond=0.0282 is equally unverified in chain-bend-2d-dlvo —
     the same particle and the same bond, so once that case verifies it, this case is verified along with it"
  - "The Hamaker constant (1.05e-20 J) has an unconfirmed primary source (tier 2) — the same
     uncertainty as the chain-bend-2d-dlvo inheritance. If the conclusion becomes sensitive to the
     value of A (if the well moves up and down around kT), it needs re-confirming"
