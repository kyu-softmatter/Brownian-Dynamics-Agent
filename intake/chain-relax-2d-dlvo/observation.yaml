# ── ① 전사 ──────────────────────────────────────────────────────────────
raw_transcription: |
  스케치 없음. 물성·DLVO 유도(장벽·2차극소·결합강성)는 전부
  intake/chain-bend-2d-dlvo/{observation,system}.yaml 를 그대로 승계한다
  ([P1] Pantina & Furst PRL 94 138301 · [P2] Langmuir 24 1141, 사용자 승인
  2026-08-05일자 확인 그대로). 이번에 새로 결정하는 것은 두 가지뿐이다 —
  ① 구동 방식: 트랩·오실레이션 없음 (자유 이완, external 섹션 없음)
  ② 초기조건: 직선(straight) 또는 중앙 한 곳에 정확한 킹크각 Δφ를 준 상태(kink) —
     둘 다 모든 결합이 정확히 자연장(ell)에서 시작하도록 놓는다 (신장 신호와
     굽힘 신호가 섞이지 않게).

system_guess: >
  chain-bend-2d-dlvo 와 물리적으로 동일한 사슬(같은 PMMA 비드, 같은 DLVO 2차극소
  결합, 명시적 각도/굽힘 퍼텐셜 없음, 입자간 마찰 없음 — BD 자체에 마찰력 항이
  없고 md.pair.friction 도 쓰지 않는다)이지만, 트랩·오실레이션을 전부 떼어내고
  자유 이완만 본다. 두 실험:
    (a) 직선 사슬을 열평형시켜 각 결합의 국소 굽힘각(dtheta_i) 열요동을 잰다
        — 순수 중심력 결합의 골든 테스트(트랩의 ⟨x²⟩=kT/k 와 같은 종류지만,
        결합 "신장"(radial) 방향에만 적용된다 — "굽힘"(각) 방향은 G1에 의해
        선형 등분배가 성립하지 않을 것으로 예상된다).
    (b) 중앙 한 결합에 정확한 킹크각 Δφ를 준 뒤 풀어서, 굽음(bow)이 시간에 따라
        0으로 "탄성 복원"되는지(=숨은 굽힘강성=버그) 아니면 그냥 확산적으로
        흩어지는지(=G1 확인) 본다.

