# L0 Observation — no new sketch. The static (undriven) counterpart of `chain-bend-2d-dlvo`.
# Protocol: transcribe first → structure → state what is ambiguous/unread → absent values stay null (never invented)
# Why this case exists: the user asked to "build a chain system, implemented as a situation
# where there is no inter-particle friction and only inter-particle attraction"
# (2026-08-06). That physics (DLVO secondary-minimum attraction only, no explicit
# bending/friction) is already what `chain-bend-2d-dlvo` has, but that case has
# trap + oscillation driving on top of it from the start. This case is the "static stage"
# of rule 8 (build the static system first and add motion afterwards); when
# chain-bend-2d-dlvo was originally built this stage was skipped and the dynamic
# experiment was run straight away (G1 was only derived algebraically, never checked
# directly by undriven free relaxation).

source_files: []   # no new sketch — see below

# ── ① transcription ─────────────────────────────────────────────────────
raw_transcription: |
  No sketch. The properties and the DLVO derivation (barrier, secondary minimum, bond
  stiffness) are inherited verbatim from
  intake/chain-bend-2d-dlvo/{observation,system}.yaml
  ([P1] Pantina & Furst PRL 94 138301 · [P2] Langmuir 24 1141, exactly as
  user-approved and confirmed on 2026-08-05). Only two things are newly fixed here —
  ① the driving: no trap, no oscillation (free relaxation, no external section)
  ② the initial condition: either straight, or with an exact kink angle Δφ imposed at
     one point in the middle (kink) — both place every bond starting exactly at its
     natural length (ell), so that the stretching signal and the bending signal do
     not mix.

system_guess: >
  A chain physically identical to chain-bend-2d-dlvo (the same PMMA beads, the same
  DLVO secondary-minimum bonds, no explicit angle/bending potential, no inter-particle
  friction — BD itself has no friction-force term and md.pair.friction is not used
  either), but with the trap and the oscillation stripped out entirely, watching only
  free relaxation. Two experiments:
    (a) thermalize a straight chain and measure the thermal fluctuation of each bond's
        local bending angle (dtheta_i) — the golden test of a purely central-force bond
        (the same kind as a trap's ⟨x²⟩=kT/k, but it applies only to the bond's
        "stretching" (radial) direction — in the "bending" (angular) direction linear
        equipartition is expected not to hold, by G1).
    (b) impose an exact kink angle Δφ on the middle bond, release it, and see whether
        the bow "recovers elastically" toward 0 over time (= a hidden bending stiffness
        = a bug) or simply spreads out by diffusion (= G1 confirmed).

entities:
  - kind: particle
    note: "a chain of PMMA beads — inherited from chain-bend-2d-dlvo, no new information"
  - kind: bonded_interaction
    form: "DLVO(r) secondary minimum — central force, no torque. The exact same
           dlvo_reduced_params/find_well/build_table_arrays as chain-bend-2d-dlvo are
           imported and used as they are
           (this being the second case, they are not redefined — whether to lift them into
           bdbot/ is a call for when a third appears)."
  - kind: external
    note: "none. Trap, oscillation and ghost particle all excluded — the core difference of this case"
  - kind: initial_condition
    note: "new — straight, or kink (a bond-angle offset Δφ imposed in the middle). See missing_required below"

stated_quantities: []   # no sketch — for the properties, system.yaml inherits chain-bend-2d-dlvo directly

stated_goals:
  - "Confirm G1 (a straight chain + purely central forces + bonds at natural length ⟹ the
     transverse linear bending stiffness is exactly 0) directly by running the minimal
     undriven configuration — so far it has only been backed by the algebraic derivation and
     by the oscillation-driven result (the stiffness converging to 0); free relaxation itself
     has never been watched."
  - "Confirm that the bond's stretching (radial) degree of freedom passes an equipartition
     golden test of the same kind as a trap's ⟨x²⟩=kT/k (= re-confirming that the DLVO table
     potential transplanted into this case is implemented correctly) — implementation_check."
  - "Observe descriptively how the bow relaxes once the kink is released (elastic recovery vs
     vanishing by diffusion) — measurement, since there is no rigorous prior prediction."
  - "Observe whether the 'triangular local kink' predicted by [P1] p.2 is geometrically
     possible in this minimal configuration too (whether next-nearest beads enter each
     other's DLVO well) — measurement."

# ── ③ what is ambiguous ─────────────────────────────────────────────────
ambiguities:
  - id: R1
    issue: "what value should the kink angle Δφ be given?"
    detail: >
      The width of the bond's stretching (radial) thermal fluctuation is already known
      (σ_bond=1.44nm, inherited from chain-bend-2d-dlvo). But in the "bending" (angular)
      direction there is no linear equipartition, by G1, so there is no prior thermal
      fluctuation scale to compare against — this experiment is itself the measurement of
      that scale. So Δφ is proposed as a value "large enough to be clearly visible but not
      so large that the two arms enter each other's cutoff and form a new bond prematurely".
    lean: "Δφ = 0.30 rad (17.2°) — whether the NNN (two-bonds-away) gap keeps enough margin
           against the cutoff (0.06d) at n=9 is checked geometrically in L3 (not hard, informational)"
    resolution: null
    proposed_by: assistant

  - id: R2
    issue: "how long an observation window does the bond-equipartition (radial) golden test need?"
    detail: >
      τ_bond=5.90µs is the only fast scale in this system, so the correlation time is taken to
      be in its vicinity too. Collecting enough independent samples needs thousands to tens of
      thousands of times τ_bond — unlike chain-bend-2d-dlvo, which waits all the way out to
      τ_chain_diff (the relaxation of the whole chain's shape, ~1e7 τ_bond), this
      measurement watches only the "local" radial mode and is far cheaper (for the same reason
      dt is also set from τ_bond).
    lean: "T_obs = 2×10⁴ τ_bond (straight, thermalized) / 3×10³ τ_bond (kink relaxation; the
           point is to catch the transient, so shorter is acceptable)"
    resolution: null
    proposed_by: assistant

unread_regions: []   # no sketch

# ── ⑤ values to be newly fixed in this case (a simulation choice, not a physical gap) ──
missing_required:
  - symbol: n_beads
    what: "pilot chain length"
    kind: choice
    assumed_value: 9
    assumed_unit: dimensionless
    confidence: 3
    note: "matched to the value used most often in chain-bend-2d-dlvo (n=9) so the two can be
           compared. Can be overridden with --n (a script argument)."
    resolution: "pilot at n=9. Awaiting user confirmation"

  - symbol: kink_angle
    what: "the bond-angle offset Δφ of the kink initial condition"
    kind: choice
    assumed_value: 0.30
    assumed_unit: radian
    confidence: 3
    note: "see R1. Overwhelmingly larger than the thermal fluctuation (there being no prior scale,
           the relative comparison is only possible after running), and whether it stays in the
           range that forms no premature NNN bond is checked by the L3 geometry check."
    resolution: "pilot at 0.30 rad. Awaiting user confirmation"

  - symbol: T_obs_straight, T_obs_kink
    what: "observation window (multiples of τ_bond)"
    kind: choice
    assumed_value: null
    note: "see R2. straight/thermalized=2e4 τ_bond (≈300k steps), kink relaxation=3e3 τ_bond
           (≈200k steps) — both cheap (a few hundred thousand steps, against the billions of
           steps of the existing cases). Fixed in L3."
    resolution: null

  - symbol: n_seeds
    what: "number of ensemble seeds — the pilot starts with 1 (a single run)"
    kind: choice
    assumed_value: 1
    assumed_unit: dimensionless
    confidence: 3
    note: "the bow(t) of the kink relaxation is noisy with a single seed. Once the pilot has
           confirmed the code and the design, extend to an ensemble (say 8–16 seeds) —
           chain-bend-2d-dlvo actually followed this order (single-seed pilot → seed extension)."
    resolution: "pilot=1. Extension after user confirmation"

prerun_findings:
  - id: G1_import
    severity: "informational"
    finding: >
      G1 itself (that the bond energy is O(y⁴) in the transverse displacement y) was already
      derived algebraically in chain-bend-2d-dlvo and this case does not re-derive it. What this
      case adds is (a) confirming that structural fact directly by running the minimal
      configuration with **no driving at all**, and (b) that the bond's "stretching" degree of
      freedom should be normally harmonic independently of G1 (the radial golden test) — that
      has not yet been measured directly in any case (chain-bend-2d-dlvo has the trap and the
      driving mixed in, so it never isolated purely thermalized bond stretching).
    consequence: "If radial equipartition is off, it means the transplanted DLVO table potential
                  (the bdbot reuse) has a bug — FAIL. If the angular (bending) degree of freedom
                  is off (= a linear stiffness with a lower bound is found), it means either G1
                  itself is wrong or this implementation has a new coupling path (e.g. a
                  non-adjacent interaction outside the cutoff) — report it as a result."
    verified: false
