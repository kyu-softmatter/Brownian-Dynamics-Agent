ambiguities:
  - id: R1
    issue: "킹크각 Δφ 를 얼마로 줄 것인가?"
    detail: >
      결합의 신장(radial) 열요동 폭은 이미 알려져 있다(σ_bond=1.44nm, chain-bend-2d-dlvo
      승계). 그런데 "굽힘(각)" 방향은 G1 에 의해 선형 등분배가 없어 비교할 사전 열요동
      척도가 없다 — 이 실험 자체가 그 척도를 재는 것이다. 그래서 Δφ 는 "명확히 보일
      만큼 크지만 두 팔이 서로의 컷오프 안에 들어가 조기에 새 결합을 만들 만큼 크지는
      않은" 값으로 제안한다.
    lean: "Δφ = 0.30 rad (17.2°) — n=9 기준 NNN(2결합 건너) 간극이 컷오프(0.06d) 대비
           충분히 남는지 L3 에서 기하로 검사한다 (하드 아님, 정보용)"
    resolution: null
    proposed_by: assistant

  - id: R2
    issue: "결합 등분배(라디얼) 골든테스트의 관측창은 얼마나 필요한가?"
    detail: >
      τ_bond=5.90µs 가 이 계의 유일한 빠른 척도라 상관시간도 그 근방일 것으로 본다.
      독립표본을 충분히 모으려면 τ_bond 의 수천~수만 배가 필요하다 — chain-bend-2d-dlvo
      가 τ_chain_diff(사슬 전체 형태 이완, ~1e7 τ_bond)까지 기다리는 것과 달리, 이
      측정은 "국소" 라디얼 모드만 봐서 훨씬 싸다(같은 이유로 dt 도 τ_bond 로 정한다).
    lean: "T_obs = 2×10⁴ τ_bond (직선 열평형) / 3×10³ τ_bond (킹크 이완, 과도 구간
           포착이 목적이라 더 짧아도 됨)"
    resolution: null
    proposed_by: assistant

