  - "G1(직선 사슬 + 순수 중심력 + 자연장 결합 ⟹ 횡방향 선형 굽힘강성이 정확히 0)을
     구동 없는 최소 구성에서 직접 실행으로 확인한다 — 지금까지는 대수적 유도와
     오실레이션 구동 결과(강성이 0으로 수렴)로만 뒷받침됐지, 자유 이완 자체를
     본 적은 없다."
  - "결합의 신장(radial) 자유도가 트랩의 ⟨x²⟩=kT/k 와 같은 종류의 등분배
     골든 테스트를 통과하는지 확인한다 (= 이 케이스로 이식한 DLVO 표 퍼텐셜
     구현이 맞는지 재확인) — implementation_check."
  - "킹크를 준 뒤 풀었을 때 굽음(bow)이 어떻게 이완하는지 서술적으로 관찰한다
     (탄성 복원 vs 확산적 소실) — 엄밀한 사전 예측이 없으므로 measurement."
  - "[P1] p.2 가 예측한 '삼각형형 국소 꺾임'이 이 최소 구성에서도 기하적으로
     가능한지(2차 인접 비드가 서로의 DLVO 우물에 들어가는지) 관찰한다 — measurement."

