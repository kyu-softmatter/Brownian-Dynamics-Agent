# ── ⑤ hard constraints (measured, docs/hoomd_capabilities.md §5.1-5.4) ─
hard_constraints:
  - id: H1
    constraint: "BD has no hydrodynamic interaction (HI), so **the translational friction is isotropic**"
    evidence: "both the rigid-body and the bead-chain route measured γ⊥/γ∥ = 1.000000. Not a HOOMD limitation but a property of the BD model"
    effect_on_this_case: |
      MSAD                     ✓ exact (depends only on γ_r,z; 2D has a single rotation axis)
      MSD long time (t ≫ τ_r)  ✓ exact (depends only on the isotropic mean γ̄)
      MSD short time (t < τ_r) ✗ the anisotropy is lost
    note: |
      The sketch says only 'MSD, MSAD' and does not mention short-time anisotropy.
      → mater_plan §20 option A (isotropic mean friction + the exact γ_r tensor) looks
        viable.
      If short-time MSD anisotropy is the core of this study, option B (a custom
      integrator) is required.
    decision_needed: true

# ── ⑥ the analytic form of run-and-flip (needed for the model definition) ─
model_notes:
  - "for Poisson ± reversals the velocity correlation is ⟨v(0)·v(t)⟩ = v² exp(−2t/τ_flip)
     → the effective persistence time is τ_flip/2, and that sets the MSD crossover"
  - "with the body's rotational diffusion present as well, the two decays multiply:
     exp(−2t/τ_flip)·exp(−t/τ_r) (2D) → the effective persistence time is dominated by
     whichever is shorter"
  - "both expressions above were derived and have not been confirmed by execution (rule 7: not_verified)"
