# ── ② structured ──────────────────────────────────────────────────────
system_guess: "run-and-flip motion of a 2D ellipsoidal (rod-like) active particle. Translational and rotational diffusion measured"

entities:
  - kind: particle
    shape: ellipsoid
    note: "1 ellipse. The count is not stated. The aspect ratio is not stated (it looks roughly 2:1 in the drawing, but that is weak evidence)"
  - kind: active_drive
    form: "run-and-flip (a discrete event: the propulsion direction reverses by 180°)"
    note: "different from an ABP's continuous rotational diffusion. No built-in HOOMD feature → a custom updater is required
           (mater_plan §20, docs/hoomd_capabilities.md)"

stated_quantities:
  - symbol: tau_R
    value: 0.5
    unit: s
    source: "sketch 'τ_R : rotation time  0.5 s'"
    confidence: 1
    note: "★ ambiguous whether it is the rotational-diffusion time or the flip interval — see ambiguities D1"
  - symbol: v
    value: 5
    unit: um/s
    source: "sketch 'v : speed.  v ≤ 5 µm/s'"
    confidence: 1
    note: "the '≤' notation → an upper bound. Read as intending a v sweep"
  - symbol: R
    value: null               # ★ only the symbol, no number
    unit: null
    source: "the drawing has only the labels '2R' and 'R'. The other three sketches all write 'R = 5 µm'"

stated_goals:
  - "MSD (mean square displacement)"
  - "MSAD (mean square angular displacement)"

# ── ③ what is ambiguous ───────────────────────────────────────────────
ambiguities:
  - id: D1
    issue: "★ is τ_R = 0.5 s the rotational-diffusion time or the flip interval?"
    detail: |
      Under either reading one parameter is missing:
        (a) τ_R = the rotational-diffusion time (1/D_r)  → the flip rate τ_flip is unstated
        (b) τ_R = the flip interval                      → rotational diffusion is unstated
      For an ellipsoid the 'body direction n' and the 'propulsion direction ±n' are
      separate things:
        MSAD  ← set by the body's rotational diffusion
        MSD   ← set by v and the flip rate (a flip does not rotate the body)
      The sketch asks for the MSAD, so rotational diffusion has to exist; under reading
      (b) alone the MSAD becomes trivial (the angle takes only two values).
    evidence: |
      ★ Quantitative basis: putting τ_R=0.5 s into τ_r = πηd³/kT (sphere approximation,
        water@300K) gives d = 0.918 µm. That is, τ_R=0.5s coincides almost exactly with
        the rotational-diffusion time of a particle of diameter ≈0.92 µm → which
        supports (a). (For an ellipsoid the equivalent diameter comes out slightly
        smaller.)
      Conversely, at d=5µm (the convention in the other sketches) Stokes gives
        τ_r = 80.7 s, off by a factor of 160.
    lean: "(a) τ_R = the rotational-diffusion time. Then τ_flip has to be set separately"
    resolution: >
      User-confirmed 2026-08-04: (b) — τ_R = 0.5 s is the **tumble interval**.
      "run-and-tumble: it tumbles roughly once every 0.5 seconds and moves in a straight
      line in between".
      ★ The quantitative basis above (reading τ_R as rotational diffusion gives
      d=0.918µm) pointed at (a), and **my lean was wrong.** The size itself was right to
      the ~1µm scale though (confirmed d_eq = 0.794 µm) — the coincidence was only
      partly meaningful. Thermal rotational diffusion was computed separately from
      Perrin and gives τ_r = 1.096 s, slower than the tumble (0.5s) → the tumble
      dominates the orientational correlation.
    confirmed_by: user

  - id: D2
    issue: "★ R has no number (the particle size is undetermined)"
    impact: |
      ℓ_p = v·τ_R = 2.50 µm is fixed by the sketch values alone. So the size changes the
      physics directly, through ℓ_p/d:
        d = 1 µm  → Pe = 9.7,  ℓ_p/d = 2.5   the activity is clearly visible in the MSD
        d = 5 µm  → Pe = 242,  ℓ_p/d = 0.5   the direction changes before it covers half
                                             a body length
      Combined with D1's quantitative basis, d ≈ 1 µm is the self-consistent side.
    lean: "d ≈ 1 µm (consistent with inverting τ_R in D1). Needs confirmation"
    resolution: >
      User-confirmed 2026-08-04: an ellipsoid with a 2 µm major axis and a 500 nm minor
      axis → semi-axes (1.0, 0.25, 0.25) µm, aspect ratio p = 4, equivalent-volume
      sphere diameter d_eq = 0.7937 µm. The medium is water.
      The lean ("d ≈ 1 µm") was right as a scale (d_eq = 0.79 µm).
    confirmed_by: user

  - id: D3
    issue: "reading '2R' — is it the full major-axis length?"
    note: "the dimension line points at the top and bottom of the ellipse, so the major axis is read as 2R.
           The 'R' on the arrow below is either the semi-minor axis or a propulsion-direction marker — indistinguishable"
    resolution: >
      Moot — the user specified the dimensions directly (major axis 2 µm, minor axis
      500 nm). How the sketch labels were read no longer affects the result.
    confirmed_by: user

  - id: D4
    issue: "the aspect ratio p = a/b is not stated"
    impact: "the Perrin friction factors come from p. Both γ̄ (the isotropic mean) and γ_r depend on it"
    resolution: >
      User-confirmed 2026-08-04: p = 4. The Perrin friction was computed from the
      elliptic-integral definition and verified by reproducing the sphere limit
      (6πηR and 8πηR³) to within <1e-11% (scratch/perrin_friction.py).
      Result: ζ⊥/ζ∥ = 1.287, γ̄ (the 2D harmonic mean) = 7.2122e-9 kg/s,
      γ_r,z = 4.5391e-21 kg·m²/s.
    confirmed_by: user

  - id: D5
    issue: "the particle count N, the box L and whether there is an interaction are not stated"
    note: "MSD and MSAD are single-particle observables → statistics can be gained from an ensemble of independent particles (the same approach as 1-A)"
    resolution: >
      ★proposal (tier 3): N = 1000 independent particles, L = 32 d_eq = 25.4 µm, no
      interaction (pair.none). Matches the recommender's first choice. The finite-size
      check ℓ_p/(L/4) = 0.27 passes.
    proposed_by: assistant     # ★ tier 3 — awaiting human confirmation

