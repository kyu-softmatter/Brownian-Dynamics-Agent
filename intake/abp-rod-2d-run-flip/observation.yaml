# L0 Observation — 스케치에서 읽어낸 것. **초안: 사람 확인 대기**
# 프로토콜: 전사 먼저 → 구조화 → 모호/미판독 명시 → 없는 값은 null
# 무차원화 초안: scratch/intake_scales.py
# ★ mater_plan §20 A(이방성 병진 마찰) 및 질문 10의 대상 케이스

source_files:
  - intake/abp-rod-2d-run-flip/sketch_01.jpeg

# ── ① 전사 ────────────────────────────────────────────────────────────
raw_transcription: |
  [1행]
    ellipsoid ,  "active" particle          run - and - flip  motion

  [2행 — 그림]
    세로로 긴 타원 1개
    타원 오른쪽에 위아래 끝을 표시한 짧은 치수선, 그 옆에 "2R"
      (첫 글자가 '2'인지 다른 기호인지 다소 불확실)
    타원 아래에 작은 화살표 + "R"
    우측 글:  τ_R : rotation time   0.5 s
              v  : speed.          v ≤ 5 µm/s

  [3행]
    measure  MSD.   MSAD.

  [나머지 지면 — 비어 있음]

# ── ② 구조화 ──────────────────────────────────────────────────────────
system_guess: "2D 타원체(막대형) 액티브 입자의 run-and-flip 운동. 병진·회전 확산 측정"

entities:
  - kind: particle
    shape: ellipsoid
    note: "타원 1개. 개수 미기재. 종횡비 미기재 (그림상 대략 2:1 정도로 보이나 근거 약함)"
  - kind: active_drive
    form: "run-and-flip (이산 사건: 추진 방향 180° 반전)"
    note: "ABP의 연속 회전확산과 다름. HOOMD 내장 기능 없음 → 커스텀 updater 필요
           (mater_plan §20, docs/hoomd_capabilities.md)"

stated_quantities:
  - symbol: tau_R
    value: 0.5
    unit: s
    source: "스케치 'τ_R : rotation time  0.5 s'"
    confidence: 1
    note: "★ 회전확산 시간인지 뒤집힘 간격인지 모호 — ambiguities D1"
  - symbol: v
    value: 5
    unit: um/s
    source: "스케치 'v : speed.  v ≤ 5 µm/s'"
    confidence: 1
    note: "'≤' 표기 → 상한. v 스윕을 의도한 것으로 읽음"
  - symbol: R
    value: null               # ★ 기호만 있고 숫자 없음
    unit: null
    source: "그림에 '2R'·'R' 라벨만. 다른 3개 스케치는 모두 'R = 5 µm'라고 적혀 있음"

stated_goals:
  - "MSD (평균제곱변위)"
  - "MSAD (평균제곱각변위)"

# ── ③ 모호한 것 ───────────────────────────────────────────────────────
ambiguities:
  - id: D1
    issue: "★ τ_R = 0.5 s 가 회전확산 시간인가, 뒤집힘(flip) 간격인가?"
    detail: |
      두 해석 모두에서 파라미터 하나가 빈다:
        (a) τ_R = 회전확산 시간 (1/D_r)  → 뒤집힘 빈도 τ_flip 이 미기재
        (b) τ_R = 뒤집힘 간격            → 회전확산이 미기재
      타원체는 '몸 방향 n'과 '추진 방향 ±n'이 별개다:
        MSAD  ← 몸의 회전확산이 결정
        MSD   ← v 와 뒤집힘 빈도가 결정 (뒤집힘은 몸을 회전시키지 않음)
      스케치가 MSAD를 재라고 했으므로 회전확산이 존재해야 하고,
      해석 (b)만 있으면 MSAD가 자명해진다(각도가 두 값만 가짐).
    evidence: |
      ★ 정량적 근거: τ_r = πηd³/kT (구 근사, 물@300K)에 τ_R=0.5 s를 넣으면
        d = 0.918 µm. 즉 τ_R=0.5s 는 지름 ≈0.92 µm 입자의 회전확산 시간과
        거의 정확히 일치한다 → (a)를 지지한다. (타원체면 등가지름이 약간 작아짐)
      반대로 d=5µm(다른 스케치의 관례)이면 Stokes τ_r = 80.7 s 로 160배 어긋난다.
    lean: "(a) τ_R = 회전확산 시간. 그러면 τ_flip 을 별도로 정해야 함"
    resolution: >
      사용자 확정 2026-08-04: (b) — τ_R = 0.5 s 는 **텀블 간격**이다.
      "매 0.5초 정도마다 한번씩 텀블링을 하고 그 사이에는 직선으로 움직이는 run-and-tumble".
      ★ 위 evidence 의 정량 근거(τ_R을 회전확산으로 읽으면 d=0.918µm)는 (a)를 가리켰고
      **내 lean 이 틀렸다.** 다만 크기 자체는 ~1µm 척도로 맞았다 (확정 d_eq = 0.794 µm) —
      우연이 부분적으로만 의미가 있었다. 열적 회전확산은 Perrin으로 별도 계산했고
      τ_r = 1.096 s 로 텀블(0.5s)보다 느리다 → 방향 상관은 텀블이 지배한다.
    confirmed_by: user

  - id: D2
    issue: "★ R 에 숫자가 없다 (입자 크기 미정)"
    impact: |
      ℓ_p = v·τ_R = 2.50 µm 는 스케치 값만으로 고정된다. 따라서 크기가
      ℓ_p/d 를 통해 물리를 직접 바꾼다:
        d = 1 µm  → Pe = 9.7,  ℓ_p/d = 2.5   활성이 MSD에 뚜렷이 보임
        d = 5 µm  → Pe = 242,  ℓ_p/d = 0.5   몸길이 절반도 못 가고 방향이 바뀜
      D1의 정량 근거와 합치면 d ≈ 1 µm 쪽이 자기일관적이다.
    lean: "d ≈ 1 µm (D1의 τ_R 역산과 일관). 확인 필요"
    resolution: >
      사용자 확정 2026-08-04: 타원체 장축 2 µm · 단축 500 nm → 반축 (1.0, 0.25, 0.25) µm,
      종횡비 p = 4, 등가부피 구 지름 d_eq = 0.7937 µm. 매질은 물.
      lean("d ≈ 1 µm")은 척도로는 맞았다 (d_eq = 0.79 µm).
    confirmed_by: user

  - id: D3
    issue: "'2R' 판독 — 장축 전체 길이인가?"
    note: "치수선이 타원의 위아래를 가리키므로 장축 = 2R 로 읽음.
           아래 화살표의 'R'은 단반축 또는 추진 방향 표시 — 구분 불가"
    resolution: >
      무의미해짐 — 사용자가 치수를 직접 지정했다 (장축 2 µm, 단축 500 nm).
      스케치 라벨을 어떻게 읽었는지는 더 이상 결과에 영향이 없다.
    confirmed_by: user

  - id: D4
    issue: "종횡비 p = a/b 미기재"
    impact: "Perrin 마찰 인자가 p에서 나온다. γ̄(등방 평균)와 γ_r 이 모두 p에 의존"
    resolution: >
      사용자 확정 2026-08-04: p = 4. Perrin 마찰을 타원 적분 정의에서 계산했고
      구 극한(6πηR·8πηR³)을 오차 <1e-11% 로 재현해 검증했다 (scratch/perrin_friction.py).
      결과: ζ⊥/ζ∥ = 1.287, γ̄(2D 조화평균) = 7.2122e-9 kg/s, γ_r,z = 4.5391e-21 kg·m²/s.
    confirmed_by: user

  - id: D5
    issue: "입자 수 N, 박스 L, 상호작용 유무 미기재"
    note: "MSD/MSAD는 단일입자 관측량 → 독립 입자 앙상블로 통계 확보 가능 (1-A와 같은 방식)"
    resolution: >
      ★제안 (tier 3): N = 1000 독립 입자, L = 32 d_eq = 25.4 µm, 상호작용 없음(pair.none).
      추천기 1순위와 일치. 유한크기 검사 ℓ_p/(L/4) = 0.27 통과.
    proposed_by: assistant     # ★ tier 3 — 사람 확인 대기

unread_regions:
  - "그림 오른쪽 치수 라벨의 첫 글자 — '2'로 읽었으나 다른 기호일 가능성 있음"
  - "타원 아래 작은 화살표의 의미 (속도 방향인지 치수선인지 불명)"

# ── ④ 스케치에 없어서 채워야 하는 값 ───────────────────────────────────
