  - symbol: T
    assumed_value: 300
    assumed_unit: K
    confidence: 1
    note: "1-A 확인값 승계"
    resolution: null
  - symbol: eta
    assumed_value: 0.851
    assumed_unit: mPa*s
    confidence: 1
    note: "물@300K, 1-A 승계"
    resolution: null
  - symbol: R
    what: "입자 크기 — ℓ_p/d 와 Pe 를 통해 활성이 보이는지를 직접 정한다 (D2)"
    assumed_value: [1.0, 0.25, 0.25]
    assumed_unit: um
    confidence: 1
    resolution: >
      사용자 확정 2026-08-04: 타원체, 장축 2 µm · 단축 500 nm → 반축 (1.0, 0.25, 0.25) µm,
      d_eq = 0.7937 µm. 매질은 물. (스케치의 'R' 라벨은 이 형상으로 확정)
    confirmed_by: user
  - symbol: tau_flip
    what: "뒤집힘 간격 — MSD 크로스오버를 정한다. τ_R을 회전확산으로 읽으면 이게 빈다 (D1)"
    assumed_value: null        # ★ D1 — 지어내지 않음
    resolution: >
      사용자 확정 2026-08-04: τ_R = 0.5 s 는 **텀블 간격**이다 (run-and-tumble). 텀블 각도 분포는 ★제안(2D 균등 무작위, tier 3). 열적 회전확산 τ_r = 1.096 s 는 Perrin으로 유도 — 텀블보다 느리다.
    confirmed_by: user
  - symbol: aspect_ratio
    what: "종횡비 p=a/b — Perrin 마찰 인자(등방 평균 γ̄ 와 γ_r)가 여기서 나온다 (D4)"
    assumed_value: null        # ★ D4
    resolution: >
      사용자 확정 2026-08-04: p = 2µm/0.5µm = 4. Perrin 마찰을 scratch/perrin_friction.py 에서 계산 (구 극한 검증 완료).
    confirmed_by: user

# ── ⑤ 하드 제약 (실측 근거, docs/hoomd_capabilities.md §5.1-5.4) ────────
hard_constraints:
  - id: H1
    constraint: "BD에는 유체역학적 상호작용(HI)이 없어 **병진 마찰이 등방**이다"
    evidence: "강체·비드사슬 두 경로 모두 실측 γ⊥/γ∥ = 1.000000. HOOMD 한계가 아니라 BD 모델의 성질"
    effect_on_this_case: |
      MSAD                  ✓ 정확 (γ_r,z 만 의존, 2D는 회전축 하나)
      MSD 장시간 (t ≫ τ_r)  ✓ 정확 (등방 평균 γ̄ 만 의존)
      MSD 단시간 (t < τ_r)  ✗ 이방성 손실
    note: |
      스케치는 'MSD, MSAD'라고만 적었고 단시간 이방성을 명시하지 않았다.
      → mater_plan §20 옵션 A(등방 평균 마찰 + 정확한 γ_r 텐서)로 진행 가능해 보인다.
      단시간 MSD 이방성이 이번 연구의 핵심이면 옵션 B(커스텀 적분기)가 필요.
    decision_needed: true

# ── ⑥ run-and-flip 의 해석식 (모델 정의에 필요) ────────────────────────
model_notes:
  - "포아송 ±반전이면 속도 상관은 ⟨v(0)·v(t)⟩ = v² exp(−2t/τ_flip)
     → 유효 지속시간 = τ_flip/2 이고 이것이 MSD 크로스오버를 정한다"
  - "몸의 회전확산이 함께 있으면 두 감쇠가 곱해진다:
     exp(−2t/τ_flip)·exp(−t/τ_r) (2D) → 유효 지속시간이 둘 중 짧은 쪽에 지배됨"
  - "위 두 식은 유도한 것이며 실행으로 확인하지 않았다 (원칙 7: not_verified)"
