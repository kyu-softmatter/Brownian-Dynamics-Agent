# L2 PhysicalSystem — the dimensional physical system (SI). Rule 3.
# Derivation: scratch/perrin_friction.py (sphere limit verified), scratch/propose_3cases.py §A
# tier 0=sketch/direct input · 1=user-confirmed or inherited convention
#      · 2=literature unverified · 3=★my proposal

label: abp-rod-2d-run-flip
derived_from: observation.yaml
description: >
  Run-and-tumble motion of a 2D ellipsoidal active particle. Between tumbles it runs
  in a straight line. MSD and MSAD are measured. Newtonian fluid (water).
dimensions: 2

particle:
  shape: ellipsoid          # ★ not a sphere → the sphere formula (3πηd) is not the check here
  semi_axes:
    value: [1.0, 0.25, 0.25]
    unit: um
    source: "user-confirmed 2026-08-04: major axis 2 µm long, minor axis 500 nm"
    tier: 1
  aspect_ratio:
    value: 4.0
    unit: dimensionless
    source: "derived: a1/a2 = 1.0/0.25"
    tier: 1
  diameter:                 # equivalent-volume sphere diameter — used as the reference length
    value: 0.79370
    unit: um
    source: "derived: d_eq = 2(a1 a2 a3)^(1/3), from the user-confirmed shape"
    tier: 1
  density:
    value: 1050
    unit: kg/m^3
    source: "★proposal: assumed polystyrene-like. Used only for τ_p (model validity); no effect on the BD result"
    tier: 3
  count:
    value: 1000
    unit: dimensionless
    source: "★proposal: an ensemble of independent particles for MSD/MSAD statistics (same approach as 1-A). The sketch shows 1"
    tier: 3

medium:
  kind: newtonian
  name: water
  temperature:
    value: 300
    unit: K
    source: "user-confirmed 2026-08-04 'the medium is water'. The temperature inherits 1-A's confirmed value"
    tier: 1
  viscosity:
    value: 0.851
    unit: mPa*s
    source: "handbook value for water @300K. The medium being water is user-confirmed 2026-08-04"
    tier: 1

geometry:
  kind: periodic_square_2d
  box_length:
    value: 25.398
    unit: um
    source: "★proposal: L = 32 d_eq. Chosen to satisfy the finite-size check ℓ_p ≤ L/4"
    tier: 3
  periodic: true

interactions: none          # pair.none — MSD and MSAD are single-particle observables (matching the recommender's first choice)

# ── friction (Perrin, not the sphere formula) ──────────────────────────
friction:
  source: "scratch/perrin_friction.py — computed from the elliptic-integral definition; reproduces 6πηR and 8πηR³ in the sphere limit (error <1e-11%)"
  tier: 1
  zeta_parallel: {value: 6.4081e-9, unit: kg/s, note: "along the major axis"}
  zeta_perp: {value: 8.2471e-9, unit: kg/s, note: "along the minor axis, ζ⊥/ζ∥ = 1.287"}
  gamma_bar_2d:
    value: 7.2122e-9
    unit: kg/s
    note: >
      The in-plane harmonic mean 2/(1/ζ∥+1/ζ⊥). ★ BD cannot reproduce translational
      anisotropy (a bd-hoomd hard constraint), so an isotropic mean is used. The
      harmonic mean was chosen so that the long-time MSD is set by D̄
      (mater_plan §20 option A).
  gamma_rot_z:
    value: 4.5391e-21
    unit: kg*m^2/s
    note: "in-plane rotation (about z). The rotational friction tensor works correctly in HOOMD (confirmed by measurement)"

active:
  kind: run_and_tumble
  speed:
    value: 5.0
    unit: um/s
    source: "sketch 'v : speed. v ≤ 5 µm/s' — the upper bound is used"
    tier: 0
  tumble_interval:
    value: 0.5
    unit: s
    source: "user-confirmed 2026-08-04 'tumbling roughly once every 0.5 seconds'"
    tier: 1
  tumble_angle:
    value: 0
    unit: dimensionless
    source: "★proposal: uniform random 2D reorientation. The sketch says 'run-and-flip' (a 180° reversal),
             but the user confirmed 'run-and-tumble'. τ_eff differs between the two (see not_verified)"
    tier: 3
    note: "uniform random gives ⟨v(0)·v(t)⟩ = v² exp(−t/τ_tumble); a 180° reversal gives exp(−2t/τ_tumble)"

targets:
  - name: mean_square_displacement
  - name: mean_square_angular_displacement

derived_scales:
  source: "scratch/propose_3cases.py §A (the shape is non-spherical, so the sphere formula is not what is being checked)"
  D_bar: {value: 0.5743, unit: um^2/s, expr: "kT/gamma_bar_2d"}
  D_r: {value: 0.9125, unit: 1/s, expr: "kT/gamma_rot_z"}
  tau_r: {value: 1.0959, unit: s, expr: "1/D_r", role: "thermal rotational diffusion — slower than the tumble (0.5s)"}
  tau_B: {value: 1.0969, unit: s, expr: "d_eq^2/D_bar", role: "the reference time"}
  tau_v: {value: 0.15874, unit: s, expr: "d_eq/v", role: "★ the fastest scale → it sets dt"}
  tau_p: {value: 3.81e-8, unit: s, expr: "m/gamma_bar", role: "for the model check only"}
  tau_eff: {value: 0.3433, unit: s, expr: "1/(1/tau_r + 1/tau_tumble)", role: "orientational correlation"}
  l_p: {value: 1.7167, unit: um, expr: "v*tau_eff", role: "persistence length = 2.16 d_eq"}

dimensionless:
  reference: {length: d_eq, time: tau_B, energy: kT, strategy: thermal}
  groups:
    - {name: "Pe", value: 6.910, expr: "v d_eq/D_bar", meaning: "advection vs diffusion"}
    - {name: "D_r*", value: 1.001, expr: "D_r tau_B", meaning: "rotation vs translation (differs from the sphere's 3 — it is an ellipsoid)"}
    - {name: "l_p/d_eq", value: 2.163, meaning: "the persistence length is 2.2 particle lengths"}
    - {name: "tau_tumble/tau_r", value: 0.456, meaning: "★ the tumble is faster than rotational diffusion → tumble-dominated"}
    - {name: "p", value: 4.0, meaning: "aspect ratio"}
    - {name: "L/d_eq", value: 32.0, meaning: "the box"}
    - {name: "St", value: 3.47e-8, expr: "tau_p/tau_B"}

numerics:
  dt:
    value: 1.5874
    unit: ms
    source: "10⁻² × τ_v (the fastest relevant scale). dt·D_r=1.4e-3 and dt/τ_tumble=3.2e-3 also pass"
    tier: 1
  production_s: 219
  production_note: "200 × max(τ_r, τ_tumble)"
  stat_target_pct: 2.0
  equilibration: "decided by measurement (the early MSD region is excluded)"

not_verified:
  - "whether the tumble-angle distribution is uniform random or a 180° reversal is unsettled (a tier 3 proposal). τ_eff splits 0.343s vs 0.222s"
  - "BD cannot reproduce translational anisotropy → **the short-time MSD anisotropy will not appear**. The MSAD and the long-time MSD are exact"
  - "there is no built-in HOOMD run-and-tumble updater, so a custom Action is required (a bd-hoomd snippet exists, unverified in this case)"
  - "τ_r=1.096s is slower than τ_tumble=0.5s → the tumble dominates the orientational correlation. Thermal rotation is secondary"
