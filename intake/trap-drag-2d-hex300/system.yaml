# L2 PhysicalSystem — the dimensional physical system (SI). Rule 3.
# Derivation: scratch/propose_3cases.py §B
# tier 0=sketch · 1=user-fixed/convention inherited · 2=literature, unverified · 3=★my proposal

label: trap-drag-2d-hex300
derived_from: observation.yaml
description: >
  Build a 2D hexagonal colloidal lattice out of a soft repulsion (A/r³ + WCA), and drag a
  single optical-tweezer trap through the lattice at constant speed. Active microrheology /
  a dragged probe.
dimensions: 2

particle:
  shape: sphere
  diameter:
    value: 5.0
    unit: um
    source: "sketch, 'R = 5 µm' — applying the 'diameter' convention the user confirmed in 1-A"
    tier: 1
  density:
    value: 2000
    unit: kg/m^3
    source: "★proposal: assumed silica. Used only for τ_p (model validity)"
    tier: 3
  count:
    value: 306
    unit: dimensionless
    source: "sketch, 'N ~ 300' (the ~ notation → adjustable to fit the lattice, observation.yaml B4).
             ★ Fixed at N = n_x·n_y = 17×18 for a commensurate hexagon (user-approved 2026-08-04).
             At Δ+2.0% it is the closest to 300, and the lattice period along the drag direction, n_x=17, is the largest"
    tier: 0

medium:
  kind: newtonian
  name: water
  temperature: {value: 300, unit: K, source: "inherits the value confirmed in 1-A (not stated in the sketch)", tier: 1}
  viscosity: {value: 0.851, unit: mPa*s, source: "handbook, water@300K. Inherited from 1-A", tier: 1}

# ── ★ a commensurate hexagonal lattice (changed 2026-08-04) ────────────
#   The sketch says "start from hexagonal equilibrium", so the initial lattice has to be
#   **commensurate** with the periodic box. If it is incommensurate, defects are injected at the
#   seam, and this system's observables (the lattice deformation field, ψ₆) are sensitive to
#   exactly those defects. The commensurability conditions:
#       L_x = n_x·a_NN            (the row direction = the nearest-neighbour direction)
#       L_y = n_y·(√3/2)·a_NN     (the row spacing)
#       N   = n_x·n_y ,  n_y even  ← the staggered rows have a period of 2 rows, so it must be even to join up
#   φ is preserved **exactly** in this construction: φ = πd²/(2√3 a_NN²) = πd²/(4 a_mean²).
#   ⚠️ N=300 is not commensurate with a square box (15×20 is commensurate but has aspect ratio 0.866).
geometry:
  kind: periodic_rect_2d          # ★ not square — commensurability sets the aspect ratio
  area_fraction:
    value: 0.35
    unit: dimensionless
    source: "★proposal: reuses the combination confirmed in 1-B as Γ=29.7 (a hexagonal crystal, ψ₆=0.885)"
    tier: 3
  n_x: {value: 17, unit: dimensionless, source: "commensurate hexagon — the cell count along the row direction = the number of lattice periods along the drag direction", tier: 1}
  n_y: {value: 18, unit: dimensionless, source: "commensurate hexagon — the row count (must be even for the stagger to join up)", tier: 1}
  box_length_x: {value: 136.825, unit: um, source: "derived: n_x·a_NN (the drag direction)", tier: 1}
  box_length_y: {value: 125.464, unit: um, source: "derived: n_y·(√3/2)·a_NN", tier: 1}
  aspect_ratio: {value: 1.0906, unit: dimensionless, source: "derived: L_x/L_y", tier: 1}
  a_mean: {value: 7.490, unit: um, source: "derived: d√(π/4φ)", tier: 1}
  a_nn: {value: 8.049, unit: um, source: "derived: √(2/√3)·a_mean (the hexagonal nearest neighbour)", tier: 1}
  drag_axis: x
  drag_axis_note: >
    ★ The drag direction is taken along the **nearest-neighbour (row) direction**. Then the spatial
    period of the potential the probe experiences is a_NN and the number of periods per crossing is
    n_x. Dragging perpendicular to the rows makes the period 2 rows = √3·a_NN, which actually
    reduces the number of periods in the same box (17 → 10).
  periodic: true

interactions:
  - kind: pair.soft_r3
    form: "U(r)/kT = A (d/r)^3"
    amplitude_A:
      value: 100.0
      unit: dimensionless
      source: "★proposal: the value that satisfies the sketch's 'start from hexagonal equilibrium'. 1-B confirmed
               by measurement that A=100·φ=0.35 gives Γ=29.7, a hexagonal crystal (ψ₆=0.885, 6-coordinated 98.7%)"
      tier: 3
    cutoff:
      value: 37.45
      unit: um
      source: "r_c = 5 a_mean. A multiple of a_mean rather than an absolute kT criterion (the 1-B lesson)"
      tier: 1
      shift: true
  - kind: pair.wca
    form: "the WCA excluded-volume core"
    sigma: {value: 5.0, unit: um, source: "the core at the particle diameter (the same as 1-B)", tier: 1}
    epsilon: {value: 1.0, unit: kT, source: "★proposal: the conventional value", tier: 3}

external:
  kind: harmonic_trap_moving
  form: "U_trap = 0.5 k_t (Δr)^2,  r_trap(t) = r_trap(0) + v_x t"
  n_trapped:
    value: 1
    unit: dimensionless
    source: "sketch — the X is on one circle only"
    tier: 0
  stiffness: {value: 10, unit: pN/um, source: "sketch, 'k_t = 10 pN/µm'", tier: 0}
  drag_velocity:
    # ★ A sweep. 0.5 is the sketch value (tier 0) and the rest are ★proposals (tier 3) — which
    #   point to run is chosen with `--v` (the same way as soft-r3's A sweep).
    #   The boundary is v = 9.19 µm/s: the speed at which the time for the probe to cross one
    #   lattice cell, τ_cell = a_NN/v, equals the lattice relaxation time τ_int. Below it is
    #   quasi-static; above it the lattice cannot keep up.
    value: [0.05, 0.1, 0.5, 1.5, 4.0, 12.0, 32.0]
    unit: um/s
    source: "sketch, 'v_x = 0.5 µm/s' (tier 0). The other 6 points are ★proposals — they sweep
             τ_cell/τ_int from 184 down to 0.29, covering the quasi-static↔dynamic crossover"
    tier: 0

targets:
  - name: drag_force            # ★proposal — no goal is stated in the sketch
  - name: lattice_deformation
  - name: radial_distribution_function

derived_scales:
  source: "scratch/propose_3cases.py §B"
  gamma: {value: 4.0102e-8, unit: kg/s, expr: "3 pi eta d"}
  D_t: {value: 0.1033, unit: um^2/s, expr: "kT/gamma"}
  tau_B: {value: 242.05, unit: s, expr: "d^2/D_t"}
  tau_p: {value: 3.264e-6, unit: s, expr: "m/gamma"}
  kT: {value: 4.1419e-21, unit: J}
  tau_k: {value: 4.010e-3, unit: s, expr: "gamma/k_t", role: "★ the fastest scale → it sets dt"}
  tau_int: {value: 0.8756, unit: s, expr: "gamma/U''(r_min), r_min=1.341d", role: "the pair — 218× slower than the trap"}
  tau_v: {value: 10.0, unit: s, expr: "d/v_x", role: "dragging"}
  l_k: {value: 20.35, unit: nm, expr: "sqrt(kT/k_t)"}
  dr_ss: {value: 2.005, unit: nm, expr: "gamma v/k_t", role: "the steady-state lag of the dragging"}

dimensionless:
  reference: {length: d, time: tau_B, energy: kT, strategy: thermal}
  groups:
    - {name: "Gamma", value: 29.75, expr: "A (d/a_mean)^3", meaning: "the pair coupling strength → a hexagonal crystal"}
    - {name: "k*", value: 6.036e4, expr: "k_t d^2/kT", meaning: "trap vs thermal fluctuation (very stiff)"}
    - {name: "phi", value: 0.35}
    - {name: "Pe_drag", value: 24.205, expr: "v_x d/D_t"}
    - {name: "SNR", value: 0.0985, expr: "dr_ss/l_k", meaning: "★ the drag signal is 1/10 of the thermal fluctuation"}
    - {name: "r_c/(L_min/2)", value: 0.597, meaning: "minimum-image margin 1.68× (referenced to the short side L_y)"}
    - {name: "n_cell", value: 17.0, expr: "L_x/a_NN = n_x", meaning: "★ the number of lattice periods per crossing (an integer)"}
    - {name: "tau_k/tau_int", value: 4.58e-3, meaning: "★ the trap is 218× faster than the pair → it dominates dt"}

numerics:
  dt:
    value: 40.10
    unit: us
    source: "10⁻² × τ_k. ★ Two stiffnesses compete, the trap and the pair, and the trap is 218× faster"
    tier: 1
  production_s: 273.6
  production_note: "one box crossing, L_x/v_x (the drag direction). 6.8e6 steps"
  stat_target_pct: 2.0
  equilibration: "start from the commensurate hexagonal lattice → a relaxation stretch is needed before the trap starts dragging"

not_verified:
  - "★ SNR=0.0985 — the drag signal is 1/10 of the thermal fluctuation. Measuring Δr_ss to 1% accuracy needs 2.3h of
     physical time (2e8 steps). Raising v to 5.07 µm/s makes SNR=1 (or use the deformation field of the 306 lattice particles as the observable)"
  - "★ Switching to a commensurate hexagon made the box a rectangle of aspect ratio 1.091. The finite-size artefacts
     may be asymmetric in x vs y — whether the lattice deformation field (observable 2) is sensitive to that asymmetry
     is unconfirmed. The alternatives were 15×20 (N=300 exactly, aspect ratio 0.866) and 16×18 (N=288, aspect ratio 1.026)"
  - "A=100·φ=0.35 is carried over from the 1-B combination — whether it is a hexagonal crystal in this system (with the trap) is unconfirmed"
  - "The measurement goal is absent from the sketch and was filled in with ★proposals (the drag force, the lattice deformation field)"
  - "A moving trap is possible with the variant snippet in bd-hoomd, but it is unverified in this case"
