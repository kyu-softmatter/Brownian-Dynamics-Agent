# ── ⑤ advance warnings out of the non-dimensionalization (scratch/intake_scales.py) ──
prerun_findings:
  - id: F1
    severity: "★★ a measurement-design problem"
    finding: |
      The steady-state lag of constant-speed dragging is Δr_ss = γv/k_t = 2.01 nm, whereas
      the thermal fluctuation inside the trap is ℓ_k = √(kT/k) = 20.35 nm.
      → SNR = Δr_ss/ℓ_k = 0.098. The signal is 1/10 of the noise.
    consequence: |
      Measuring Δr_ss (= the drag force) to 1% accuracy needs ≈ 1.0e6 independent samples
      → T_obs ≈ 8.3e3 s = 2.3 hours (physical) = 2.1e8 steps. For 1 dragged particle.
    options:
      - "raise v — SNR = γv/√(k·kT) ∝ v. SNR=1 is reached at v = 5.07 µm/s (10×)"
      - "lower k_t — SNR ∝ 1/√k (but the trap has to stay strong enough to beat the lattice)"
      - "use the deformation field of the 300 lattice particles as the observable (N times more statistics)"
    verified: false           # not confirmed by running — a prediction based on analytic expressions
