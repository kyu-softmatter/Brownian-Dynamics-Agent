# ── ③ what is ambiguous ───────────────────────────────────────────────
ambiguities:
  - id: B1
    issue: "★ there is no pair potential. The sketch has no repulsion to make a 'hexagonal equilibrium'"
    options:
      - "the same system as the U/kT = A/r³ of the soft-r3 sketch (a consecutive case in the same notebook)"
      - "an optical lattice with a trap on every particle (weak, since the drawing has only one X)"
      - "WCA/hard core + the lattice only as an initial condition, watching it melt"
    impact: "Without the lattice stiffness (the phonon spectrum) the drag response cannot be computed. The core physics of this case."
    lean: "the same pair potential as soft-r3 — then the two cases share a module"
    resolution: >
      User-fixed 2026-08-04: the same A/r³ + WCA core as soft-r3. The lean was right, and it also agrees with the recommender's (bdbot interactions) top pick, pair.soft_power. A = 100 is a ★proposal (tier 3) — the value for which 1-B confirmed by measurement that Γ=29.7 is a hexagonal crystal (ψ₆=0.885).
    confirmed_by: user

  - id: B2
    issue: "what is to be measured? (no goal is stated in the sketch)"
    note: |
      Candidates: the drag force ⟨F_drag⟩(= k_t·Δr_ss) / an effective viscosity / the lattice
            deformation field / the critical speed for defect (dislocation) creation / the wake behind the probe
    resolution: >
      The ★proposal is settled (user-approved 2026-08-04, tier 3): 3 observables — (1) the drag force ⟨F_drag⟩ = k_t·Δr_ss (2) the lattice deformation field (the displacement field around the probe) (3) g(r) and ψ₆ (whether the lattice order is retained). ⚠️ (1) has SNR=0.0985, so averaging is mandatory — which is why (2) is watched alongside it (the deformation field of 300 particles has N times more statistics).
    confirmed_by: user     # the ★proposal was approved by the user (still tier 3)

  - id: B3
    issue: "is R = 5 µm the radius or the diameter?"
    note: "in 1-A the user confirmed 'the diameter' → the same convention is applied. Needs explicit confirmation"
    impact: "γ ∝ d, so τ_k and Δr_ss differ by exactly a factor of 2"
    lean: "the diameter (d = 5 µm)"
    resolution: >
      Inherits the convention the user confirmed in 1-A as 'the diameter' (tier 1). The lean was right. ⚠️ This inheritance does however have to be verified case by case — applying the same convention to abp-rod came out 160× off from the sketch's τ_R. This case has no independent means of cross-checking.
    confirmed_by: convention_inherited

  - id: B4
    issue: "the lattice spacing a (or the area fraction) is missing"
    impact: "The box is L = a√(N·√3/2), so the crossing time and the total step count are fixed by it.
             At a=2d, L=161µm, a crossing of 322 s, 8.0e6 steps (dt=10⁻²τ_k)"
    resolution: >
      The ★proposal is settled (user-approved 2026-08-04, tier 3): φ = 0.35 → a_mean = 7.490 µm, a_NN = 8.049 µm, L = 129.73 µm (N=300). 1-B confirmed by measurement that this density/A=100 combination is a hexagonal crystal, and at r_c = 5 a_mean the minimum-image margin is 1.73×.
    confirmed_by: user     # the ★proposal was approved by the user (still tier 3)

  - id: B5
    issue: "are the other particles trapped too?"
    note: "there is one X in the drawing. Read as only the dragged particle being trapped"
    lean: "1 trap (only the dragged particle)"
    resolution: >
      Settled on the evidence of the sketch: the X is on one circle only, so 1 trap (only the dragged particle). The lean was right. external.n_trapped = 1 in system.yaml (tier 0, sketch).
    confirmed_by: sketch

