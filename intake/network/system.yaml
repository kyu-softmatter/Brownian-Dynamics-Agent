# L2 PhysicalSystem — `network`: a 3D colloidal network (compression gelation → single-point driving later).
# Literature: [P1] Pantina & Furst, PRL 94, 138301 (2005)
#             [P2] Pantina & Furst, Langmuir 24, 1141-1146 (2008)
# Sketch: intake/network/KakaoTalk_Photo_2026-08-06-14-36-42.jpeg — it has not a single number in it,
#         so the properties are all inherited from `chain-bend-2d-dlvo` (marked by tier). No invented values.
# tier 0=sketch/handbook · 1=user-fixed or an inherited confirmed convention · 2=extracted from the literature · 3=★my proposal
#
# ★★ The purpose of this file is to make **stage 1 (gelation)** runnable (CLAUDE.md rule 8:
#    build the static system first and add motion afterwards). `external` is written down as advance
#    notice of stage 2 but is not run in stage 1 — stated by `external.enabled_stage: 2`.

label: network
derived_from: intake/network/observation.yaml
description: >
  Scatter monodisperse colloidal beads into a 3D box, aggregate them via the DLVO secondary minimum, then
  compress the box isotropically to make a percolating network at φ=0.1 (the protocol the user specified
  2026-08-06).
  The bonds turn on DLVO (a central force) **together with** the bending stiffness of JKR adhesive contact (A2 settled).
  Stage 1's output is a freezable topology (the contact list) plus structural observables, and in stage 2
  one particle is forced as x(t)=A sin(ωt) to watch G'(ω), G''(ω), the response time and stress propagation.
dimensions: 3

particle:
  shape: sphere
  diameter:
    value: 1.47
    unit: um
    source: "[P1] p.1 '2a = 1.47 ± 0.01 µm' PMMA — inheriting the chain-bend-2d-dlvo convention
             (no size is stated in this sketch, only 'identical bead')"
    tier: 1
  density:
    value: 1180
    unit: kg/m^3
    source: "★proposal: PMMA. BD does not use the mass, so it is used only for the τ_p (St) check — 0 effect on the result"
    tier: 3
  surface_potential:
    value: 40
    unit: mV
    source: "[P1] p.1 'a measured surface potential of 40 ± 3 mV' — inherited"
    tier: 2
  count:
    value: [512, 1528]
    unit: dimensionless
    source: >
      ★proposal. The 21 circles in the drawing are **a schematic** (observation A6 — the topology being a
      tree, G'(ω) is not defined). By N = φ(L/d)³·6/π, at φ=0.1:
        512 → L/d=13.89 (the pilot · the finite-size floor)
        1528 → L/d=20.00 (production · L/2=10d is the useful radius for the propagation measurement)
      The grounds for the ceiling are cost — at the measured 6384 steps/s (N=1528, 3D, Table+WCA),
      with dt=1e-2·τ_bond, 1 τ_B of gelation is 4.5 hours per seed
      (scratch/verify_3d_boxresize.py ⑤).
    tier: 3

medium:
  kind: newtonian
  name: water
  temperature: {value: 300, unit: K, source: "inherited from 1-A; the papers use an aqueous solution", tier: 1}
  viscosity: {value: 0.851, unit: mPa*s, source: "handbook, water@300K", tier: 1}
  relative_permittivity: {value: 78.5, unit: dimensionless, source: "handbook, water@298K (CRC)", tier: 1}
  ionic_strength:
    value: 10
    unit: mM
    source: >
      MgCl2 10mM — inherited from chain-bend-2d-dlvo (user-approved 2026-08-05). At 250mM the double-layer
      repulsion is dead, the vdW diverges at contact with no barrier, and the bond stiffness ends up set by
      an arbitrary regularization.
      10mM gives a textbook curve (a barrier of 416 kT + a secondary minimum of −11.7 kT).
    tier: 2
    note: "MgCl2 (a 2:1 electrolyte). I = ½Σcᵢzᵢ² = 0.75×c_salt"

# ── geometry: a 3D periodic box being compressed ───────────────────────────
geometry:
  kind: periodic_box_compressed
  boundary: "3D PBC (x, y and z)"
  volume_fraction_initial:
    value: 0.02
    unit: dimensionless
    source: >
      ★proposal. Dilute enough that the initial arrangement has no overlap and no immediate aggregation
      (the mean nearest-neighbour gap is ≈1.65d), and it leaves a compression margin of 41.5% total linear
      strain. The counterpart of observation A8 (φ=0.1 being the final value).
    tier: 3
  volume_fraction_final:
    value: 0.10
    unit: dimensionless
    source: "user-specified 2026-08-06 ('0.1, a sparse gel'). A typical range for a colloidal gel"
    tier: 1
  compression:
    mode: isotropic
    source: >
      ★proposal, isotropic. Doing it uniaxially gives the gel a global axis, which would define stage 2's
      'perpendicular/parallel to the network' (observation A9-ⓑ) but changes the system into an anisotropic
      gel. Isotropic is taken as the default and A9 is resolved with a **local bond coordinate frame** (A9-ⓐ).
    tier: 3
  n_stages:
    value: 178
    unit: dimensionless
    source: >
      derived. Putting a safety factor of 1.76 on the allowable strain ε_crit = (h_min−h_barrier)/ℓ = 0.7031%,
      **0.4% per trigger** is used (measured: at 0.40% the bond holds, h*=0.007591 / at 0.80% it collapses,
      h*=−0.042257 — scratch/verify_3d_boxresize.py ④, docs/hoomd_capabilities.md §5.5).
      ★ The number of stages **depends on the interpolation**:
        · constant relative strain (geometric): ln(0.5848)/ln(1−0.004) = 134
        · `variant.box.Interpolate` is **linear in L**, so ΔL is constant and the relative strain grows as
          L shrinks — **the worst stage is the last one**. (L₀/L₁−1)/ε = 0.7100/0.004
          = 177.5 → **178**. The maximum per-stage strain is then 0.3989% (safety factor 1.76).
      ⚠️ Using 134 puts the last stage at 0.53%, over the measured safety line (0.40%) — below the predicted
      threshold (0.703%), but **an unmeasured region**. 178 is used.
    tier: 1

# ── interactions: DLVO (central force) + JKR bending. Both ON (observation A2 settled) ────────
interactions:
  - kind: pair.dlvo_secondary_minimum
    form: "U(h) = U_edl(h) + U_vdw(h), h=surface gap. HHF (constant potential, weak overlap) + Derjaguin non-retarded vdW"
    rationale: >
      The sketch wrote "DLVO, & JKR" and the user settled it as **combined, one system**
      (observation A2). The expressions and the reduced parameters are used exactly as verified in SI in
      chain-bend-2d-dlvo (dlvo_reduced_params/U_star/F_h_star in cases/chain_bend_dlvo_2d.py).
      NN (contacting) pairs are the "bonds", and in the gelation stage no topology is declared and
      **only the pair potential** is used — because the bonds form during the run (observation N5).
    hamaker_constant:
      value: 1.05e-20
      unit: J
      source: >
        Inherited from chain-bend-2d-dlvo. Independently cross-checked in that case with the
        Tabor-Winterton approximation (A_calc=9.40e-21 J, −10.5%; scratch/hamaker_crosscheck.py). Primary source unconfirmed.
      tier: 2
    debye_length:
      value: 1.7618
      unit: nm
      source: "derived: κ⁻¹=√(ε0·εr·kT/(2·NA·e²·I)), MgCl2 10mM"
      tier: 1
    barrier_height:
      value: 416.390
      unit: dimensionless
      source: >
        derived: max U_tot(h)/kT @ h=0.7468 nm. ★ A value re-confirmed on a fine grid (4e5 points), and it
        agrees with `find_well()`. ⚠️ chain-bend-2d-dlvo/system.yaml records 381.70 @
        0.489nm, but that is **the value at a point that is not the maximum** (the coarse grid of
        dlvo_ledger.py — 8.3% low in the barrier and 35% low in its location). The conclusion
        (the barrier ≫ 1 kT) is the same either way.
      tier: 1
      note: "unit=kT. Guarantees that a thermal transition into the primary minimum is effectively impossible"
    well_depth:
      value: -11.7155
      unit: dimensionless
      source: "derived: the secondary minimum of U_tot(h)/kT @ h=11.1611nm"
      tier: 1
      note: >
        unit=kT. ★ 11.7 kT is on the scale of the thermal energy, so **the bonds are reversible** — the
        escape time is τ_esc ≈ τ_bond·exp(11.7) ≈ 0.115 τ_B. That is, this network is not a permanent gel
        but a reversible, rearranging one, and the reference time for structural relaxation during
        compression is not τ_B but τ_esc (the value that sets the compression stage length — see numerics).
    well_location:
      value: 11.1611
      unit: nm
      source: "derived: argmin U_tot(h) (past the barrier)"
      tier: 1
    bond_stiffness:
      value: 1.998e-3
      unit: N/m
      source: "derived: d²U_tot/dh² @ well_location = 1.0424e6 kT/d²"
      tier: 1
      note: "the radial (stretching) stiffness. The candidate fastest mode that sets dt → τ_bond = γ/k_bond"

  - kind: contact.adhesive_bending
    form: "the tangential bending stiffness κ_θ = EI/ℓ. Derived from [P1][P2]'s JKR adhesive contact"
    enabled_stage: 2
    rationale: >
      ★ **Off** in stage 1 (gelation), turned on in stage 2 (driving) on top of the frozen topology —
      HOOMD's angle/bond are a static topology and cannot be declared during aggregation (N5).
      ⛔ And `md.angle.Harmonic` cannot be used: it clamps sinθ at √2e-3, so for a nearly straight triplet
      **the force is up to 96% wrong while the energy is exact**
      (skill bd-hoomd trap 15). Straight triplets inevitably appear in a gel's chain segments.
      → `force.Custom` (accurate, 26× slower) or an analytic path. To be settled in the stage-2 design.
    kappa_0:
      value: 64
      unit: mN/m
      source: "[P1] p.3 'experimental value at 10 mM MgCl₂ is 64 ± 0.5 mN/m' — the salt condition matches"
      tier: 2
    angle_stiffness:
      value: 5.7624e-15
      unit: J
      source: "derived: κ_θ = EI/ℓ, EI = κ₀a³/3, ℓ=d. Inheriting the verification from chain-bend-2d-oscill"
      tier: 1
      note: "= 1.391e6 kT — 120 thousand times the depth of the DLVO secondary minimum (11.7 kT)"

# ── advance notice of stage 2 (not run in stage 1) ─────────────────────────
external:
  kind: position_forced_oscillation
  enabled_stage: 2
  form: "force one driven bead's position directly as x(t) = A sin(ωt) (not a trap — observation A3)"
  drive_direction:
    value: [0, 30, 60, 90]
    unit: degree
    source: >
      ★User-specified 2026-08-06 ('various angles: perpendicular to the network, parallel, and so on').
      The angle is referenced to the **local bond coordinate frame** (0°=parallel to the bond axis,
      90°=perpendicular) — because an isotropically compressed gel has no global axis (observation A9).
      Central-force DLVO has k_bond=1.998e-3 N/m along the parallel direction but a linear stiffness of
      exactly 0 along the perpendicular, so this sweep becomes the axis that directly measures the
      contrast between DLVO and JKR bending.
    tier: 1
  amplitude:
    value: null
    unit: nm
    source: "undecided (observation A_amplitude) — confirming the linear-response region has to be the first check"
    tier: 3
  omega_range:
    value: null
    unit: rad/s
    source: >
      undecided (observation omega_range). ⚠️ For a G' plateau to be visible the low-frequency end has to
      be quasi-static — there is a precedent in chain-bend where De(ω_min)=0.993 failed to reach the plateau.
    tier: 3

targets:
  # ── stage 1 (gelation) — what is measured this time ──
  - name: coordination_number       # z — before and after compression
  - name: independent_loops         # the number of independent loops (Betti-1). The drawing's tree was 0
  - name: dangling_fraction         # the free-end fraction. The drawing was 6/21 = 29%
  - name: fractal_dimension         # d_f — whether it is DLCA or a dense mesh
  - name: percolation               # whether it percolates (a PBC-spanning cluster)
  - name: rdf                       # g(r) — whether a peak stands at the secondary-minimum bond distance
  - name: crushed_bond_fraction     # ★ the fraction of bonds the compression broke (pairs that fell to h<0 contact)
  # ── stage 2 (driving) — later ──
  - name: storage_modulus           # G'(ω)
  - name: loss_modulus              # G''(ω)
  - name: response_time
  - name: stress_propagation

derived_scales:
  source: "bdbot.materials.sphere_bulk + cases/chain_bend_dlvo_2d.find_well (inherited, verified)"
  kT: {value: 4.14195e-21, unit: J, expr: "k_B T"}
  gamma: {value: 1.17901e-8, unit: kg/s, expr: "3 pi eta d"}
  D_t: {value: 3.51307e-13, unit: m^2/s, expr: "kT/gamma"}
  tau_B: {value: 6.15103, unit: s, expr: "d^2/D_t"}
  tau_p: {value: 1.66462e-7, unit: s, expr: "m/gamma"}
  tau_bond:
    value: 5.901e-6
    unit: s
    expr: "gamma/k_bond"
    role: "★ the fastest mode — it sets dt. = 9.5936e-7 tau_B"
  tau_esc:
    value: 0.7076
    unit: s
    expr: "tau_bond * exp(|well_depth|/kT)"
    role: "★ the bond escape time = 0.115 tau_B. **The reference for the compression stage length** (the structural relaxation time)"
  sigma_bond: {value: 1.4398, unit: nm, expr: "sqrt(kT/k_bond)", role: "the width of the bond's thermal fluctuation"}
  ell: {value: 1481.16, unit: nm, expr: "d + h_min", role: "bond length (the equilibrium centre-to-centre distance)"}
  eps_crit:
    value: 0.007031
    unit: dimensionless
    expr: "(h_min - h_barrier)/ell"
    role: "★ the allowable linear strain per compression trigger. Confirmed by measurement: 0.40% holds / 0.80% collapses"
  h_bond_edge:
    value: 26.505
    unit: nm
    expr: "the outer solution of U(h) = well_depth/2 (h > h_min)"
    role: >
      ★ **the bond-detection boundary** — closer than this counts as a bond (r* < 1.018031).
      2.375× h_min. Not an arbitrary cutoff: defining it as half the well depth keeps z, the number of
      loops and the free-end fraction from wobbling with an arbitrary choice.

dimensionless:
  reference: {length: d, time: tau_B, energy: kT, strategy: thermal}
  groups:
    - {name: "phi_final", value: 0.10, meaning: "the volume fraction — a sparse gel"}
    - {name: "well_depth/kT", value: -11.7155, meaning: "★ reversible bonds (τ_esc=0.115 τ_B)"}
    - {name: "barrier/kT", value: 416.390, meaning: "a transition to the primary minimum is effectively impossible"}
    - {name: "k_bond_star", value: 1.0424e6, meaning: "k_bond d²/kT — the stretching stiffness"}
    - {name: "tau_bond/tau_B", value: 9.5936e-7, meaning: "★ 6 orders of scale separation — the origin of the dt cost"}
    - {name: "tau_esc/tau_B", value: 0.115, meaning: "bond rearrangement / diffusion. The criterion for the quasi-staticity of the compression"}
    - {name: "eps_crit", value: 0.007031, meaning: "the allowable strain per compression stage → 134 stages"}
    - {name: "sigma_bond/h_min", value: 0.129, meaning: "the width of the bond's thermal fluctuation / the well location"}

numerics:
  dt:
    value: null
    unit: null
    source: >
      Derived in L3. The candidate fastest mode is τ_bond (= 9.5936e-7 τ_B). By the design convention
      dt/τ_fast = 1e-2 → dt ≈ 9.59e-9 τ_B.
      ⚠️ **During compression there is one more candidate** — the curvature at the seat a collapsed pair
      settles into (h*≈−0.042, where the WCA core and the vdW balance) is larger than k_bond. If collapses
      occur, dt has to be looked at again (which is why crushed_bond_fraction is measured).
    tier: 3
  compression_stage_length:
    value: null
    unit: null
    source: >
      ★ **This is what sets the stage-1 cost.** The two extremes are different physics:
        · stage = τ_esc (0.115 τ_B) → 15.4 τ_B in total → 1.6e9 steps → 70 hours per seed (N=1528)
          = **quasi-static** compression, in which the bonds have time to rearrange at every stage
        · stage = the τ_bond scale (1e-3 τ_B) → 0.13 τ_B in total → 1.4e7 steps → 37 minutes per seed
          = **affine** compression, in which the bonds do not break but diffusion never intervenes
      → Compare 2~3 points in the pilot and **measure the independence from the compression rate**
      (observation A8). If it is not independent, that is itself a result (rule 7).
    tier: 3
  aggregation_time:
    value: null
    unit: null
    source: >
      ★ The aggregation time before compression. Undecided — fixed by measuring the time curves of
      percolation and z in the pilot.
      An estimate: at φ₀=0.02 it takes 0.07 τ_B to diffuse the mean nearest-neighbour gap of 0.65d.
      Full gelation (percolation) is longer than that. Since 1 τ_B = 4.5 hours per seed (N=1528),
      **it must not be set large without measuring** (N3: measure it before ruling).
    tier: 3
  stat_target_pct: 5.0
  production_note: "stage 1 is not a sweep but structure generation — the seed ensemble is the whole of the statistics"

required_convergence_checks:
  - "dt halving convergence — whether the structural observables (z, the number of loops, d_f) stay put with dt (Brownian is O(δt))"
  - "independence from the compression rate — 2~3 points of compression_stage_length (A8)"
  - "finite size — whether z, the number of loops and percolation are retained at N 512 ↔ 1528"
  - "confirm crushed_bond_fraction ≈ 0 — if it is not 0, ε has to be reduced further"

not_verified:
  - "★★ whether the compression can reach φ=0.1 without breaking the gel — ε_crit was measured on
     **a single pair**. If a percolating network stiffens, affine compression loads several bonds at once
     and the threshold may come down. Judged by measuring crushed_bond_fraction"
  - "★★ the physical time needed for gelation (aggregation_time) is unmeasured — it sets the whole stage-1
     cost and there is only an estimate. The pilot comes first"
  - "The primary source of the Hamaker constant (1.05e-20 J) is unconfirmed (tier 2). If the conclusion is sensitive to the value of A, re-confirm"
  - "The project's first 3D case — 3D free diffusion has been verified (⟨r²⟩=6Dt, −1.40%) but there may
     remain places in bdbot that assume 2D (observation N4)"
  - "τ_p/τ_bond = 0.0282 exceeds the criterion for neglecting inertia (1e-2) by 2.82×. With ζ=2.98 the
     overdamped condition is satisfied, and chain-bend-2d-oscill measured the effect as 0.159% by
     contrasting OverdampedViscous vs Langevin(kT=0) at a far worse ζ=0.65 — but **that contrast was not
     done directly in this system.** If the structural observables come out against expectation, suspect
     here first.
     (chain-bend-2d-dlvo has the same value and the same unverified status — the same particle and the same bond)"
  - "★ Whether the compression is 'affine' or 'quasi-static' is divided by T_stage/τ_esc. The pilot's
     T_stage=1e-3 τ_B gives a ratio of 0.0085, which is on the side where **diffusion does not intervene** —
     which may mean the structure is an affine image of the pre-compression arrangement. Do not say
     'it gelled' before A8 (the independence from the compression rate) has been measured"
  - "Whether stage 2's bending implementation (force.Custom, 26× slower) is affordable at N=1528 with an ω sweep is unmeasured"
