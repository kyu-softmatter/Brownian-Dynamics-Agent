    resolution: >
      **3D** (user-specified 2026-08-06, "physical"). ★ My lean (2D) was wrong — it was an attempt to
      pare down the physics on cost grounds, and the user chose the physics.
      Consequences: (1) G* is in [Pa], so direct comparison with the literature is possible (2) percolation
      is far easier than in 2D (3) **the first 3D case in this project** — every 2D assumption in `bdbot/`
