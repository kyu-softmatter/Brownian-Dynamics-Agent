raw_transcription: |
  [the whole photo] One page of a ruled notebook (horizontal blue rules + a vertical red margin line
  on the left). Black pen.
  Photographed with the page laid 90° over — rotated upright, the drawing is on the left and the text on the right.

  [text on the right — top to bottom]
    colloidal network

      identical bead
      DLVO, & JKR

    move one particle
    and see the network behaviors
    G'(w).  G"(w).
    response time ,  stress propagation

      x(t) = A sin (wt)

  (transcription note: the original is written with the Latin lowercase `w`, not the Greek ω. G' is
   clearly distinguished with 1 prime and G" with 2 primes. The last letter of `time` in
   "response time" is smudged and could also be read as `tine`/`times`, but from the context it is
   time — see unread_regions U2.
   The `(t)` of `x(t)` is written small, like a subscript.)

  [the drawing on the left]
    · 1 hand-drawn rectangular border (a quadrilateral; all four sides are there but the corners do
      not close). The circles sit inside this border. The border has **no** label, dimension or arrow.
    · **Exactly 21** circles (ellipses) inside the border. They are drawn touching or slightly
      overlapping each other, joined into a chain-like shape. The circle sizes are not uniform
      (the smallest ~35px to the largest ~155px, about a 4× spread) — though the text does say
      "identical bead" (ambiguity A5).
    · The connection structure (counting a link between every touching pair): **no closed loops = a tree**.
      21 nodes · 20 links · 1 four-way branch point · 2 three-way branch points · 6 free ends.
      (for the coordinates and numbering see dia_annot.png in scratch/)
    · **No** letters, numbers, arrows or shading inside the circles. Nothing in the drawing marks which
      particle is to be moved.
    · **No** force/displacement arrows, no trap (∨ shape, tweezers), no coordinate axes, no scale bar.

  [otherwise]
    · No erased writing or painting over (every black-pen stroke is intact).
    · Faint pencil/impression marks are visible across the page but are judged to be bleed-through from
      the back — see U1.

