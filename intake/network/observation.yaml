    what: "the driving amplitude (only the symbol A, with no value)"
    proposed: "sweep it to confirm linear response. The lower bound is several times the bond thermal fluctuation σ_bond=1.438nm"
    assumed_value: null
    note: >
      `chain-bend-2d-dlvo` swept 20nm~20µm (its lower bound 14× σ_bond).
      ★ This case **has to stay inside the linear-response region** for G'(ω) and G''(ω) to be defined —
      it must not "scan as far as breaking" the way the preceding case did; rather, **confirming
      independence of A (linearity) first** should be the first check.
    resolution: null

  - symbol: omega_range
    kind: choice
    what: "the frequency sweep range (only the symbol ω, with no value)"
    proposed: "once the governing timescale τ is settled, cover De=ωτ from 0.1 to 10. Derived in L3"
    assumed_value: null
    note: >
      ⚠️ This is where the project has been burned twice: in `chain-bend` the governing scale was
      **τ_max=γ/λ_min** rather than τ_chain (9.18× out), and the lower bound of `omega_range` did not
      reach the quasi-static plateau (De(ω_min)=0.993, against a criterion of 0.1). **For a G' plateau to
      be visible, the low-frequency end has to be quasi-static** — the first thing to confirm in this case.
      Also, **the τ of the trap/driving stiffness has to be included among the dt candidates** (1-D tooling lesson ③).
    resolution: null

  - symbol: driven_particle
    kind: choice
    what: "which particle is shaken (A7)"
    proposed: >
      In the post-compression structure, the particle nearest the box centre with a coordination ≥ the
      network's mean z. As a control group, 1 free end (deg=1) — the two extremes, which have a lot of
      discriminating power.
    assumed_value: null
    note: >
      Being 3D with PBC, whichever particle is chosen the distance to its image is the same, L/2 = 10d
      (the 2D worry of "far from the boundary" is meaningless under PBC) — what actually matters is the
      **local coordination**. Shaking a free end loads almost no stress into the network.
    resolution: null

  - symbol: n_seeds
    kind: choice
    what: "the size of the seed ensemble"
    proposed: "≥ 6 (network generation being stochastic, the scatter between realizations is likely to dominate)"
    assumed_value: null
    note: >
      ★ The `trap-drag` lesson: a single run's block SEM **underestimated the ensemble SEM by 1.09~2.28×**,
      and that overturned 2 conclusions. Since a network's very generation is stochastic, the scatter
      between realizations is expected to be **larger** than in `trap-drag` (a deterministic hexagonal lattice).
    resolution: null

  - symbol: T_obs
    kind: choice
    what: "the observation window + the sampling interval"
    proposed: "the period of the lowest ω × N_cycles (after equilibration). Derived in L3"
    assumed_value: null
    resolution: null

  - symbol: drive_direction
    kind: choice
    what: >
      The driving direction. The sketch says only `x(t) = A sin(ωt)`, with no direction (the symbol is
      `x`, but whether that is the box x axis or a general displacement is unclear).
    proposed: >
      Sweep θ = 0° (parallel) · 30° · 60° · 90° (perpendicular) in the local bond coordinate frame (A9-ⓐ).
      In addition, produce the box axes x/y/z alongside and use them as an **isotropy check**.
    assumed_value: null
    note: >
      ★ User-specified (2026-08-06): "it would also be good to move it along various angles, perpendicular
      to the network, parallel, and so on". **What the perpendicular/parallel is relative to was split off
      as A9** — because an isotropically compressed gel has no global axis.
      ⚠️ Being a stage-2 item it does not block stage 1 (gelation). But stage 1's output has to store
      **the list of each bead's bond vectors** for the local coordinate frame to be constructible in
      stage 2 — to be reflected in the design of the gelation script.
    resolution: null

  - symbol: compression_schedule
    kind: choice
    what: >
      The numerical details of the compression (the chosen values corresponding to A8's physical
      questions): the initial φ₀, the compression rate (dL/dt, or a per-step Δφ + the relaxation time at
      each step), and the aggregation time before compression.
    proposed: >
      φ₀ = 0.02 (dilute enough that there is no initial overlap or immediate aggregation) → aggregate for
      20 τ_B → compress in steps of Δφ = 0.01, relaxing 5 τ_B at each step → stop at φ = 0.10.
      8 steps in total · a compression stretch of 40 τ_B · compare 2× and ½× the rate as a quasi-staticity check.
    assumed_value: null
    note: >
      ★ This entry is left as a `choice` but **it can govern the result** (A8 impact).
      So it does not end with picking a value: **the independence from the compression rate has to be
      measured** — if it is not independent, that is itself a result to report (rule 7).
      It is referenced to τ_B = 6.151 s (inherited from chain-bend-2d-dlvo derived_scales).
      ⚠️ Box compression in HOOMD is `hoomd.update.BoxResize`, an API this project has **never once used** —
      there is no entry for it in skill `bd-hoomd`.
      A capability survey plus a minimal-configuration verification is needed before writing the code (N6).
    resolution: null

# ── what is already known before running (an optional section) ─────────
prerun_findings:
  - id: N1
    severity: "★★ structural — as drawn, the goal is not defined"
    finding: >
      The topology in the drawing is a tree (21 nodes · 20 links · 0 loops · 6 free ends). There is no
      closed path to carry stress, so in the quasi-static limit G'(ω→0) → 0.
      On top of that, what `chain-bend-2d-dlvo`'s G1 has already confirmed by measurement:
      a straight chain + purely central forces (DLVO) + bonds at natural length → **the linear bending
      stiffness is exactly 0**. A tree is several chains joined together, so that conclusion carries over unchanged.
    consequence: >
      With DLVO-only + a tree topology the result is likely to be a repetition of what is already known
      (that case's result: the more precisely K' was measured the more it converged to 0, 0.66~0.84σ under
      the best conditions).
      **To learn something new it has to be either a percolating network with loops or have JKR turned
      on** → A2 and A6 are the fork that decides this case's value.
    verified: false

  - id: N2
    severity: "★ methodology — a trap already measured"
    finding: >
      Converting a single-point response into a bulk modulus with GSER, `G*(ω) = K*(ω)/(6πa)`, has been
      confirmed **invalid** in this family (CLAUDE.md 1-D, `viz_moduli.py`).
      And on a whole-system energy budget, a DLVO chain dissipates **0.996×** what the bead does on its
      own — it was rheologically invisible.
    consequence: >
      To claim a G'(ω) in this case, one of (ⓑ the virial stress of bulk shear) or (ⓒ the long-wavelength
      limit of two-point correlation) has to be used, and either way it has to come with a
      **cross-check that has no free parameters** — the energy integral and the lock-in agreeing to
      0.11~0.17% in the preceding case is the model for that.
    verified: true

  - id: N3
    severity: "ℹ cost — measure it before ruling"
    finding: >
      `md.force.Custom` calls into Python every step and is **26×** slower at n=25
      (2,339 vs 61,264 steps/s). There is a precedent for switching to a ghost particle +
      `bond.Harmonic(r0=0)` and obtaining 55,551 steps/s (a sweep from 25 days → 1.16 days).
    consequence: >
      N=1528 (3D) + an ω sweep + 6 seeds is unaffordable if written naively.
      Before ruling that "it is too expensive to run", **measure which side the cost is on** (CLAUDE.md).
    verified: true

  - id: N4
    severity: "★★ the project's first 3D case — every 2D assumption has to be checked over"
    finding: >
      The 6 existing cases are **all 2D** (`dimensions: 2`). Going to 3D puts all of the following back up
      for confirmation: the initial arrangement (2D hexagonal → 3D random/fcc) · minimum image and the 6
      components of `Snapshot.configuration.box` (Lz≠0) · `D_t = kT/γ` is unchanged but **the dimensional
      factor 2·dim in the MSD** · the 3×3 components of the virial stress tensor and dividing by the
      volume · the diffusion noise `√(2·dim·dt)` (health.py ②b uses this factor).
    consequence: >
      The places among `bdbot/`'s 20 modules that assume dim have to be swept. This project has a
      precedent of producing a **+1856% error** from a missing minimum image (rule 6) — the 3D transition
      is a point where the same kind of quiet error easily appears. It is recommended to
      **verify 3D free diffusion in isolation first** (the analytic solution `⟨r²⟩=6Dt`) (rule 7).
    verified: false

  - id: N5
    severity: "★★ implementation — HOOMD topology is static but aggregation is dynamic"
    finding: >
      In "scatter → DLVO aggregation → compress", the bonds **form during the run.** But HOOMD's `bond`
      and `angle` are a **static topology** fixed at state creation, so they cannot be declared during
      aggregation. On top of that the JKR bending stiffness (settled as on in A2) is a 3-body angle term.
      ⛔ And `md.angle.Harmonic` clamps `sin θ` at √2×10⁻³, so **the force is up to 96% wrong for a nearly
      straight triplet** (the energy is exact, so an energy check does not catch it — CLAUDE.md,
      skill bd-hoomd traps 15, 16 and 17).
      Nearly straight triplets **inevitably** appear in the chain segments of a gel.
    consequence: >
      A 2-stage construction is forced:
      ① **the gelation stage** — pair potentials only (DLVO). No topology needed, and being a compiled path it is fast.
         Once the compression ends, extract the contact list and **freeze** the topology.
      ② **the measurement stage** — declare the bonds + bending on the frozen topology, then drive and measure.
      And ②'s bending **cannot use** `angle.Harmonic` —
      `force.Custom` (accurate but 26× slower, N3) is currently the only verified path.
      ★ Whether the bonds can break during the measurement (reversibility) also conflicts with this
      freezing — freeze it and breaking cannot be seen. What is being given up has to be stated.
    verified: false

  - id: N6
    severity: "★ a new API — no capability survey done"
    finding: >
      Box compression (`hoomd.update.BoxResize`) is something this project has **never used** —
      there is no entry for it in docs/hoomd_capabilities.md or skill `bd-hoomd`.
    consequence: >
      By rule 4 (do not write HOOMD code from intuition), a minimal-configuration verification is needed
      before the code. At minimum, confirm: whether the compression **scales the particle coordinates
      along with it** (otherwise overlaps appear) · whether the pair cutoff / cell list is updated during
      compression · whether the compression conflicts with the `Brownian` integrator's noise.
    verified: false

