      φ=0.1 is a typical range for a colloidal gel, and being 3D, the percolation uncertainty that was a
      worry in 2D is greatly reduced (and on top of that it is forced by the compression — network_protocol).
      ⚠️ Since compression **raises** φ, whether 0.1 is the final or the initial value is what divides → A8.
    resolution: "0.1 (user-specified 2026-08-06, 'a sparse gel')"
