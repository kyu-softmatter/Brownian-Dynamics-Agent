      ⚠️ **That the result is independent of the compression rate must be confirmed by measurement**
      (comparing 2~3 rates). If it is not independent, that is itself a result (rule 7).
    resolution: null

  - id: A9
    issue: >
      ★ The user specified a sweep of the driving direction — "various angles: perpendicular to the
      network, parallel, and so on". But **an isotropically compressed 3D gel has no global 'network
      direction'.** Perpendicular/parallel to what?
    impact: >
      · Reading ⓐ **relative to the local bond direction** (parallel = along the driven bead's bond axis,
        perpendicular = its normal plane). This is physically the sharpest — DLVO being a central force,
        **along the bond axis there is a stretching stiffness k_bond=2.0017e-3 N/m (=1.044e6 kT/d²), and
        in the perpendicular direction the linear stiffness is exactly 0** (chain-bend-2d-dlvo G1, measured).
        So the parallel/perpendicular contrast becomes **the axis that directly measures the DLVO vs JKR
        bending contrast**.
        The expected ratio: parallel comes from k_bond and perpendicular only from the JKR bending
        (κ_θ=1.391e6 kT), so turning JKR off should drop the perpendicular stiffness to 0.
      · Reading ⓑ **relative to a global axis** — but this only holds if the gel is anisotropic, and for
        that the compression has to be **uniaxial**. The moment it is, the system changes (a
        compression-anisotropic gel rather than an isotropic one). The observables change too (G* per axis).
      · Reading ⓒ just **the box axes x/y/z** — for an isotropic gel these should be statistically
