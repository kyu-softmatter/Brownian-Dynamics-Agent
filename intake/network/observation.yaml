    confirmed_by: user

  - id: A8
    issue: >
      ★ The details of the compression (the squeeze) are not fixed: is φ=0.1 **the final value after
      compression** or **the initial value at scattering**, what is the compression rate, and is the
      aggregation finished first and then compressed, or is it aggregated while being compressed?
    impact: >
      · **Final vs initial**: compression raises φ, so the difference between the two is a density
        difference outright. Read as an initial 0.1 and compressing L by, say, 0.8× gives a final
        φ=0.195 — nearly 2× different.
      · **Compression rate**: pressing faster than the time for the bonds to rearrange thermally
        (τ_bond=5.9µs, τ_B=6.15s) freezes in a non-equilibrium structure (locally dense clusters + large
        voids); pressing slowly gives something more homogeneous. **G'(ω) can respond to this difference
        by orders of magnitude** — network_protocol's original warning ("the protocol matters more than
        the parameters") carried over to here.
      · **Aggregate first vs simultaneously**: aggregating first makes sparse fractal clusters which are
        then pressed together, so **cluster-cluster contacts** become the skeleton (typical of a DLCA gel).
        Doing both at once gives a more homogeneous mesh. The topology (the number of loops) differs.
    lean: >
      φ=0.1 is the **final (production) value**, the compression is **quasi-static** (relaxing on the
      τ_B scale at each compression step), and **aggregation goes first**, run far enough before
      compressing. Grounds: (1) answering "a sparse gel" when asked about φ reads as describing a property
      of the system to be measured (2) it has to be quasi-static for the result not to be an artefact of
      the arbitrary choice of compression rate (3) the user's sentence, "squeeze the box **while** they
      form a network with each other via DLVO", pictures the aggregation going first or simultaneously —
