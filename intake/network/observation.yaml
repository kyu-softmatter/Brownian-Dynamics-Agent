# ── 실행 전에 이미 알고 있는 것 (선택 섹션) ──────────────────────────────
prerun_findings:
  - id: N1
    severity: "★★ 구조적 — 그림 그대로면 목표가 정의되지 않음"
    finding: >
      그림의 위상은 트리입니다(노드 21·링크 20·고리 0·자유단 6). 응력을 나르는
      닫힌 경로가 없으므로 준정적 극한에서 G'(ω→0) → 0 입니다.
      게다가 `chain-bend-2d-dlvo` 의 G1 이 이미 실측으로 확인한 것:
      직선 사슬 + 순수 중심력(DLVO) + 자연장 결합 → **선형 굽힘강성이 정확히 0**.
      트리는 사슬 몇 개를 이어 붙인 것이라 이 결론이 그대로 갑니다.
    consequence: >
      DLVO-only + 트리 위상이면 결과가 이미 알려진 것의 반복이 될 가능성이 큽니다
      (그 케이스 결과: K' 이 정밀해질수록 0 으로 수렴, 최선 조건에서 0.66~0.84σ).
      **새로 배우려면 고리가 있는 침투 망이거나 JKR 이 켜져야 합니다** → A2·A6 이
      이 케이스의 가치를 정하는 갈림길입니다.
    verified: false

  - id: N2
    severity: "★ 방법론 — 이미 실측된 함정"
    finding: >
      GSER `G*(ω) = K*(ω)/(6πa)` 로 1점 응답을 벌크 탄성률로 바꾸는 것은 이 계열에서
      **무효**임이 확인됐습니다 (CLAUDE.md 1-D `viz_moduli.py`).
      또 계 전체 에너지 수지로 보면 DLVO 사슬은 소산이 비드 혼자일 때의 **0.996배**
      — 유변학적으로 보이지 않았습니다.
    consequence: >
      이 케이스에서 G'(ω) 를 주장하려면 (ⓑ 벌크 전단의 virial 응력) 또는
      (ⓒ 2점 상관의 장파장 극한) 중 하나를 써야 하고, 어느 쪽이든 **자유
      파라미터 없는 교차검증**을 같이 내야 합니다 — 직전 케이스에서 에너지 적분과
      락인이 0.11~0.17% 로 맞은 것이 그 본보기입니다.
    verified: true

  - id: N3
    severity: "ℹ 비용 — 판정 전에 재라"
    finding: >
      `md.force.Custom` 은 매 스텝 파이썬을 호출해 n=25 에서 **26배** 느립니다
      (2,339 vs 61,264 steps/s). 유령입자 + `bond.Harmonic(r0=0)` 으로 바꿔
      55,551 steps/s 를 얻은 전례가 있습니다 (스윕 25일 → 1.16일).
    consequence: >
      N=1528(3D) + ω 스윕 + 시드 6 은 순진하게 짜면 감당이 안 됩니다.
      "비싸서 못 돌린다" 를 판정하기 전에 **어느 쪽 비용인지** 재세요 (CLAUDE.md).
    verified: true

  - id: N4
    severity: "★★ 이 프로젝트 최초의 3D 케이스 — 2D 가정을 전부 점검해야 함"
    finding: >
      기존 6개 케이스가 **전부 2D** 입니다 (`dimensions: 2`). 3D 로 가면 다음이
      전부 다시 확인 대상입니다: 초기 배치(2D 육방 → 3D 무작위/fcc) · 최소이미지와
      `Snapshot.configuration.box` 의 6성분(Lz≠0) · `D_t = kT/γ` 는 그대로지만
      **MSD 의 차원 인자 2·dim** · virial 응력 텐서의 3×3 성분과 부피 나눗셈 ·
      확산 잡음 `√(2·dim·dt)` (health.py ②b 가 이 인자를 씀).
    consequence: >
      `bdbot/` 모듈 20개 중 dim 을 가정한 곳을 훑어야 합니다. 이 프로젝트는 최소이미지
      누락으로 **+1856% 오차**를 낸 전례가 있습니다 (규칙 6) — 3D 전환은 같은 종류의
      조용한 오류가 나기 쉬운 지점입니다. **먼저 3D 자유확산 단독 검증**(해석해
      `⟨r²⟩=6Dt`)으로 격리 확인할 것을 권합니다 (원칙 7).
    verified: false

  - id: N5
    severity: "★★ 구현 — HOOMD 위상은 정적인데 응집은 동적이다"
    finding: >
      "흩뿌림 → DLVO 응집 → 압축"은 결합이 **런 중에 생깁니다.** 그런데 HOOMD 의
      `bond`/`angle` 은 상태 생성 시 정해지는 **정적 토폴로지**라 응집 중에는 선언할
      수 없습니다. 게다가 JKR 굽힘강성(A2 에서 켜기로 확정)은 3체 각도항입니다.
      ⛔ 그리고 `md.angle.Harmonic` 은 `sin θ` 를 √2×10⁻³ 로 클램프해서
      **거의 곧은 삼중항에서 힘이 최대 96% 틀립니다** (에너지는 정확해서 에너지
      검증으로는 안 잡힘 — CLAUDE.md, skill bd-hoomd 함정 15·16·17).
      겔의 사슬 구간에는 거의 곧은 삼중항이 **반드시** 생깁니다.
    consequence: >
      2단계 구성이 강제됩니다:
      ① **겔화 단계** — 페어 퍼텐셜만 (DLVO). 위상 불필요, 컴파일 경로라 빠름.
         압축 종료 후 접촉 목록을 뽑아 위상을 **동결**한다.
      ② **측정 단계** — 동결된 위상으로 bond + 굽힘을 선언하고 구동·측정.
      그리고 ②의 굽힘은 `angle.Harmonic` 을 **쓸 수 없습니다** —
      `force.Custom`(정확하나 26배 느림, N3) 이 현재 유일하게 검증된 길입니다.
      ★ 결합이 측정 중 끊어질 수 있는지(가역성)도 이 동결과 충돌합니다 —
      동결하면 끊어짐을 못 봅니다. 무엇을 포기하는지 명시해야 합니다.
    verified: false

  - id: N6
    severity: "★ 새 API — 능력조사 미실시"
    finding: >
      박스 압축(`hoomd.update.BoxResize`)은 이 프로젝트가 **한 번도 쓴 적이 없습니다** —
      docs/hoomd_capabilities.md 와 skill `bd-hoomd` 에 항목이 없습니다.
    consequence: >
      규칙 4(HOOMD 코드를 감으로 쓰지 않는다)에 따라 코드 전에 최소구성 검증이
      필요합니다. 최소한 확인할 것: 압축이 입자 좌표를 **함께 스케일**하는지
      (아니면 겹침이 생김) · 압축 중 페어 컷오프/셀리스트가 갱신되는지 ·
      압축이 `Brownian` 적분기의 잡음과 충돌하지 않는지.
    verified: false

