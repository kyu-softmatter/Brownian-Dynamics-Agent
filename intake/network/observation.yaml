      the loops.
      → The actual N and topology are fixed under missing_required's `network_protocol` and `N`.
    resolution: >
      **Settled as a schematic** (2026-08-06). Since the user specified the generation protocol as
      "scatter → DLVO aggregation → squeeze the box", the topology **does not come from the drawing but
      emerges as the result of the compression**.
      So the 21-node tree as drawn is a schematic, and the topological quantities to be measured
      (z, the number of loops, the free-end fraction, the fractal dimension d_f) become **observables** —
      measured before and after compression and reported.
      ★ The drawing's z=1.905 and 0 loops are not discarded but kept as **the baseline for what the
      compression changed** (the expectation being that aggregation without compression would come out
