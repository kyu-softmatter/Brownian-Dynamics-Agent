      대조군으로 자유단(deg=1) 1개 — 판별력이 큰 두 극단.
    assumed_value: null
    note: >
      3D·PBC 라 어느 입자를 골라도 이미지까지의 거리는 L/2 = 10d 로 같습니다
      (2D 에서 걱정했던 "경계에서 멀리"는 PBC 에서 무의미) — 실제로 중요한 것은
      **국소 배위수**입니다. 자유단을 흔들면 망에 응력을 거의 안 싣습니다.
    resolution: null

  - symbol: n_seeds
    kind: choice
    what: "시드 앙상블 크기"
    proposed: "≥ 6 (망 생성이 확률적이므로 실현 간 산포가 지배할 가능성 큼)"
    assumed_value: null
    note: >
      ★ `trap-drag` 교훈: 단일 런의 블록 SEM 이 앙상블 SEM 을 **1.09~2.28배 과소평가**
