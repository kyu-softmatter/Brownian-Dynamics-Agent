      따라 움직여보는것도 좋을듯". **무엇에 대한 수직/평행인지는 A9 로 분리**했습니다 —
      등방 압축 겔에는 전역 축이 없어서입니다.
      ⚠️ 2단계 항목이라 1단계(겔화)를 막지 않습니다. 단 1단계 산출물에
      **각 비드의 결합 벡터 목록**을 저장해둬야 2단계에서 국소 좌표계를 만들 수
