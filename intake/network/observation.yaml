system_guess: >
  Oscillatory microrheology in which a **3D** network of identically sized colloidal beads is bonded by
  DLVO + JKR contact and **one particle is oscillated as x(t)=A sin(ωt)** to watch the network's
  viscoelastic response (G'(ω), G''(ω)), its response time and stress propagation.
  The network is **made by compression**: scatter into a 3D box → aggregate via the DLVO secondary
  minimum → squeeze the box isotropically to reach φ=0.1 (user-specified 2026-08-06 —
  A4 · A8 · network_protocol).
  ★ This is the direct successor to the unresolved task `chain-bend-2d-dlvo` left behind —
  that case's conclusion: "G′ and G″ cannot be extracted from a single chain … producing a real G′(ω)
  requires building a **network** of chains and computing it directly from the stress tensor"
  (CLAUDE.md 1-D).
  The sketch's "network" and "G'(ω), G''(ω)" are exactly that requirement.

