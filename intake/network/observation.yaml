# ── ① 전사 (보이는 그대로. 해석 안 함) ─────────────────────────────────
raw_transcription: |
  [사진 전체] 줄공책(가로 파란 줄 + 좌측 세로 빨간 여백선) 한 페이지. 검정 펜.
  페이지를 90° 눕혀 촬영 — 정방향으로 돌리면 좌측에 그림, 우측에 글.

  [우측 글 — 위에서 아래로]
    colloidal network

      identical bead
      DLVO, & JKR

    move one particle
    and see the network behaviors
    G'(w).  G"(w).
    response time ,  stress propagation

      x(t) = A sin (wt)

  (전사 주: 원문은 그리스 ω 가 아니라 라틴 소문자 `w` 로 쓰여 있음. G' 는 프라임 1개,
   G" 는 프라임 2개로 명확히 구분되어 있음. "response time" 의 `time` 은 끝자가 뭉개져
   `tine`/`times` 로도 보이나 문맥상 time — unread_regions U2 참조.
   `x(t)` 의 `(t)` 는 아래첨자처럼 작게 쓰여 있음.)

  [좌측 그림]
    · 손으로 그린 사각형 테두리 1개 (사변형, 네 변 모두 있으나 모서리가 안 닫힘).
      원들이 이 테두리 안에 들어 있음. 테두리에 라벨·치수·화살표 **없음**.
    · 테두리 안에 원(타원) **정확히 21개**. 서로 접하거나 살짝 겹치게 그려져
      사슬 모양으로 이어짐. 원 크기는 균일하지 않음(작은 것 ~35px ~ 큰 것 ~155px,
      약 4배 차) — 다만 글에 "identical bead" 라고 적혀 있음 (모호점 A5).
    · 연결 구조(접한 원끼리 이음으로 셈): **닫힌 고리 없음 = 트리(tree)**.
      노드 21 · 링크 20 · 4갈래 분기점 1개 · 3갈래 분기점 2개 · 자유단(끝) 6개.
      (좌표·번호는 scratch/ 의 dia_annot.png 참조)
    · 원 안에 글자·번호·화살표·색칠 **없음**. 어느 입자를 움직이는지 그림에 표시 없음.
    · 힘·변위 화살표, 트랩(∨ 모양·집게), 좌표축, 스케일바 **없음**.

  [그 밖]
    · 지운 글씨·덧칠 없음 (검정 펜 획은 전부 살아 있음).
    · 페이지 전반에 옅은 연필/눌린 자국이 보이나 뒷면 배임으로 판단 — U1 참조.

# ── ② 구조화 ──────────────────────────────────────────────────────────
system_guess: >
  동일 크기 콜로이드 비드로 이루어진 **3D** 네트워크를 DLVO + JKR 접촉으로 결합하고,
  **입자 하나를 x(t)=A sin(ωt) 로 진동**시켜 네트워크의 점탄성 응답(G'(ω), G''(ω)),
  응답 시간, 응력 전파를 보는 오실레이션 마이크로레올로지.
  망은 **압축으로 만듭니다**: 3D 박스에 흩뿌림 → DLVO 2차극소로 응집 → 박스를
  등방 스퀴즈해 φ=0.1 에 도달 (사용자 지정 2026-08-06 — A4·A8·network_protocol).
  ★ 이것은 `chain-bend-2d-dlvo` 가 남긴 미해결 과제의 직접 후속입니다 —
  그 케이스 결론: "G′·G″ 는 단일 사슬에서 못 뽑습니다 … 진짜 G′(ω) 를 내려면 사슬
  **망**을 만들어 응력 텐서에서 직접 계산해야 합니다" (CLAUDE.md 1-D).
  스케치의 "network" 와 "G'(ω), G''(ω)" 가 정확히 그 요구입니다.

entities:
  - kind: particle
    shape: sphere
    note: >
      "identical bead" — 단분산 명시. 크기·재질·개수 미기재.
      그림의 원 지름이 4배까지 차이 나지만 글이 identical 이라고 하므로
      그림 쪽을 손그림 편차로 봄 (모호점 A5).

  - kind: pair_interaction
    form: "DLVO"
    note: >
      전사 그대로 "DLVO, & JKR". 중심대칭 페어 퍼텐셜(이중층 반발 + vdW 인력).
      `chain-bend-2d-dlvo` 에 이미 유도·검증된 원장이 있음 (10mM MgCl2,
      2차극소 −11.716 kT @ h=11.158nm, k_bond=2.0017e-3 N/m).
      파라미터(Hamaker·염농도·표면전위)는 이 스케치에 **없음** → missing_required.

  - kind: pair_interaction
    form: "JKR (접착 접촉)"
    note: >
      DLVO 와 **함께** 적혔는지 **대안으로** 적혔는지 모호 (A2).
      [P1][P2] 모델에서는 JKR 접착접촉이 유한 접촉면을 만들어 접선 굽힘강성
      κ_θ 를 준다 — `chain-bend-2d-dlvo` 가 `--jkr` 대조군으로 이미 구현해 둠
      (κ₀=64 mN/m, κ_θ=5.7624e-15 J = 1.391e6 kT).
      ⚠️ 스케치는 "굽힘"/"bending"/"κ" 를 **적지 않았습니다** — JKR 이라는 이름만
      있습니다. 굽힘강성을 포함하는지는 추론이지 전사가 아닙니다.

  - kind: topology
    note: >
      그림상 **트리**(닫힌 고리 0개), 노드 21 · 링크 20 · 평균 배위수 z=1.905 ·
      분기점 3개(4갈래 1, 3갈래 2) · 자유단 6개.
      (재현: `$PY scratch/read_network_sketch.py` → intake/network/transcription_annotated.png)
      ★ 해소됨 (2026-08-06): 실제 위상은 그림에서 오지 않고 **압축 결과로 창발**합니다
      (network_protocol). 그림의 z=1.905·고리 0 은 **압축이 무엇을 바꿨는지의 기준선**
      으로 남깁니다 — 압축 후 z·고리 수·자유단 비율·프랙탈 차원은 **관측량**입니다.

  - kind: external_potential
    form: "x(t) = A sin(ωt)"
    note: >
      입자 **하나**에 부과. 트랩(k_t)이 그림·글 어디에도 없고 변위가 직접 시간함수로
      적혀 있으므로 **위치 강제**(position-forced)로 읽힘 —
      `chain-bend-2d-dlvo` 의 `--drive-mode position` 과 같은 규약.
      단 트랩 구동일 가능성도 배제 못 함 (A3). A·ω 값 미기재.

  - kind: box
    note: >
      손그림 사각 테두리. 치수·주기경계 표시·스케일바 **없음**.
      L 은 스케치에 없음 → 시뮬레이션 선택(choice).
      ★ 프로토콜 확정 후: 박스는 **고정이 아니라 압축되는 양**입니다 (φ₀ → φ=0.1).
      3D PBC. 압축 API 는 미검증 (N6).

