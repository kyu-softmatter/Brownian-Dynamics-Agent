    impact: >
      If it is a tree as drawn, there is **no elastic plateau in principle** — there is no closed path to
      carry stress, so G'(ω→0) → 0. That is close to repeating `chain-bend-2d-dlvo`'s conclusion
      (a single chain, K'→0) with a few branches attached, and there is little new to learn.
      If it is a percolating network, a G' plateau appears and that is the substance of this case.
    lean: >
      A schematic. Grounds: the title is "network" and the goals are G'(ω) and stress propagation, none of
