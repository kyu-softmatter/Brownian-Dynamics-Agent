  - symbol: omega_range
    kind: choice
    what: "주파수 스윕 범위 (기호 ω 만 있고 값 없음)"
    proposed: "지배 시간척도 τ 확정 후 De=ωτ 가 0.1~10 을 덮도록. L3 에서 유도"
