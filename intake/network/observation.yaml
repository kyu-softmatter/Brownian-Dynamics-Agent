# L0 Observation — 스케치에서 읽어낸 것. **초안: 사람 확인 대기**
# 프로토콜 (skill `bd-intake`): 전사 먼저 → 구조화 → 모호/미판독 명시 → 없는 값은 null
#
# 검사:  $PY -m bdbot.cli intake check intake/network
#
# ⚠️ 이 스케치에는 **수치가 하나도 없습니다.** 기호(A, ω)와 모델 이름(DLVO, JKR)만
# 있습니다. 따라서 아래 missing_required 가 유난히 깁니다 — 지어내지 않은 결과입니다.
#
# ── 단계 범위 (사용자 지정 2026-08-06) ─────────────────────────────────────
#   **1단계 (지금): 네트워크 생성까지만.** 흩뿌림 → DLVO 응집 → 박스 압축 → φ=0.1.
#            관측량은 만들어진 망의 구조(z · 고리 수 · 자유단 · d_f · 침투 · rdf).
#            구동·G'(ω) 는 이 단계에서 실행하지 않는다.
#   2단계 (나중): 한 입자의 위치를 x(t)=A sin(ωt) 로 강제 (A3 확정 — 위치 강제).
#            ★ 구동 **방향을 스윕**한다: 망에 수직 · 평행 · 그 사이 여러 각도 (A9).
#   → 이 분리는 N5(HOOMD 위상은 정적, 응집은 동적)가 강제하는 2단계와 **일치**합니다.

