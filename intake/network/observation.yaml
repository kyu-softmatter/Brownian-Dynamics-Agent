    resolution: >
      ⓐ **합쳐서 한 계** (사용자 지정 2026-08-06). DLVO 결합 + JKR 접착접촉의
      굽힘강성(κ₀=64 mN/m)을 같이 켭니다 = [P1][P2] 의 실제 모델.
