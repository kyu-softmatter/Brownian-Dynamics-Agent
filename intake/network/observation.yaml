  # ────────── choice: 시뮬레이션 선택. 차단하지 않습니다 ──────────
  - symbol: N
    kind: choice
    what: >
      ★ 실제 입자 수. 그림의 21개는 **도식**입니다 (A6) — 목표가 G'(ω)·응력 전파라
      벌크/앙상블 양이므로 21개 트리로는 정의되지 않습니다 (skill bd-intake §1).
    proposed: "3D·φ=0.1: 645 ~ 2984 (권장 시작 **1528** = L/d 20). 유한크기 검사 645 ↔ 2984"
    assumed_value: null
    note: >
      ★ 3D·φ=0.1 확정 후 재계산 (A4·phi). N = φ·(L/d)³·6/π:
        L/d=12 → 330 · **15 → 645** · **20 → 1528** · **25 → 2984** · 30 → 5157
        (d=1.47µm 이므로 L/d=20 은 실공간 29.4 µm)
      근거는 감이 아니라 관측량에서 옵니다 (bd-intake §1):
      ① **침투·고리**: 압축(network_protocol)이 침투를 강제하므로 2D 에서 걱정했던
         "안 이어질 수 있다"는 해소됐습니다. 남는 요구는 박스가 메시 ξ 의 여러 배일 것.
         φ=0.1 성긴 겔이라 ξ 가 큽니다 → **L/d ≥ 15 는 하한, 20 이 실질 최소**.
      ② **응력 전파**: PBC 에서 유효 반경은 L/2 뿐입니다 — L/d=20 이면 10d.
         `chain-bend-2d-dlvo` 의 감쇠길이 λ=2.6ℓ 를 그대로 가정하면 10d ≈ 3.8λ 로
         위상 기울기를 재기에 **빠듯합니다**. 전파 측정이 주 목표가 되면 L/d=25(12.5d)
         가 필요합니다. ⚠️ 겔의 λ 는 사슬의 λ 와 다를 수 있어 **첫 런에서 재고 판단**.
      ③ **통계**: virial 응력 요동 ∝1/√N. 목표 5%(stat_target_pct)면 N 수백 대 이상.
         L/d=20 의 1528 은 여유가 있습니다.
      ④ **비용**: 3D 는 (L/d)³ 이라 여기가 벽입니다. 직전 케이스가 저주파에서
         **시드당 25시간**이었고, JKR 굽힘을 `force.Custom` 으로 넣으면 **26배**
         느립니다 (N3·N5). N 을 키우기 전에 **스텝률을 먼저 재세요**.
      ⟹ **L/d=20, N=1528 에서 시작**하고 유한크기 검사를 645↔2984 로 돌려
         G' 고원이 N 에 안 변하는지 확인할 것을 제안합니다.
      ⚠️ φ 가 압축 후 최종값이라는 전제입니다 (A8). 초기값으로 읽으면 최종 N 이
         같아도 L 이 줄어 L/d 가 작아집니다 — A8 이 풀리면 재계산.
    resolution: null

  - symbol: L
    kind: choice
    what: "박스 크기 + 주기경계 여부 (테두리에 치수·PBC 표시 없음 — U3)"
    proposed: "L = 20 d = 29.4 µm, 3D PBC (x·y·z 전부). N·φ 와 L³=N·(πd³/6)/φ 로 묶임"
