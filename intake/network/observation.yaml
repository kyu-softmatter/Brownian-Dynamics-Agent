    lean: >
      ⓑ 쪽으로 약하게 기울어짐. 근거: 쉼표+`&` 표기("DLVO, & JKR")가 나열로 읽히고,
      직전 케이스가 정확히 그 대조 구조(`--jkr` 플래그)로 돌아갔음. 하지만 "&" 는
