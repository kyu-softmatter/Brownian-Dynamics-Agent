      (dL/dt 또는 단계별 Δφ + 각 단계 이완시간), 압축 전 응집 시간.
    proposed: >
      φ₀ = 0.02 (충분히 묽어 초기 겹침·즉시응집 없음) → 응집 20 τ_B 진행
      → 단계 압축 Δφ = 0.01 씩, 각 단계마다 5 τ_B 이완 → φ = 0.10 에서 정지.
      총 8단계 · 압축 구간 40 τ_B · 준정적성 검사로 속도 2배·½배를 비교.
    assumed_value: null
    note: >
      ★ 이 항목은 `choice` 로 두었지만 **결과를 좌우할 수 있습니다** (A8 impact).
      그래서 값을 고르는 것으로 끝내지 않고 **압축 속도 무관성을 실측**해야 합니다 —
      무관하지 않으면 그 자체가 보고할 결과입니다 (원칙 7).
      τ_B = 6.151 s (chain-bend-2d-dlvo derived_scales 승계) 기준입니다.
      ⚠️ HOOMD 에서 박스 압축은 `hoomd.update.BoxResize` 인데 이 프로젝트가 아직
      **한 번도 써보지 않은 API** 입니다 — skill `bd-hoomd` 에 항목이 없습니다.
