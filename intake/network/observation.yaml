ambiguities:
  - id: A1
    issue: >
      ★★ "move one particle"(국소 1점 구동)과 "G'(ω), G''(ω)"(벌크 탄성률)가
      **같은 양이 아닙니다.** 어느 쪽을 원하는지가 케이스 전체를 가릅니다.
    impact: >
      · 읽기 ⓐ 1점 마이크로레올로지 → 나오는 것은 국소 응답 K*(ω) [N/m].
        GSER 로 G*=K*/(6πa) 환산은 **이 계에서 무효**임이 이미 실측으로 확인됨
        (CLAUDE.md 1-D: "비드가 느끼는 것은 매질이 아니라 이웃 비드 2개").
        망에서는 사슬보다 낫지만 메시 크기 ~ d 라 연속체 가정이 여전히 깨짐.
      · 읽기 ⓑ 벌크 진동 전단 → 응력 텐서(virial)에서 G*(ω) 직접. 정확하지만
        구동이 "move one particle" 이 **아님** — 스케치와 어긋남.
      · 읽기 ⓒ **2점 마이크로레올로지** — 한 입자를 흔들고 **멀리 있는 입자들의
        상관 변위**를 봄. 장파장 극한에서 G*(ω) 가 정당하게 나오고, 같은 측정이
        "stress propagation"(거리별 위상 지연)과 "response time" 을 **동시에**
        줍니다. 스케치의 네 목표가 하나의 측정으로 전부 나오는 유일한 읽기.
      정량 영향: ⓐ 와 ⓑ 는 단위부터 다릅니다(N/m vs Pa 또는 N/m in 2D).
      ⓐ 로 재고 ⓑ 라고 보고하면 `chain-bend-2d-dlvo` 가 이미 겪은 오류의 반복입니다.
    lean: >
      ⓒ. 근거: (1) 목표 4개가 전부 한 측정에서 나옴 (2) "move one particle" 을
      글자 그대로 지킴 (3) 프로젝트가 이미 `propagation_speed.py`(위상 기울기)와
      `system_moduli.py`(에너지 수지)를 갖고 있어 재사용 가능.
      ⚠️ 다만 bd-intake §2 경고대로 **배제 논증이 강하다고 남은 선택지 사이가
      갈린 것은 아닙니다** — ⓐ 도 "network behaviors" 를 보는 정당한 방법입니다.
      ⓐ 와 ⓒ 는 같은 런에서 **둘 다** 뽑을 수 있으므로(구동은 같고 분석만 다름)
      갈라 놓을 필요가 없을 수도 있습니다. 사람 확인 필요.
    resolution: null

  - id: A2
    issue: '"DLVO, & JKR" — 둘을 **합쳐서** 쓰라는 것인가, **각각 돌려 비교**하라는 것인가?'
    impact: >
      합치면(ⓐ) 계는 [P1][P2] 의 실제 모델이 되고 굽힘강성이 있어 G'(ω) 에 고원이
      생길 것으로 예상. 각각이면(ⓑ) `chain-bend-2d-dlvo` 가 사슬에서 한 대조를
