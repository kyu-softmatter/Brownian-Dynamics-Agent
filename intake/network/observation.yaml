# ── ⑤ values absent from the sketch that have to be supplied (not invented; provenance stated) ──
missing_required:

  # ────────── physical: properties of the system. These are what block L2 ──────────
  - symbol: network_protocol
    kind: physical
    what: >
      ★★ **This was the biggest gap in this case** — how the network is made. The bonding rule (which
      pairs get connected), the generation process (DLCA/RLCA aggregation? random-bond percolation?
      lattice dilution?), the target coordination z, the loop fraction, and whether the bonds are
      **reversible (breakable) or irreversible**.
    assumed_value: null
    note: >
      G'(ω) is far more sensitive to this protocol than to any single parameter — at the same φ and the
      same DLVO, the G' of a DLCA (sparse fractal) and of a random percolation (dense mesh) differ by
      orders of magnitude.
      The sketch gives only one drawing (a 21-node tree) and says nothing about the generation rule (A6).
    resolution: >
      **Compression-induced gelation** (user-specified 2026-08-06): "scatter particles into 3D space and,
      while they form a network with each other via DLVO, squeeze the box". That is, ① scatter randomly
      into a 3D box (without overlap) ② leave the aggregation to proceed via the DLVO secondary minimum
      ③ compress the box isotropically to reach the target φ.
      ★ The advantage of this protocol: it **forces percolation** — the earlier worry that "it might not
      connect at φ=0.1" is resolved by the compression, and loops also arise naturally as contacts
      increase during compression (A6 resolved).
      The compression details (the rate, whether φ is the final or the initial value) were split off as A8.
    confirmed_by: user

