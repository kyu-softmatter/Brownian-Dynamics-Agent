  # ────────── choice: a simulation choice. These do not block ──────────
  - symbol: N
    kind: choice
    what: >
      ★ The actual particle count. The 21 in the drawing are **a schematic** (A6) — the goals being
      G'(ω) and stress propagation, which are bulk/ensemble quantities, they are not defined on a
      21-node tree (skill bd-intake §1).
    proposed: "3D·φ=0.1: 645 ~ 2984 (recommended start **1528** = L/d 20). Finite-size check 645 ↔ 2984"
    assumed_value: null
    note: >
      ★ Recomputed after 3D and φ=0.1 were settled (A4 · phi). N = φ·(L/d)³·6/π:
        L/d=12 → 330 · **15 → 645** · **20 → 1528** · **25 → 2984** · 30 → 5157
        (d=1.47µm, so L/d=20 is 29.4 µm in real space)
      The grounds are not intuition but the observables (bd-intake §1):
      ① **percolation and loops**: since the compression (network_protocol) forces percolation, the 2D
         worry that "it might not connect" is resolved. What remains is that the box be several times the
         mesh ξ. At φ=0.1, a sparse gel, ξ is large → **L/d ≥ 15 is the floor and 20 the practical minimum**.
      ② **stress propagation**: under PBC the useful radius is only L/2 — at L/d=20 that is 10d.
         Assuming `chain-bend-2d-dlvo`'s decay length λ=2.6ℓ carries over, 10d ≈ 3.8λ, which is **tight**
         for measuring a phase gradient. If propagation becomes the main goal, L/d=25 (12.5d) is needed.
         ⚠️ A gel's λ may differ from a chain's, so **measure it in the first run and then judge**.
      ③ **statistics**: the virial stress fluctuation goes as 1/√N. For the 5% target (stat_target_pct),
         N of several hundred or more. The 1528 of L/d=20 has margin.
      ④ **cost**: 3D goes as (L/d)³, so this is the wall. The immediately preceding case took
         **25 hours per seed** at low frequency, and putting the JKR bending in via `force.Custom` is
         **26×** slower (N3 · N5). **Measure the step rate first** before raising N.
      ⟹ **Start at L/d=20, N=1528** and run the finite-size check at 645↔2984 to confirm that the G'
         plateau does not move with N.
      ⚠️ This presumes φ is the final value after compression (A8). Read as the initial value, the final
         N is the same but L shrinks so L/d gets smaller — recompute once A8 is resolved.
    resolution: null

  - symbol: L
    kind: choice
    what: "the box size + whether the boundary is periodic (the border has no dimensions and no PBC marking — U3)"
    proposed: "L = 20 d = 29.4 µm, 3D PBC (x, y and z). Tied to N and φ by L³=N·(πd³/6)/φ"
    assumed_value: null
    note: >
      ★ Being a compression protocol, L is **not a fixed value but a quantity that shrinks with time** —
      the value above is the size **after compression (production)**. The initial box is larger (A8).
      For two-point correlation and propagation the boundary is a problem: under PBC there is an image of
      the driving point every L, so **the useful radius for the propagation measurement is limited to
      L/2 = 10d** (see ② above).
    resolution: null

  - symbol: A_amplitude
