# ── ③ what is ambiguous (keep the keys even when empty) ────────────────
ambiguities:
  - id: A1
    issue: >
      ★★ "move one particle" (local single-point driving) and "G'(ω), G''(ω)" (a bulk modulus)
      **are not the same quantity.** Which one is wanted divides the whole case.
    impact: >
      · Reading ⓐ single-point microrheology → what comes out is a local response K*(ω) [N/m].
        Converting with GSER, G*=K*/(6πa), has already been confirmed by measurement to be
        **invalid for this system** (CLAUDE.md 1-D: "what the bead feels is not a medium but 2 neighbouring beads").
        A network is better than a chain, but with a mesh size ~ d the continuum assumption still breaks.
      · Reading ⓑ bulk oscillatory shear → G*(ω) directly from the stress tensor (virial). Accurate, but
        the driving is **not** "move one particle" — it contradicts the sketch.
      · Reading ⓒ **two-point microrheology** — shake one particle and watch **the correlated
        displacements of distant particles**. G*(ω) comes out legitimately in the long-wavelength limit,
        and the same measurement gives "stress propagation" (the phase lag with distance) and
        "response time" **at the same time**. The only reading in which all four of the sketch's goals
        come out of a single measurement.
      Quantitative impact: ⓐ and ⓑ differ even in units (N/m vs Pa, or N/m in 2D).
      Measuring ⓐ and reporting it as ⓑ would repeat the error `chain-bend-2d-dlvo` already made.
    lean: >
      ⓒ. Grounds: (1) all 4 goals come out of one measurement (2) it keeps "move one particle"
      literally (3) the project already has `propagation_speed.py` (the phase gradient) and
      `system_moduli.py` (the energy budget), so they can be reused.
      ⚠️ But as bd-intake §2 warns, **a strong exclusion argument is not the same as having decided
      between the remaining options** — ⓐ is also a legitimate way of watching "network behaviors".
      ⓐ and ⓒ can **both** be extracted from the same run (the driving is the same and only the
      analysis differs), so they may not need to be separated at all. Needs human confirmation.
    resolution: null

  - id: A2
    issue: '"DLVO, & JKR" — does it mean use the two **combined**, or run each **separately and compare**?'
    impact: >
      Combined (ⓐ), the system becomes [P1][P2]'s actual model, and having a bending stiffness it is
      expected to produce a plateau in G'(ω). Separately (ⓑ), it **repeats in a network** the contrast
      `chain-bend-2d-dlvo` made on a chain — the measured ratios in that case: K' 216×, bow 17.8× (22.3σ).
      The cost difference is 2× (the number of runs).
    lean: >
      Weakly leaning towards ⓑ. Grounds: the comma+`&` notation ("DLVO, & JKR") reads as a list, and
      the immediately preceding case ran exactly that contrast structure (the `--jkr` flag). But "&"
      means "and", so ⓐ is natural too — **this is a weak lean.**
    resolution: >
      ⓐ **combined, as one system** (user-specified 2026-08-06). The DLVO bond + the bending stiffness
      of JKR adhesive contact (κ₀=64 mN/m) are turned on together = [P1][P2]'s actual model.
      ★ My lean (ⓑ) was wrong — recorded here (bd-intake §2: a weak lean stays weak).
      ⚠️ Caution when interpreting the results: the DLVO-only contribution cannot be separated. If a
      plateau appears in G'(ω), this configuration alone cannot tell whether it is due to the bending
      stiffness or to the loop topology — if that becomes necessary, a control group with only the
      bending term turned off can be added then (same seed, same initial arrangement).
    confirmed_by: user

  - id: A3
    issue: "is x(t)=A sin(ωt) position forcing, or the trajectory of a trap centre?"
    impact: >
      Measured in `chain-bend-2d-dlvo`: at the default trap stiffness the driven bead followed the trap
      only 27% of the way, and that following failure **manufactured a spurious stiffness K′=105.7**
      (raising the following to 100% converged it to 0 at 0.84σ). So this choice changes the sign of the result.
      Also, by the project rule: "free deformation → shape; forced deformation → force" — the choice of
      observable changes too.
    lean: >
      Position forcing. Grounds: there is no trap anywhere in the drawing or the text, no `k_t` either,
      and the displacement is written directly as a function of time. (For a trap one normally writes
      `k_t` alongside — the `chain-bend-2d-oscill` sketch had `k_t = 10 pN/µm`.)
    resolution: >
      **Position forcing settled** (user 2026-08-06: "I am going to force one particle's position to move
      as Asin(wt)"). It is the same convention as `chain-bend-2d-dlvo`'s `--drive-mode position`, the way
      that case obtained a following ratio of 100%.
      ⟹ Applying the resulting project rule: **for forced deformation, measure the force, not the shape.**
      The observable is the reaction force on the driven bead (and the response of the neighbouring beads),
      not the shape of the chain.
    confirmed_by: user

  - id: A4
    issue: "is it 2D or 3D? The drawing is planar, but a colloidal gel is naturally 3D."
    impact: >
      · The units differ: G* is [N/m] in 2D and [Pa] in 3D. Whether direct comparison with literature values is possible hinges on it.
      · The percolation threshold differs — a network stands up far less easily in 2D, and may not connect at the same φ.
      · Cost: at the same L/d, N ∝ (L/d)^dim — at L=30d, 2D is a few hundred and 3D is thousands to tens of thousands.
