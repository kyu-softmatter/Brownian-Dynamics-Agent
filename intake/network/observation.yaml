      (4) N grows as (L/d)³ → the N and L entries were recomputed.
    confirmed_by: user

  - id: A5
    issue: 'the text says "identical bead" but the circle diameters in the drawing differ by up to ~4×.'
    impact: >
      If it is monodisperse, the bond length and the stiffness are all fixed to single values and the DLVO
