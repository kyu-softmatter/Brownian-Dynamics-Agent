      `trap-drag`(결정론적 육방격자)보다 실현 간 산포가 **더** 클 것으로 예상됩니다.
    resolution: null

  - symbol: T_obs
    kind: choice
    what: "관측창 + 표본 간격"
    proposed: "최저 ω 의 주기 × N_cycles (평형화 후). L3 에서 유도"
    assumed_value: null
    resolution: null

  - symbol: drive_direction
    kind: choice
    what: >
      구동 방향. 스케치에는 `x(t) = A sin(ωt)` 라고만 있어 방향이 없습니다
      (기호가 `x` 이지만 박스 x축인지 일반 변위인지 불명).
    proposed: >
      국소 결합 좌표계에서 θ = 0°(평행) · 30° · 60° · 90°(수직) 스윕 (A9-ⓐ).
      덧붙여 박스 축 x/y/z 를 같이 내서 **등방성 검사**로 쓴다.
    assumed_value: null
    note: >
