        "perpendicular/parallel".
    lean: >
      ⓐ the local bond direction. Grounds: (1) isotropic compression (the current protocol) has no global
      axis (2) the parallel/perpendicular asymmetry of a central force is **the core physics** of this
      family and there is already measured evidence for it (3) the phrase "perpendicular to the network"
      reads naturally as perpendicular to the local skeleton.
      The plan: build a local coordinate frame from the driven bead's bond vectors and sweep
      θ = 0°·30°·60°·90° (parallel→perpendicular). The isotropy check also yields ⓒ (the box axes) alongside — it is free.
      ⚠️ If ⓑ (a global axis) is what is wanted, **the compression has to be changed to uniaxial**, and
      that is a decision that changes the stage-1 gelation protocol itself — there is no need to ask now,
      but it has to be settled before stage 2 begins.
    resolution: null

  - id: A7
    issue: "which particle is moved? The drawing does not mark one."
    impact: >
      Shaking a four-way branch point and shaking a free (dangling) end give qualitatively different
      responses — a free end loads almost no stress into the network (29% of the drawing is free ends).
      If two-point correlation (A1-ⓒ) is to be used, it has to be **in the middle of the network** for
      propagation to be visible in all directions.
    lean: >
      The particle closest to the box centre whose coordination is at or above the network mean. Grounds:
      to keep boundary reflections as far away as possible and see the propagation isotropically.
      (Driving a free end is worth running as a separate control group — being the two extremes, they have
