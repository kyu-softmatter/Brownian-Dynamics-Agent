# ── ③ what is ambiguous ───────────────────────────────────────────────
ambiguities:
  - id: C1
    issue: "★★ the bond potential U_ij is blank (only a squiggle is drawn)"
    impact: |
      G'(ω) and G''(ω) come out of the chain's relaxation spectrum. Without U_ij no
      timescale (τ_bond) can be entered in the scale ledger and the non-dimensionalization
      does not complete.
      → the core physics of this case is undecided. Ahead of every other item.
    options:
      - "harmonic bond (k_b) — the simplest. τ_b = γ/k_b"
      - "FENE (finite extension) — nonlinear at large amplitude"
      - "WCA + bond — includes overlap prevention"
      - "+ angle harmonic (bending κ) — implied by the folder name 'chain-bend', but absent from the sketch"
    resolution: >
      Settled 2026-08-04 by the two papers the user designated (Pantina & Furst, PRL 94 138301 / Langmuir 24 1141). ★ All 4 options above were wrong — it is not a pair/bond potential but adhesive contact (JKR) + a tangential bending stiffness κ_θ = EI/ℓ = 1.391e6 kT. That a single bond sustains a torque is the papers' headline, and it is not reproduced by a central-force model. Verification: scratch/chain_bend_from_papers.py (the papers' κ₀ reproduced to +1.6%, the discrete↔continuum mapping to −0.08%).
    confirmed_by: paper

  - id: C2
    issue: "the amplitude a and the frequency ω (its range) are missing"
    detail: |
      Non-dimensionalized, two dimensionless numbers squeeze the amplitude from both sides:
        a/ℓ_k ≫ 1  (for the signal to come out above the thermal fluctuation).  ℓ_k = 20.35 nm
        a/d   ≪ 1  (to stay in linear response).                                d = 5 µm
      → a ≈ 100~500 nm is the window that satisfies both conditions together (SNR 5~25, a/d 0.02~0.10)
      ω has to cover the neighbourhood of De = ωτ_k = 1 (ω = 249 rad/s, f = 39.7 Hz)
      for the G'/G'' crossover to be visible → a sweep of 2.5 ~ 2500 rad/s is recommended
    resolution: >
      The ★proposal is settled (user-approved 2026-08-04, tier 3): a = 200 nm, ω = 85~7853 rad/s. The amplitude is the middle of the window squeezed from both sides — ℓ_k(20.4nm) ≪ a < δ_max(429nm, M<M_c). SNR = a/ℓ_k = 9.8, linear-response margin 2.1×. ω covers De = ωτ 0.1~10 (τ_k=1.18ms ≈ τ_chain=1.27ms are nearly equal, so one sweep covers both).
    confirmed_by: user     # the ★proposal was approved by the user (still tier 3)

  - id: C3
    issue: "which beads are trapped? How many?"
    note: "the X marks appear on the 1st, the 4th and the rightmost. Read as both ends fixed + the middle driven"
    lean: "fixed traps at both ends + a trap oscillating the middle bead (3 in total)"
    resolution: >
      The papers state it — [P2] Fig.1A: the 2 end particles are in fixed traps (force sensors), and a third trap moves the middle particle in the y direction. 3 in total. The lean was right.
    confirmed_by: paper

  - id: C4
    issue: "the number of beads N"
    note: "6 in the drawing + '…' + 1. The '…' is read as meaning 'there are more' → the count is undecided"
    resolution: >
      The ★proposal is settled (user-approved 2026-08-04, tier 3): n = 25 (the 25-particle chain of [P1] Fig.4). Taking n=11 gives δ_max = 74 nm, which closes the amplitude window down to just above ℓ_k — δ_max ∝ n², so at n=25 it opens to 429 nm. κ_end = 4.63 pN/µm is comparable to the trap's 10 pN/µm, so it also falls inside the measurement window.
    confirmed_by: user     # the ★proposal was approved by the user (still tier 3)

  - id: C5
    issue: "the folder is named 'chain-bend' but there is no bending stiffness in the sketch"
    note: "no angle potential stated. The mater_plan §20 table wrote this case up as
           'bond + bending stiffness + time-dependent driving', but the sketch has no bending"
    resolution: >
      The papers supply the bending stiffness — it is absent from the sketch, but what the folder name pointed at was right. The form, however, is not an angle potential κ_bend but an EI coming out of **the tangential stiffness of the contact**, which is then carried over to the discrete chain as angle.Harmonic (κ_θ = EI/ℓ). ★ Writing down at the transcription stage that 'the sketch has no bending' was correct — had it been written from the folder name, the form would have been wrong.
    confirmed_by: paper

