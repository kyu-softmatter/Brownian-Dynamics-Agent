# L0 Observation — 스케치에서 읽어낸 것. **초안: 사람 확인 대기**
# 프로토콜: 전사 먼저 → 구조화 → 모호/미판독 명시 → 없는 값은 null
# 무차원화 초안: scratch/intake_scales.py
# ★ 이 케이스는 핵심 물리(결합 퍼텐셜)가 스케치에서 빈칸이라 무차원화가 완결되지 않음

source_files:
  - intake/chain-bend-2d-oscill/sketch_01.jpeg

# ── ① 전사 ────────────────────────────────────────────────────────────
raw_transcription: |
  [상단 — 원(비드) 6개가 한 줄로 맞닿아 있고, 오른쪽에 "…" 후 원 1개 더]
    원 일부에 큰 X 표시:  1번째, 4번째(중앙 부근), 그리고 맨 오른쪽 원
    중앙 부근 원에서 위로 향하는 화살표 + "y = a sin(ωt)"  (밑줄 있음)
    그 오른쪽에 "oscillation in y-dir"

  [그 아래]
    trapped by optical tweezers

    U = ½ k_t (Δr)²                 k_t = 10 pN/µm

    R = 5 µm                        [박스 안] G' & G'' = ?
                                    [우측] G'&G'' 축 그래프 —
                                      세로축 G'&G'', 가로축 ω,
                                      두 곡선이 우상향하다 포화하는 모양

    particles are connected by   U_ij = ～～～～～      ← 물결선(빈칸)

    Eric furst. , 논문 참고 .
    [그 아래 줄로 지운 이름 — 판독 불가]

# ── ② 구조화 ──────────────────────────────────────────────────────────
system_guess: "광집게로 잡은 2D 콜로이드 비드 사슬을 y방향으로 진동시켜 복소탄성률 G'(ω), G''(ω)를 재는 능동 마이크로레올로지"

entities:
  - kind: particle
    note: "비드 사슬. 그림상 6개 + '…' + 1개 → 개수 미확정"
  - kind: external_potential
    form: "harmonic optical trap"
    expression: "U = 0.5*k_t*(Δr)^2"
    note: "★ X 표시가 1·4·끝 비드에 있음 → 세 비드가 트랩된 것으로 읽음 (C3)"
  - kind: driving
    form: "sinusoidal displacement of trap center, y-direction"
    expression: "y = a sin(ω t)"
    note: "화살표가 중앙 부근 비드를 가리킴 → 그 비드의 트랩 중심이 진동"
  - kind: bonded_interaction
    form: null                # ★ 스케치에서 빈칸 — ambiguities C1

stated_quantities:
  - symbol: k_t
    value: 10
    unit: pN/um
    source: "스케치 'k_t = 10 pN/µm'"
    confidence: 1
  - symbol: R
    value: 5
    unit: um
    source: "스케치 'R = 5 µm'"
    confidence: 1
    note: "1-A 관례로 지름으로 읽음"
  - symbol: a
    value: null               # ★ 기호만 있고 숫자 없음
    unit: null
    source: "스케치 'y = a sin(ωt)' — a에 값이 없음"
  - symbol: omega
    value: null               # ★ 스윕 범위 없음
    unit: null
    source: "스케치 'y = a sin(ωt)' + G'&G'' vs ω 그래프 — 범위 미기재"

stated_goals:
  - "G' & G'' 를 ω의 함수로 구한다 (박스로 강조 + 그래프 스케치)"

references:
  - kind: paper
    authors: ["Eric Furst"]
    note: "스케치에 '논문 참고'로 지정. DOI/제목 미기재. KB 시드 후보 (현재 문헌 0편)"
    resolved: false

# ── ③ 모호한 것 ───────────────────────────────────────────────────────
ambiguities:
  - id: C1
    issue: "★★ 결합 퍼텐셜 U_ij 가 빈칸이다 (물결선만 그려져 있음)"
    impact: |
      G'(ω)·G''(ω)는 사슬의 이완 스펙트럼에서 나온다. U_ij가 없으면
      스케일 원장에 시간척도(τ_bond)를 올릴 수 없고 무차원화가 완결되지 않는다.
      → 이 케이스의 핵심 물리가 미정. 다른 항목보다 우선.
    options:
      - "harmonic bond (k_b) — 가장 단순. τ_b = γ/k_b"
      - "FENE (유한 신장) — 큰 진폭에서 비선형"
      - "WCA + bond — 겹침 방지 포함"
      - "+ angle harmonic (굽힘 κ) — 폴더명 'chain-bend'가 암시하나 스케치엔 없음"
    resolution: >
      사용자 지정 논문 2편으로 확정 2026-08-04 (Pantina & Furst, PRL 94 138301 / Langmuir 24 1141). ★ 위 options 4개가 전부 틀렸다 — 페어/본드 퍼텐셜이 아니라 접착 접촉(JKR) + 접선 굽힘 강성 κ_θ = EI/ℓ = 1.391e6 kT 이다. 단일 결합이 토크를 지탱한다는 것이 논문의 헤드라인이고 중심력 모델로는 재현되지 않는다. 검증: scratch/chain_bend_from_papers.py (논문 κ₀ 재현 +1.6%, 이산↔연속 매핑 −0.08%).
    confirmed_by: paper

  - id: C2
    issue: "진폭 a 와 주파수 ω(범위)가 없다"
    detail: |
      무차원화하면 두 무차원수가 진폭을 양쪽에서 조인다:
        a/ℓ_k ≫ 1  (신호가 열요동 위로 나오려면).  ℓ_k = 20.35 nm
        a/d   ≪ 1  (선형응답 유지).                d = 5 µm
      → a ≈ 100~500 nm 이 두 조건을 함께 만족하는 창 (SNR 5~25, a/d 0.02~0.10)
      ω는 De = ωτ_k = 1 인 곳(ω = 249 rad/s, f = 39.7 Hz) 근방을 덮어야
      G'/G'' 교차가 보인다 → 스윕 2.5 ~ 2500 rad/s 권장
    resolution: >
      ★제안 확정 (사용자 승인 2026-08-04, tier 3): a = 200 nm, ω = 85~7853 rad/s. 진폭은 두 조건이 양쪽에서 조인 창의 중간 — ℓ_k(20.4nm) ≪ a < δ_max(429nm, M<M_c). SNR = a/ℓ_k = 9.8, 선형 여유 2.1×. ω 는 De = ωτ 0.1~10 을 덮는다 (τ_k=1.18ms ≈ τ_chain=1.27ms 로 거의 같아 하나의 스윕으로 둘 다 덮인다).
    confirmed_by: user     # ★제안을 사용자가 승인 (tier 3 유지)

  - id: C3
    issue: "어느 비드가 트랩되는가? 몇 개인가?"
    note: "X가 1번째·4번째·맨 오른쪽에 보임. 양끝 고정 + 중앙 구동으로 읽음"
    lean: "양끝 고정 트랩 + 중앙 비드를 진동시키는 트랩 (3개)"
    resolution: >
      논문이 명시한다 — [P2] Fig.1A: 양끝 입자 2개는 고정 트랩(힘 센서), 세 번째 트랩이 중앙 입자를 y 방향으로 이동. 총 3개. lean 이 맞았다.
    confirmed_by: paper

  - id: C4
    issue: "비드 개수 N"
    note: "그림 6개 + '…' + 1개. '…'는 '더 많다'는 뜻으로 읽음 → 개수 미정"
    resolution: >
      ★제안 확정 (사용자 승인 2026-08-04, tier 3): n = 25 ([P1] Fig.4 의 25입자 사슬). n=11 로 잡으면 δ_max = 74 nm 로 진폭 창이 ℓ_k 바로 위까지 닫힌다 — δ_max ∝ n² 이라 n=25 에서 429 nm 로 열린다. κ_end = 4.63 pN/µm 이 트랩 10 pN/µm 과 비슷해 측정 창에도 들어간다.
    confirmed_by: user     # ★제안을 사용자가 승인 (tier 3 유지)

  - id: C5
    issue: "폴더명이 'chain-bend'인데 굽힘 강성이 스케치에 없다"
    note: "각도 퍼텐셜 미기재. mater_plan §20 표는 이 케이스를
           '본드 + 굽힘 강성 + 시간의존 구동'으로 적었으나 스케치에는 굽힘이 없음"
    resolution: >
      논문이 굽힘 강성을 제공한다 — 스케치에는 없지만 폴더명이 가리킨 것이 맞았다. 다만 형태가 각도 퍼텐셜 κ_bend 가 아니라 **접촉의 접선 강성**에서 나온 EI 이고, 그것을 이산 사슬의 angle.Harmonic 으로 옮긴다 (κ_θ = EI/ℓ). ★ 전사 단계에서 '스케치에 굽힘이 없다'고 적어둔 것이 옳았다 — 폴더명을 근거로 적었다면 형태를 틀렸을 것이다.
    confirmed_by: paper

unread_regions:
  - "'Eric furst, 논문 참고' 아래 줄로 지운 이름 1개 (판독 불가)"
  - "U_ij 오른쪽 물결선 — 글자가 아니라 '나중에 채울 빈칸' 표시로 읽음"

