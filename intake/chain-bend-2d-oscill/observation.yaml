# ── ⑤ 무차원화에서 나온 사전 경고 ──────────────────────────────────────
prerun_findings:
  - id: F1
    severity: "★★ 모델 적합성 — 목표 해석에 영향"
    finding: |
      BD + 뉴턴 용매(물)에서는 용매 자체의 G' = 0, G'' = ηω 다 (탄성이 없음).
      따라서 이 시뮬레이션에서 나오는 G'·G''는 '매질'의 점탄성이 아니라
      **사슬(결합)의 탄성 + 용매의 점성 소산**이다.
    consequence: |
      "매질의 G', G''를 재고 싶다"는 의도라면 BD로는 불가능하고
      medium.* (점탄성 매질) 모듈이 필요하다.
      — 1-A observation.yaml 의 followup('비뉴턴 매질도 하고 싶다')과 같은 항목.
      "사슬의 G', G''"라면 그대로 진행 가능.
    verified: false           # BD 모델의 성질(구성식)에서 나온 결론. 실행 미확인
  - id: F2
    severity: "정보"
    finding: "τ_k = γ/k_t = 4.010 ms (d=5µm, 물@300K) — 1-A와 정확히 같은 값"
    consequence: "dt ≤ 10⁻²τ_k = 40.1 µs. 최저 ω에서 100주기 관측해도 6.3e5 steps — 저렴"
