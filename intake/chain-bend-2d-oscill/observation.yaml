# ── ⑤ advance warnings that came out of the non-dimensionalization ────
prerun_findings:
  - id: F1
    severity: "★★ model suitability — affects the reading of the goal"
    finding: |
      In BD with a Newtonian solvent (water), the solvent itself has G' = 0, G'' = ηω (no elasticity).
      So the G' and G'' this simulation produces are not the viscoelasticity of the 'medium'
      but **the elasticity of the chain (the bonds) + the viscous dissipation of the solvent**.
    consequence: |
      If the intent is "I want to measure the medium's G', G''", that is impossible with BD and
      needs a medium.* (viscoelastic medium) module.
      — the same item as the followup in 1-A's observation.yaml ('I also want to do non-Newtonian media').
      If it is "the chain's G', G''", it can proceed as it stands.
    verified: false           # a conclusion from a property of the BD model (its constitutive equation). Not confirmed by running
  - id: F2
    severity: "informational"
    finding: "τ_k = γ/k_t = 4.010 ms (d=5µm, water@300K) — exactly the same value as 1-A"
    consequence: "dt ≤ 10⁻²τ_k = 40.1 µs. Even observing 100 periods at the lowest ω is 6.3e5 steps — cheap"
