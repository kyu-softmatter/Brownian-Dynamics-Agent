# L2 PhysicalSystem — the dimensional physical system (SI). Rule 3.
# Literature: [P1] Pantina & Furst, PRL 94, 138301 (2005)
#             [P2] Pantina & Furst, Langmuir 24, 1141-1146 (2008)
# Derivation check: scratch/chain_bend_from_papers.py (reproduces the papers' κ₀=80mN/m to +1.6%,
#            confirms the κ_θ=EI/ℓ mapping against discrete-chain bending to −0.08%)
# tier 0=sketch · 1=user-fixed/derived · 2=extracted from the literature (unverified) · 3=★my proposal

label: chain-bend-2d-oscill
derived_from: observation.yaml
description: >
  Measure the complex modulus G'(ω), G''(ω) by oscillating a chain of colloidal beads in a
  3-point optical-tweezer bending geometry. The end beads are in fixed traps (force sensors)
  and the middle bead is oscillated in the y direction. Newtonian fluid (water).
dimensions: 2

particle:
  shape: sphere
  diameter:
    value: 1.47
    unit: um
    source: "[P1] p.1 '2a = 1.47 ± 0.01 µm' PMMA (Bangs Labs). ★ The sketch says R=5µm, a
             3.4× difference — the papers' values (κ₀, M_c) are all referenced to this size, so the papers were followed"
    tier: 2
  density:
    value: 1180
    unit: kg/m^3
    source: "★proposal: the density of PMMA. Used only for τ_p (model validity)"
    tier: 3
  count:
    value: 25
    unit: dimensionless
    source: "★proposal: the 25-particle chain of [P1] Fig.4. Taking n=11 closes the amplitude window
             (δ_max=74nm ≈ 3× ℓ_k) — δ_max ∝ n², so at n=25 it opens to 429nm"
    tier: 3
  youngs_modulus: {value: 3100, unit: MPa, source: "[P1] p.3, ref 15 (PMMA)", tier: 2}
  poisson_ratio: {value: 0.4, unit: dimensionless, source: "[P1] p.3", tier: 2}

medium:
  kind: newtonian
  name: water
  temperature: {value: 300, unit: K, source: "the papers use an aqueous solution. The temperature is inherited from 1-A", tier: 1}
  viscosity: {value: 0.851, unit: mPa*s, source: "handbook, water@300K", tier: 1}

geometry:
  kind: chain_1d_in_2d
  n_beads: 25
  contour_length: {value: 35.28, unit: um, source: "derived: (n-1)d", tier: 1}
  periodic: false
  note: "a single chain. No periodic boundary (the traps fix the position)"

# ── ★ interactions: not a pair potential (the papers' headline finding) ──
interactions:
  - kind: contact.adhesive_bending
    form: "radial: adhesive contact (JKR, effectively inextensible) · tangential: a bond-angle stiffness κ_θ"
    rationale: >
      [P1][P2]: a single colloidal bond **sustains a torque**. A central pair potential (DLVO
      included) cannot produce this tangential interaction, and the papers point that out explicitly.
      The blank U_ij in the sketch is not a pair potential but this contact model.
    kappa_0:
      value: 64
      unit: mN/m
      source: "[P1] p.3 'experimental value at 10 mM MgCl₂ is 64 ± 0.5 mN/m'"
      tier: 2
      note: "0.1~0.6 N/m depending on the salt concentration ([P1] Fig.3b), reduced by an order of magnitude with a surfactant ([P2] Fig.4)"
    contact_radius:
      value: 43.2
      unit: nm
      source: "derived: inverting κ₀=3πa_c⁴E/(4a³). [P1] gives 'a_c ≈ 40 nm' (rounded)"
      tier: 2
    flexural_rigidity:
      value: 8.4707e-21
      unit: N*m^2
      source: "derived: EI = κ₀ a³/3"
      tier: 2
    angle_stiffness:
      value: 5.7624e-15
      unit: J
      source: "derived: κ_θ = EI/ℓ (ℓ=d). The discrete↔continuum mapping verified against chain bending —
               −0.35% for this system (n=25). (The −0.08% is the n=51 row of the same convergence table)"
      tier: 1
      note: "= 1.391e6 kT — the chain is thermally completely stiff"
    bond_stiffness:
      value: 1917
      unit: pN/um
      source: "★proposal: keep the thermal stretching below 0.1% of the diameter (√(kT/k_b) ≤ 1e-3 d)"
      tier: 3
    critical_moment:
      value: 35
      unit: pN*um
      source: "[P1] p.2 'M_c plateaus to approximately 35 pN µm' (>10 mM MgCl₂)"
      tier: 2
      note: "★ above this the bond slips or rolls and the harmonic angle potential becomes invalid"

external:
  kind: harmonic_trap_oscillating
  form: "fixed traps at both ends (force sensors) + the middle trap oscillated as y = a sin(ωt)"
  n_trapped: {value: 3, unit: dimensionless, source: "sketch — 3 X marks (1st, middle, last)", tier: 0}
  stiffness:
    value: 10
    unit: pN/um
    source: "sketch, 'k_t = 10 pN/µm'. The papers use ~40 pN/µm ([P1] p.1)"
    tier: 0
  amplitude:
    value: 200
    unit: nm
    source: "★proposal: the window ℓ_k(20nm) ≪ a < δ_max(429nm). SNR=9.8, linear-response margin 2.1×"
    tier: 3
  omega_range:
    value: [85, 7853]
    unit: rad/s
    source: "★proposal: covers De = ωτ 0.1~10 (τ_k=1.18ms and τ_chain=1.27ms are nearly equal)"
    tier: 3

targets:
  - name: storage_modulus       # G'(ω)
  - name: loss_modulus          # G''(ω)

derived_scales:
  source: "scratch/propose_3cases.py §C + chain_bend_from_papers.py"
  gamma: {value: 1.1790e-8, unit: kg/s, expr: "3 pi eta d"}
  D_t: {value: 0.35133, unit: um^2/s, expr: "kT/gamma"}
  tau_B: {value: 6.1508, unit: s, expr: "d^2/D_t"}
  tau_p: {value: 1.6647e-7, unit: s, expr: "m/gamma"}
  kT: {value: 4.1419e-21, unit: J}
  tau_k: {value: 1.1790e-3, unit: s, expr: "gamma/k_t", role: "trap relaxation"}
  tau_chain: {value: 1.2733e-3, unit: s, expr: "gamma/kappa_center", role: "collective chain bending — nearly equal to τ_k"}
  tau_fast: {value: 2.787e-7, unit: s, expr: "gamma/lambda_max(the bending stiffness matrix)", role: "★ the fastest mode → it sets dt"}
  kappa_end: {value: 4.63, unit: pN/um, expr: "24 EI/L^3", role: "the papers' definition of κ (referenced to the end force)"}
  kappa_center: {value: 9.26, unit: pN/um, expr: "48 EI/L^3", role: "the value the driving trap feels"}
  l_k: {value: 20.35, unit: nm, expr: "sqrt(kT/k_t)"}
  delta_max: {value: 429, unit: nm, expr: "M_c L^2/(12 EI)", role: "the linear-elastic limit amplitude"}

dimensionless:
  reference: {length: d, time: tau_B, energy: kT, strategy: thermal}
  groups:
    - {name: "kappa_theta/kT", value: 1.391e6, meaning: "★ the chain is thermally stiff (fluctuations cannot bend it)"}
    - {name: "a/l_k", value: 9.83, meaning: "amplitude vs thermal fluctuation = SNR"}
    - {name: "a/delta_max", value: 0.467, meaning: "★ linear-elastic margin 2.1× (M<M_c)"}
    - {name: "kappa_end/k_t", value: 0.463, meaning: "chain vs trap stiffness — comparable (the measurement window)"}
    - {name: "De_range", value: 10.0, expr: "omega tau_k", meaning: "a 0.1~10 sweep"}
    - {name: "tau_fast/tau_chain", value: 2.19e-4, meaning: "★ the fastest mode is 4570× faster than the mode of interest"}
    - {name: "St", value: 3.15e-8, expr: "tau_p/tau_B"}

numerics:
  dt:
    value: 2.787
    unit: ns
    source: "10⁻² × τ_fast (from the largest eigenvalue of the bending stiffness matrix). dt is set
             not by the collective mode but by the fastest mode, which is irrelevant to the measurement"
    tier: 1
  production_s: 7.41
  production_note: "100 periods at the lowest ω (85 rad/s). ★ 2.7e9 steps — expensive"
  stat_target_pct: 5.0
  equilibration: "chain relaxation before driving (tens of times τ_chain)"

not_verified:
  - "★ cost: 2.7e9 steps. With κ_θ=1.4e6 kT the chain is stiff, so the fastest bending mode — which is
     irrelevant to the measurement — sets dt. The options are — (a) accept it (b) lower κ₀ (a surfactant,
     [P2] Fig.4) and sweep (c) measure only the high ω and replace the low ω with the quasi-static limit"
  - "d = 1.47 µm (the papers) vs the sketch's R = 5 µm — a 3.4× discrepancy. The paper value was chosen, but it needs human confirmation"
  - "Plasticity above M_c (slipping/rolling) cannot be expressed by a harmonic angle potential → it has to be
     restricted to M<M_c, and that condition is what creates the amplitude ceiling δ_max"
  - "The papers do quasi-static bending at a constant 20~30 nm/s. Oscillatory driving (G', G'') is not in the papers —
     the elastic constants are carried over, but the dynamics is new territory"
  - "In BD with a Newtonian solvent, the solvent's G'=0. The G' that comes out here is **the chain's elasticity**,
     not the viscoelasticity of the medium"
