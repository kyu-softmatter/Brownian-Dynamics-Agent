# L2 PhysicalSystem — chain-bend-2d-oscill 의 대안가설 브랜치 (DLVO 중심력 결합).
# 문헌: [P1] Pantina & Furst, PRL 94, 138301 (2005)
#       [P2] Pantina & Furst, Langmuir 24, 1141-1146 (2008)
# 이 케이스는 [P1][P2]의 모델(JKR 접착접촉+굽힘강성)을 쓰지 않는다 — 오히려
# [P1] p.2 가 명시적으로 예측한 "DLVO(중심력)라면 삼각형형 좌굴"을 검증 대상으로 삼는다.
# tier 0=스케치 · 1=사용자 확정/유도 · 2=문헌 추출 · 3=★내 제안(불확실성 명시)

label: chain-bend-2d-dlvo
derived_from: intake/chain-bend-2d-dlvo/observation.yaml
description: >
  chain-bend-2d-oscill 과 같은 3점 굽힘·오실레이션 기하. 콜로이드 비드를 JKR 접착접촉
  대신 DLVO(이중층반발+vdW인력) 2차극소로 연결한다 — 각도(굽힘) 퍼텐셜 없음(의도적,
  이게 가설이다). [P1] p.2: "DLVO interactions... centro-symmetric... trianglelike
  structure" 예측을 실행으로 확인한다.
dimensions: 2

particle:
  shape: sphere
  diameter: {value: 1.47, unit: um, source: "[P1] p.1 '2a = 1.47 ± 0.01 µm' PMMA", tier: 2}
  density: {value: 1180, unit: kg/m^3, source: "★제안: PMMA. τ_p(St)에만 쓰임", tier: 3}
  surface_potential:
    value: 40
    unit: mV
    source: "[P1] p.1 우단 'a measured surface potential of 40 ± 3 mV'"
    tier: 2
  count:
    value: [5, 9, 15, 25]
    unit: dimensionless
    source: "★제안: 사슬길이 스윕 (사용자 요청 '체인길이... 확인해보고 싶어'). n=25는
             [P1] Fig.4 승계, 나머지는 길이 의존성 스캔용"
    tier: 3

medium:
  kind: newtonian
  name: water
  temperature: {value: 300, unit: K, source: "1-A 승계, 논문은 수용액", tier: 1}
  viscosity: {value: 0.851, unit: mPa*s, source: "물@300K 핸드북", tier: 1}
  relative_permittivity: {value: 78.5, unit: dimensionless, source: "물@298K 핸드북 (CRC)", tier: 1}
  ionic_strength:
    value: 10
    unit: mM
    source: >
      [P1] 이 스윕한 MgCl2 농도 중 하나 (본문 '~10 mM MgCl2'). [P2]의 고정값 250mM
      ('bare')도 검토했으나, 계산해보니 250mM(λ_D=0.35nm)은 이중층 반발이 사실상
      완전히 죽어 vdW가 접촉에서 장벽 없이 발산한다 — 우물강성이 DLVO가 아니라
      임의 정규화로 정해져 이 케이스의 목적(비-임의 결합강성)에 안 맞는다.
      10mM은 장벽 382kT + 2차극소 −11.7kT@11.2nm 로 교과서적 곡선을 준다.
    tier: 2
    note: "MgCl2 (2:1 전해질). I = ½Σcᵢzᵢ² = 0.75×c_salt"

# ── ★ 상호작용: 중심 페어 퍼텐셜만. 각도항 없음 (의도적, 이게 가설) ──────────
interactions:
  - kind: pair.dlvo_secondary_minimum
    form: "U(h) = U_edl(h) + U_vdw(h), h=표면간극. HHF(등전위,약한중첩)+Derjaguin 비지연 vdW"
    rationale: >
      [P1] p.2 좌단: "Such assumptions have been made based on DLVO interactions
      between particles, which are centro-symmetric. If particles did undergo
      free rotations, we would expect the aggregates to respond to the bending
      moment by forming a trianglelike structure..." — 이 케이스는 정확히 이
      가정(중심력 DLVO)만으로 사슬을 만들어 실측(빔형 매끈한 곡률)과 대조한다.
      NN(최근접) 쌍에만 건다 — 이게 "결합"이다. NNN 이상은 배제부피만(자기접촉 방지).
    hamaker_constant:
      value: 1.05e-20
      unit: J
      source: >
        웹검색(Google) 값(PMMA-물-PMMA, 1차 출처 논문 미확인 — ResearchGate HTTP 403).
        ★ 사용자 질문(2026-08-05, '인력이 너무 작은 것 같다')에 답하려 독립 교차검증함:
        Tabor-Winterton 근사 A=(3/4)kT[(ε1-ε3)/(ε1+ε3)]² + 3hν_e/(16√2)·(n1²-n3²)²/(n1²+n3²)^1.5
        를 핸드북값(ε_PMMA=3.0, ε_water=78.5, n_PMMA=1.49, n_water=1.33, ν_e=3e15 Hz —
        Israelachvili 표준 어림)로 직접 계산 → A_calc=9.40e-21 J (웹값과 −10.5%, 같은
        자릿수). PMMA 유전율·굴절률 문헌범위(ε=2.6~3.6, n=1.483~1.50)로도 8.90~10.16e-21
        범위라 안정적. 폴리스티렌-물 문헌값(5e-21~1.5e-20 J)과도 같은 자릿수.
        ★ 민감도(scratch/hamaker_crosscheck.py): A를 5e-21→2e-20(4배)로 바꿔도 우물깊이는
        −4.9→−25.5 kT 로, JKR모델의 굽힘강성(~1.4e6 kT/d²) 근처에는 어떤 경우에도
        못 미친다 — "인력이 약하다"는 결론은 A값 불확실성에 안정적이다.
      tier: 2
      note: "독립 계산(핸드북 유전율·굴절률)이 웹값을 10% 이내로 재현 — tier 3→2"
    debye_length:
      value: 1.7618
      unit: nm
      source: "derived: κ⁻¹=√(ε0·εr·kT/(2·NA·e²·I)), I=0.5×(c_Mg·4+c_Cl·1), MgCl2 10mM"
      tier: 1
    barrier_height:
      value: 381.70
      unit: dimensionless
      source: "derived (scratch/dlvo_ledger.py): U_tot(h)/kT 최댓값 @ h=0.489nm"
      tier: 1
      note: "단위=kT. 1차극소로의 열적 전이가 사실상 불가능함을 보장 (382 kT ≫ 1)"
    well_depth:
      value: -11.716
      unit: dimensionless
      source: "derived: U_tot(h)/kT 2차극소 @ h=11.158nm"
      tier: 1
      note: "단위=kT. 열에너지 규모 → 결합이 가역적/깨지기 쉬울 수 있음(의도된 관측 대상)"
    well_location:
      value: 11.158
      unit: nm
      source: "derived: argmin U_tot(h) (장벽 이후)"
      tier: 1
    bond_stiffness:
      value: 2.0017e-3
      unit: N/m
      source: "derived: d²U_tot/dh² @ h=well_location (중심차분)"
      tier: 1
      note: "= 1.044e6 kT/d². 결합의 방사(신축) 강성 — 굽힘강성 아님(없음, 의도적)"

  # ── ★ 대조군 전용 (기본 OFF). --jkr 플래그로 켤 때만 쓰인다 ──────────────
  # DLVO-only 가 굽힘강성 0 을 내는 것을 확인했으므로(G1 실측), 같은 기하·같은 스윕에서
  # **굽힘항만 추가**해 직접 대조한다 (원칙 7: 독립 요소를 하나씩 떼어 검증).
  # 값은 chain-bend-2d-oscill/system.yaml 에서 그대로 승계 — 유도·검증은 그쪽에 있다
  # (scratch/chain_bend_from_papers.py: 논문 κ₀ 재현 +1.6%, 이산↔연속 매핑 n=25에서 −0.35%).
  - kind: contact.adhesive_bending
    enabled_by: "--jkr 플래그 (기본 OFF)"
    form: "접선 굽힘 강성 κ_θ = EI/ℓ. [P1][P2]의 JKR 접착접촉에서 유도"
    rationale: >
      [P1] p.2 는 DLVO(중심대칭)로는 토크를 못 지탱한다고 주장하고, 대신 JKR 접착접촉이
      유한 접촉면(a_c≈40nm)을 만들어 굽힘모멘트를 버틴다고 본다. 이 항목은 그 굽힘강성을
      DLVO 결합 위에 얹어 "굽힘항만 추가하면 정말 빔거동이 나오는가"를 대조하는 대조군.
    kappa_0:
      value: 64
      unit: mN/m
      source: "[P1] p.3 'experimental value at 10 mM MgCl₂ is 64 ± 0.5 mN/m'
               — 이 케이스도 10mM 이라 염 조건이 일치한다"
      tier: 2
    angle_stiffness:
      value: 5.7624e-15
      unit: J
      source: "derived: κ_θ = EI/ℓ, EI = κ₀a³/3, ℓ=d. chain-bend-2d-oscill 에서 승계
               (검증: scratch/chain_bend_from_papers.py §②)"
      tier: 1
      note: "= 1.391e6 kT — DLVO 2차극소 깊이(11.7 kT)의 12만 배. 이 대비가 이 비교의 핵심"

external:
  kind: harmonic_trap_oscillating
  form: "chain-bend-2d-oscill 과 동일 기하 — 양끝 고정 트랩(힘 센서) + 중앙 트랩을
         y = a sin(ωt) 로 진동"
  n_trapped: {value: 3, unit: dimensionless, source: "[P2] Fig.1A 승계", tier: 1}
  stiffness:
    value: 10
    unit: pN/um
    source: "sketch 'k_t = 10 pN/µm' 승계"
    tier: 0
  amplitude:
    value: [20, 20000]
    unit: nm
    source: >
      ★제안 스윕 (사용자 요청 '진폭에 따라... 확인'). 하한 20nm ≈ 결합 열요동
      σ_bond=1.44nm 의 14배(신호가 결합 잡음 위로). 상한 20000nm=20µm 는 결합
      해리 시작(h_min+σ_bond×수배)을 넘어 사슬이 끊어지는지까지 보는 범위 —
      의도적으로 "깨짐"까지 스캔한다.
    tier: 3
  omega_range:
    value: [1, 100000]
    unit: rad/s
    source: >
      ★제안 (사용자 요청 '스윕속도에 따라'). τ_bond=5.9µs(결합 신축, 매우 빠름)와
      사슬 전체가 느낄 저주파(엔트로피/장력 지배 예상) 영역을 함께 덮도록 5자릿수
      스윕. 정확한 지배 시간척도는 이 계에 굽힘강성이 없어 build_ledger 에서
      추가로 유도 필요(L3 단계, 사람과 확인).
    tier: 3

targets:
  - name: storage_modulus       # G'(ω)
  - name: loss_modulus          # G''(ω)
  - name: buckling_shape        # ★ 신규 — 매끈한 곡률 vs 삼각형형 국소꺾임 (G1)

derived_scales:
  source: "scratch/dlvo_ledger.py"
  lambda_D: {value: 1.7618, unit: nm, expr: "1/kappa"}
  gamma: {value: 1.1790e-8, unit: kg/s, expr: "3 pi eta d"}
  tau_B: {value: 6.1510, unit: s, expr: "d^2/D_t"}
  tau_p: {value: 1.6646e-7, unit: s, expr: "m/gamma"}
  tau_bond: {value: 5.9e-6, unit: s, expr: "gamma/k_bond", role: "★ 결합 신축 이완 — 후보 최속 모드"}
  sigma_bond: {value: 1.438, unit: nm, expr: "sqrt(kT/k_bond)", role: "결합 열요동 폭"}
  ell: {value: 1481.2, unit: nm, expr: "d + h_min", role: "결합길이(중심간 평형거리)"}

dimensionless:
  reference: {length: d, time: tau_B, energy: kT, strategy: thermal}
  groups:
    - {name: "well_depth/kT", value: -11.716, meaning: "★ 결합이 열에너지 규모 — 가역적일 수 있음"}
    - {name: "barrier/kT", value: 381.70, meaning: "1차극소 전이는 사실상 불가능"}
    - {name: "sigma_bond/well_location", value: 0.129, meaning: "결합 열요동 폭 / 우물 위치"}
    - {name: "bond_stiffness_star", value: 1.044e6, meaning: "k_bond d²/kT — 신축 강성(굽힘 아님)"}

numerics:
  dt:
    value: null
    unit: null
    source: "L3(cases/chain_bend_dlvo_2d.py build_ledger)에서 강성행렬 최대고유값(결합
             신축, τ_bond 후보)으로 유도 — 이 계엔 굽힘강성이 없어 chain-bend-2d-oscill
             과 지배모드 자체가 다를 수 있음"
    tier: 3
  production_note: "L3에서 관측창(N_CYCLES × 최저 ω 주기)으로 유도"
  stat_target_pct: 5.0
  equilibration: "구동 전 사슬 완화 — 척도는 L3에서 지배 시간척도 확정 후 결정"

not_verified:
  - "★★ 핵심 미검증: 순수 중심력 사슬의 횡방향(굽힘) 선형강성이 0이라는 구조적 예측
     (G1) — 실행해서 확인해야 한다. 확인되면 이 계는 '빔'이 아니라 힌지사슬처럼
     거동할 것이고 G'(ω)는 사슬탄성이 아니라 장력/엔트로피 지배일 가능성"
  - "Hamaker 상수(1.05e-20 J)의 1차 출처 미확인 — tier 3, 배수 정도 불확실성 가능
     (D1). 결론이 A 값에 민감하면(예: 우물 깊이가 kT 근방을 오르내리면) 사람 재확인 필요"
  - "amplitude/omega 스윕 범위는 전부 ★제안 — L3 무차원화에서 실제 지배 시간척도를
     구한 뒤 좁혀야 할 수 있음"
  - "이 계가 [P1][P2]와 다른 결론을 내도 실패가 아니다 (원칙 7) — 오히려 그게
     '중심력만으로는 빔거동이 안 나온다'는 논문 자체 주장의 시뮬레이션 증거가 된다"
