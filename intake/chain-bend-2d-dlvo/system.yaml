# L2 PhysicalSystem — the alternative-hypothesis branch of chain-bend-2d-oscill (DLVO central-force bonds).
# Literature: [P1] Pantina & Furst, PRL 94, 138301 (2005)
#             [P2] Pantina & Furst, Langmuir 24, 1141-1146 (2008)
# This case does not use [P1][P2]'s model (JKR adhesive contact + a bending stiffness) — it instead
# takes what [P1] p.2 predicts explicitly, "triangle-like buckling if it were DLVO (central force)", as the thing to test.
# tier 0=sketch · 1=user-fixed/derived · 2=extracted from the literature · 3=★my proposal (uncertainty stated)

label: chain-bend-2d-dlvo
derived_from: intake/chain-bend-2d-dlvo/observation.yaml
description: >
  The same 3-point-bending, oscillatory geometry as chain-bend-2d-oscill. The colloidal beads are
  connected by the DLVO (double-layer repulsion + vdW attraction) secondary minimum instead of JKR
  adhesive contact — with no angle (bending) potential (deliberately; that is the hypothesis).
  [P1] p.2: confirm by running the prediction "DLVO interactions... centro-symmetric... trianglelike
  structure".
dimensions: 2

particle:
  shape: sphere
  diameter: {value: 1.47, unit: um, source: "[P1] p.1 '2a = 1.47 ± 0.01 µm' PMMA", tier: 2}
  density: {value: 1180, unit: kg/m^3, source: "★proposal: PMMA. Used only for τ_p (St)", tier: 3}
  surface_potential:
    value: 40
    unit: mV
    source: "[P1] p.1, right column, 'a measured surface potential of 40 ± 3 mV'"
    tier: 2
  count:
    value: [5, 9, 15, 25]
    unit: dimensionless
    source: "★proposal: a chain-length sweep (user request, 'I want to check... the chain length'). n=25 is
             inherited from [P1] Fig.4, the rest are for scanning the length dependence"
    tier: 3

medium:
  kind: newtonian
  name: water
  temperature: {value: 300, unit: K, source: "inherited from 1-A; the papers use an aqueous solution", tier: 1}
  viscosity: {value: 0.851, unit: mPa*s, source: "handbook, water@300K", tier: 1}
  relative_permittivity: {value: 78.5, unit: dimensionless, source: "handbook, water@298K (CRC)", tier: 1}
  ionic_strength:
    value: 10
    unit: mM
    source: >
      One of the MgCl2 concentrations [P1] swept (the text says '~10 mM MgCl2'). [P2]'s fixed value of
      250mM ('bare') was considered too, but on computing it, at 250mM (λ_D=0.35nm) the double-layer
      repulsion is effectively dead entirely and the vdW diverges at contact with no barrier — the well
      stiffness would then be set by an arbitrary regularization rather than by DLVO, which does not
      suit this case's purpose (a non-arbitrary bond stiffness).
      10mM gives a textbook curve: a barrier of 382kT + a secondary minimum of −11.7kT@11.2nm.
    tier: 2
    note: "MgCl2 (a 2:1 electrolyte). I = ½Σcᵢzᵢ² = 0.75×c_salt"

# ── ★ interactions: a central pair potential only. No angle term (deliberately; that is the hypothesis) ──
interactions:
  - kind: pair.dlvo_secondary_minimum
    form: "U(h) = U_edl(h) + U_vdw(h), h=surface gap. HHF (constant potential, weak overlap) + Derjaguin non-retarded vdW"
    rationale: >
      [P1] p.2, left column: "Such assumptions have been made based on DLVO interactions
      between particles, which are centro-symmetric. If particles did undergo
      free rotations, we would expect the aggregates to respond to the bending
      moment by forming a trianglelike structure..." — this case builds the chain out of exactly that
      assumption (central-force DLVO) alone and contrasts it with what was measured (a smooth beam-like curvature).
      It acts only on NN (nearest-neighbour) pairs — that is what a "bond" is here. NNN and beyond get
      excluded volume only (to prevent self-contact).
    hamaker_constant:
      value: 1.05e-20
      unit: J
      source: >
        A web-search (Google) value (PMMA-water-PMMA, the primary-source paper unconfirmed — ResearchGate HTTP 403).
        ★ Independently cross-checked in order to answer the user's question (2026-08-05, 'the attraction looks too small'):
        the Tabor-Winterton approximation A=(3/4)kT[(ε1-ε3)/(ε1+ε3)]² + 3hν_e/(16√2)·(n1²-n3²)²/(n1²+n3²)^1.5
        computed directly with handbook values (ε_PMMA=3.0, ε_water=78.5, n_PMMA=1.49, n_water=1.33, ν_e=3e15 Hz —
        the standard Israelachvili estimate) → A_calc=9.40e-21 J (−10.5% against the web value, the same
        order). Across the literature ranges for PMMA's permittivity and refractive index (ε=2.6~3.6, n=1.483~1.50)
        it stays in the 8.90~10.16e-21 range, so it is stable. It is also the same order as the
        polystyrene-water literature values (5e-21~1.5e-20 J).
        ★ Sensitivity (scratch/hamaker_crosscheck.py): changing A from 5e-21 to 2e-20 (4×) moves the well depth
        from −4.9 to −25.5 kT, which in no case comes near the JKR model's bending stiffness (~1.4e6 kT/d²) —
        the conclusion "the attraction is weak" is stable against the uncertainty in A.
      tier: 2
      note: "an independent calculation (handbook permittivity and refractive index) reproduces the web value to within 10% — tier 3→2"
    debye_length:
      value: 1.7618
      unit: nm
      source: "derived: κ⁻¹=√(ε0·εr·kT/(2·NA·e²·I)), I=0.5×(c_Mg·4+c_Cl·1), MgCl2 10mM"
      tier: 1
    barrier_height:
      value: 381.70
      unit: dimensionless
      source: "derived (scratch/dlvo_ledger.py): the maximum of U_tot(h)/kT @ h=0.489nm"
      tier: 1
      note: "unit=kT. Guarantees that a thermal transition into the primary minimum is effectively impossible (382 kT ≫ 1)"
    well_depth:
      value: -11.716
      unit: dimensionless
      source: "derived: the secondary minimum of U_tot(h)/kT @ h=11.158nm"
      tier: 1
      note: "unit=kT. On the scale of the thermal energy → the bond may be reversible/breakable (a deliberate observation target)"
    well_location:
      value: 11.158
      unit: nm
      source: "derived: argmin U_tot(h) (past the barrier)"
      tier: 1
    bond_stiffness:
      value: 2.0017e-3
      unit: N/m
      source: "derived: d²U_tot/dh² @ h=well_location (a central difference)"
      tier: 1
      note: "= 1.044e6 kT/d². The bond's radial (stretching) stiffness — not a bending stiffness (there is none, deliberately)"

  # ── ★ control group only (OFF by default). Used only when turned on with the --jkr flag ──
  # Since DLVO-only was confirmed to give a bending stiffness of 0 (G1, measured), **the bending term alone
  # is added** in the same geometry and the same sweep for a direct contrast (rule 7: isolate independent
  # elements and verify them one at a time).
  # The values are inherited verbatim from chain-bend-2d-oscill/system.yaml — the derivation and the
  # verification are on that side (scratch/chain_bend_from_papers.py: the papers' κ₀ reproduced to +1.6%,
  # the discrete↔continuum mapping to −0.35% at n=25).
  - kind: contact.adhesive_bending
    enabled_by: "the --jkr flag (OFF by default)"
    form: "the tangential bending stiffness κ_θ = EI/ℓ. Derived from [P1][P2]'s JKR adhesive contact"
    rationale: >
      [P1] p.2 argues that DLVO (centro-symmetric) cannot sustain a torque, and holds instead that JKR
      adhesive contact creates a finite contact area (a_c≈40nm) that withstands the bending moment. This
      entry is the control group that puts that bending stiffness on top of the DLVO bond to contrast
      "does beam behaviour really appear once the bending term alone is added".
    kappa_0:
      value: 64
      unit: mN/m
      source: "[P1] p.3 'experimental value at 10 mM MgCl₂ is 64 ± 0.5 mN/m'
               — this case is also at 10mM, so the salt condition matches"
      tier: 2
    angle_stiffness:
      value: 5.7624e-15
      unit: J
      source: "derived: κ_θ = EI/ℓ, EI = κ₀a³/3, ℓ=d. Inherited from chain-bend-2d-oscill
               (verification: scratch/chain_bend_from_papers.py §②)"
      tier: 1
      note: "= 1.391e6 kT — 120 thousand times the depth of the DLVO secondary minimum (11.7 kT). That contrast is the crux of this comparison"

external:
  kind: harmonic_trap_oscillating
  form: "the same geometry as chain-bend-2d-oscill — fixed traps at both ends (force sensors) + the middle
         trap oscillated as y = a sin(ωt)"
  n_trapped: {value: 3, unit: dimensionless, source: "inherited from [P2] Fig.1A", tier: 1}
  stiffness:
    value: 10
    unit: pN/um
    source: "sketch, 'k_t = 10 pN/µm', inherited"
    tier: 0
  amplitude:
    value: [20, 20000]
    unit: nm
    source: >
      A ★proposed sweep (user request, 'check... as a function of amplitude'). The lower bound 20nm is
      ≈14× the bond thermal fluctuation σ_bond=1.44nm (so the signal is above the bond noise). The upper
      bound 20000nm=20µm goes past the onset of bond dissociation (h_min + several times σ_bond) into the
      range where the chain may break — the scan deliberately goes as far as "breaking".
    tier: 3
  omega_range:
    value: [1, 100000]
    unit: rad/s
    source: >
      ★proposal (user request, 'as a function of the sweep speed'). A 5-decade sweep so as to cover both
      τ_bond=5.9µs (bond stretching, very fast) and the low-frequency region the whole chain will feel
      (expected to be entropy/tension-dominated). The exact governing timescale needs further derivation
      in build_ledger, this system having no bending stiffness (the L3 stage, to be confirmed with a human).
    tier: 3

targets:
  - name: storage_modulus       # G'(ω)
  - name: loss_modulus          # G''(ω)
  - name: buckling_shape        # ★ new — a smooth curvature vs a triangle-like local kink (G1)

derived_scales:
  source: "scratch/dlvo_ledger.py"
  lambda_D: {value: 1.7618, unit: nm, expr: "1/kappa"}
  gamma: {value: 1.1790e-8, unit: kg/s, expr: "3 pi eta d"}
  tau_B: {value: 6.1510, unit: s, expr: "d^2/D_t"}
  tau_p: {value: 1.6646e-7, unit: s, expr: "m/gamma"}
  tau_bond: {value: 5.9e-6, unit: s, expr: "gamma/k_bond", role: "★ bond stretching relaxation — the candidate fastest mode"}
  sigma_bond: {value: 1.438, unit: nm, expr: "sqrt(kT/k_bond)", role: "the width of the bond's thermal fluctuation"}
  ell: {value: 1481.2, unit: nm, expr: "d + h_min", role: "bond length (the equilibrium centre-to-centre distance)"}

dimensionless:
  reference: {length: d, time: tau_B, energy: kT, strategy: thermal}
  groups:
    - {name: "well_depth/kT", value: -11.716, meaning: "★ the bond is on the scale of the thermal energy — it may be reversible"}
    - {name: "barrier/kT", value: 381.70, meaning: "a transition to the primary minimum is effectively impossible"}
    - {name: "sigma_bond/well_location", value: 0.129, meaning: "the width of the bond's thermal fluctuation / the well location"}
    - {name: "bond_stiffness_star", value: 1.044e6, meaning: "k_bond d²/kT — the stretching stiffness (not bending)"}

numerics:
  dt:
    value: null
    unit: null
    source: "derived in L3 (cases/chain_bend_dlvo_2d.py build_ledger) from the largest eigenvalue of the
             stiffness matrix (bond stretching, the τ_bond candidate) — this system has no bending
             stiffness, so even the governing mode may differ from chain-bend-2d-oscill"
    tier: 3
  production_note: "the observation window is derived in L3 (N_CYCLES × the period of the lowest ω)"
  stat_target_pct: 5.0
  equilibration: "chain relaxation before driving — the scale is decided in L3 once the governing timescale is fixed"

not_verified:
  - "★★ the core unverified item: the structural prediction that the transverse (bending) linear stiffness
     of a purely central-force chain is 0 (G1) — it has to be confirmed by running. If it is confirmed,
     this system will behave like a hinged chain rather than a 'beam', and G'(ω) may be tension/entropy
     dominated rather than chain elasticity"
  - "The primary source of the Hamaker constant (1.05e-20 J) is unconfirmed — tier 3, an uncertainty of
     perhaps a factor is possible (D1). If the conclusion becomes sensitive to the value of A (e.g. if the
     well depth moves up and down around kT), it needs human re-confirmation"
  - "The amplitude/omega sweep ranges are all ★proposals — they may need narrowing once the actual
     governing timescale is obtained from the L3 non-dimensionalization"
  - "It is not a failure for this system to reach a different conclusion from [P1][P2] (rule 7) — that would
     in fact become simulation evidence for the papers' own claim that 'a central force alone does not
     produce beam behaviour'"
