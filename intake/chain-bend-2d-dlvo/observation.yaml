# L0 Observation — the alternative-hypothesis branch of chain-bend-2d-oscill.
# Not a new sketch: **the same sketch and the same two papers** are read again, but the bond
# potential U_ij is resolved differently. `chain-bend-2d-oscill` carried over the model [P1][P2]
# actually used (JKR adhesive contact + a tangential bending stiffness). This case is built to
# test the question the user raised, doubting that beam-mechanics reading itself —
# "does a bead-spring chain connected only by a central-force (DLVO) pair potential also produce
# the same (beam-like) bending behaviour?" (rule 7: a mismatch is a finding).

source_files:
  - intake/chain-bend-2d-oscill/sketch_01.jpeg   # the same sketch, reused
  - intake/chain-bend-2d-oscill/PhysRevLett.94.138301.pdf
  - intake/chain-bend-2d-oscill/la7023617.pdf

raw_transcription: |
  (identical to chain-bend-2d-oscill/observation.yaml — the sketch transcription is reused.
   The only thing that changes is the resolution of entities.bonded_interaction below.)

system_guess: >
  The same 3-point-bending, oscillatory microrheology geometry. But an alternative physical
  model in which the bond between beads is replaced, from JKR adhesive contact, by
  **the secondary minimum of a DLVO central pair potential (double-layer repulsion + vdW attraction)**.

entities:
  - kind: particle
    note: "a chain of beads — [P1] PMMA, d=1.47µm, inherited"
  - kind: bonded_interaction
    form: "DLVO(r) secondary minimum — central force, no torque"
    note: >
      ★★ [P1] p.2, left column, predicts this explicitly: "Such assumptions have been made
      based on DLVO interactions between particles, which are centro-symmetric.
      If particles did undergo free rotations, we would expect the aggregates
      to respond to the bending moment by forming a trianglelike structure..."
      This case checks whether that prediction (central force → free rotation → triangle-like
      buckling) actually comes out of the simulation. No explicit angle potential is put in —
      that is the core hypothesis (put one in and it becomes no different from the JKR model).

stated_quantities: []   # no new sketch — identical to the original transcription (chain-bend-2d-oscill), not repeated here

stated_goals:
  - "Does G'(ω) and G''(ω) come out, or does the chain buckle triangle-like as [P1] predicted,
     so that beam-like elasticity is not even defined — checking that is the goal of this case"

ambiguities:
  - id: D1
    issue: "the Hamaker constant of DLVO(r) is nowhere in either paper"
    detail: >
      Confirmed by grep — 0 hits for "Hamaker" and for "dielectric constant" (in both papers).
      The surface potential 40±3 mV ([P1] p.1) and the salt concentration (MgCl2, for the purpose
      of double-layer screening, stated in [P1]/[P2]) are there, but the magnitude of the vdW term is not.
    resolution: >
      Found by web search: a Hamaker constant A≈1.05e-20 J for the PMMA-water-PMMA system (tier 3 —
      the primary-source paper was not checked directly, and it was only cross-checked as being the
      same order as the polystyrene-water literature values (0.5~1.5e-20 J). **The uncertainty is stated.**)
      User-approved 2026-08-05.
    confirmed_by: user
  - id: D2
    issue: "the salt concentration — [P1] sweeps 50~500mM, [P2] uses a fixed 250mM ('bare'). Which one?"
    detail: >
      The actual computation shows that 250mM (λ_D=0.35nm) has no barrier, so the vdW diverges at
      contact — the well depth and stiffness are then set not by DLVO but by an arbitrary
      regularization (a cutoff) I put in.
      10mM (λ_D=1.76nm) gives a textbook DLVO curve, a barrier of 382kT + a secondary minimum of
      −11.7kT @ h=11.2nm, and the curvature of the well (= the bond stiffness) is **derived
      directly** from A, ψ0 and κ (no arbitrary regularization needed).
    resolution: "10mM adopted (user-approved 2026-08-05, on the strength of the computation)."
    confirmed_by: user

missing_required:
  - symbol: A_hamaker
    what: "the non-retarded PMMA-water-PMMA Hamaker constant"
    assumed_value: 1.05e-20
    assumed_unit: J
    confidence: 2
    note: "web search — tier 3, primary source unconfirmed. The same order as the polystyrene-family literature values (5e-21~1.5e-20 J)"
    resolution: "user-approved 2026-08-05"

unread_regions: []   # no new sketch — the unread regions are recorded on the original sketch's side (chain-bend-2d-oscill)

prerun_findings:
  - id: G1
    severity: "★★ structural — the reason this case exists"
    finding: >
      In a straight chain with purely central-force (NN) bonds, the change in bond length with the
      transverse displacement y is O(y²), so **the transverse (bending) linear stiffness is exactly 0** —
      structurally identical to a chain connected by hinges. A linear stiffness matrix like
      chain-bend-2d-oscill's bending_matrix() does not exist for this system (equivalent to all its
      diagonal entries being zero).
    consequence: >
      In 3-point bending it is likely to produce the "triangle-like" local kink [P1] predicted rather
      than a smooth beam curvature. G'(ω) may also be in an entropy/tension-dominated (Rouse-like)
      regime rather than chain elasticity — **this is not settled by intuition but checked by running** (rule 6).
    verified: false
