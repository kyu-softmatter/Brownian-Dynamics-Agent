# L0 Observation — chain-bend-2d-oscill 의 대안가설 브랜치.
# 새 스케치가 아니라 **같은 스케치·같은 논문 두 편**을 다시 읽되, 결합 퍼텐셜 U_ij 를
# 다르게 해소한다. `chain-bend-2d-oscill`은 [P1][P2]가 실제로 쓴 모델(JKR 접착접촉 +
# 접선 굽힘강성)을 그대로 옮겼다. 이 케이스는 사용자가 그 빔역학 해석 자체를 의심하며
# 제기한 질문 — "중심력(DLVO) 페어 퍼텐셜만으로 연결한 비드-스프링 사슬로도 같은
# (빔형) 굽힘 거동이 나오는가?" — 를 검증하려고 만든다 (원칙 7: 불일치는 발견).

