ambiguities:
  - id: D1
    issue: "DLVO(r)의 Hamaker 상수가 두 논문 어디에도 없다"
    detail: >
      grep 확인 — "Hamaker", "dielectric constant" 0건 (두 논문 모두).
      표면전위 40±3 mV([P1] p.1)와 염농도(MgCl2, 이중층 스크리닝 목적,
      [P1]/[P2] 명시)는 있지만 vdW 항의 크기가 없다.
    resolution: >
      웹검색으로 PMMA-물-PMMA 계 Hamaker 상수 A≈1.05e-20 J 을 찾음 (tier 3 —
      1차 출처 논문을 직접 확인하지 못했고, 폴리스티렌-물 문헌값들(0.5~1.5e-20 J)과
      같은 자릿수임만 교차확인. **불확실성 명시**). 사용자 승인 2026-08-05.
    confirmed_by: user
  - id: D2
    issue: "염농도 — [P1]은 50~500mM 스윕, [P2]는 250mM 고정('bare')을 쓴다. 어느 것?"
    detail: >
      실제 계산 결과 250mM(λ_D=0.35nm)은 장벽이 없어 vdW가 접촉에서 발산 —
      우물 깊이/강성이 DLVO가 아니라 내가 넣는 임의 정규화(컷오프)로 정해진다.
      10mM(λ_D=1.76nm)은 장벽 382kT + 2차극소 −11.7kT @ h=11.2nm 로
      교과서적 DLVO 곡선이 나오고, 우물 곡률(=결합강성)이 A·ψ0·κ 에서
      **직접 유도**된다 (임의 정규화 불필요).
    resolution: "10mM 채택 (사용자 승인 2026-08-05, 계산 근거로)."
    confirmed_by: user

