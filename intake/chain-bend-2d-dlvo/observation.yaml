prerun_findings:
  - id: G1
    severity: "★★ 구조적 — 이 케이스의 존재 이유"
    finding: >
      직선 사슬에서 순수 중심력(NN) 결합만 있으면, 횡변위 y에 대한 결합길이 변화가
      O(y²)이라 **횡방향(굽힘) 선형강성이 정확히 0**이다 — 힌지로 연결된 사슬과
      동일한 구조. chain-bend-2d-oscill 의 bending_matrix() 같은 선형 강성 행렬이
      이 계에는 존재하지 않는다(대각 성분이 전부 0인 것과 같음).
    consequence: >
      3점 굽힘에서 매끈한 빔 곡률이 아니라 [P1]이 예측한 "삼각형형" 국소 꺾임이
      나올 가능성이 높다. G'(ω)도 사슬 탄성이 아니라 엔트로피/장력 지배
      (Rouse류) 영역일 수 있다 — **감으로 단정하지 않고 실행해서 확인한다** (원칙 6).
    verified: false
