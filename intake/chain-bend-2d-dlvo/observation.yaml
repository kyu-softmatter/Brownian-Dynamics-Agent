raw_transcription: |
  (chain-bend-2d-oscill/observation.yaml 과 동일 — 스케치 전사는 재사용.
   달라지는 것은 아래 entities.bonded_interaction 의 해소뿐.)

system_guess: >
  같은 3점 굽힘·오실레이션 마이크로레올로지 기하. 단, 비드 사이 결합을
  JKR 접착접촉이 아니라 **DLVO 중심 페어 퍼텐셜(이중층 반발 + vdW 인력)의
  2차극소**로 대체한 대안 물리 모델.

entities:
  - kind: particle
    note: "비드 사슬 — [P1] PMMA, d=1.47µm 승계"
  - kind: bonded_interaction
    form: "DLVO(r) 2차극소 — 중심력, 토크 없음"
    note: >
      ★★ [P1] p.2 좌단이 명시적으로 예측한다: "Such assumptions have been made
      based on DLVO interactions between particles, which are centro-symmetric.
      If particles did undergo free rotations, we would expect the aggregates
      to respond to the bending moment by forming a trianglelike structure..."
      이 케이스는 그 예측(중심력 → 자유회전 → 삼각형형 좌굴)이 실제로
      시뮬레이션에서 나오는지를 확인한다. 명시적 angle 퍼텐셜은 넣지 않는다 —
      그게 핵심 가설이다 (넣으면 JKR 모델과 다를 바 없어진다).

