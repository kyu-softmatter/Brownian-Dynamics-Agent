# L2 PhysicalSystem — the dimensional physical system (SI). Rule 3: this is fixed first.
# Source: knowledge/source/papers/2014-newman-yethiraj-sedimentation-equilibrium.md
#         (arXiv:1412.3190v3, read from the arXiv HTML; the PDF was not obtained)
# tier 0 = given / handbook · 1 = literature + verified · 2 = literature, unverified
#      3 = arbitrary assumption

label: sediment-pmma-3d
derived_from: observation.yaml   # ★ the L0 transcription; the paper itself is cited there
description: >-
  Sedimentation equilibrium of a dilute hard-sphere colloid in a walled cell.
  PMMA spheres in a decalin/tetrachloroethylene mixture under gravity, imaged by
  confocal microscopy. The target is the equilibrium density profile Phi(z) and
  the local equation of state read out of it.
dimensions: 3

particle:
  diameter:
    value: 0.8
    unit: um
    source: "paper, text and Table 1: 2a = 0.8 um (1.0 um also studied)"
    tier: 0
  density:
    value: 1259
    unit: kg/m^3
    source: "paper, Table 1: PMMA. Load-bearing here -- it sets Delta-rho and therefore l_g"
    tier: 0
  count:
    value: 584
    unit: dimensionless
    source: >-
      Not chosen. Follows from the paper's mean volume fraction 0.017 and the box:
      N = phi * V / (pi/6) with V = 12 x 12 x 125 d^3. See structure.size.
    tier: 1

medium:
  kind: newtonian
  name: "cis-trans-decalin + tetrachloroethylene (70:30 by volume)"
  temperature:
    value: 295.84
    unit: K
    source: >-
      ★ DERIVED, not assumed. The paper states no temperature. It states
      l_g = 10.7 um, 2a = 0.8 um, rho_PMMA = 1259 and rho_solvent = 1113.8, and
      l_g = kT/((4/3) pi a^3 Delta-rho g) closes on T = 295.84 K = 22.69 C.
      The bracket: 20 C would need rho_f = 1115.1 and 25 C rho_f = 1112.7, and the
      stated 1113.8 lies between them, so T = 296 +- 2 K. Written without the pi
      the same inputs give 94 K, which is not a temperature -- that is how the
      form of the formula was settled too.
    tier: 1
  viscosity:
    value: 1.2312
    unit: mPa*s
    source: >-
      ★ DERIVED from the paper's MEASURED D_0 = 0.44 um^2/s by Stokes-Einstein,
      eta = kT/(6 pi a D_0), at the T above. Right order for decalin/TCE and
      slightly low, which is what a D_0 measured in a finite cell would give.
      ⚠ Not independent of D_0: it is D_0 re-expressed, so do NOT then treat a
      recovered D_0 as a check on eta. The reduced system needs neither.
    tier: 1

geometry:
  volume_fraction:
    value: 0.017
    unit: dimensionless
    source: "paper, text: 'mean volume fraction Phi = 0.017'"
    tier: 0
  cell_height:
    value: 100
    unit: um
    source: >-
      paper, text: 'sample thickness of 100 um'. The paper images a
      77 x 77 x 108 um z-stack, so the 108 exceeds the stated thickness; the
      thickness is the physical cell and is what is modelled. Recorded as an
      ambiguity in the distillation rather than resolved.
    tier: 0
  box_length_x:
    value: 9.6
    unit: um
    source: >-
      12 d -- ours, not the paper's 77 um. APPROVED by the user 2026-09-16 as
      the primary arm, together with a 24 d second arm for the finite-size
      check (rule 10 tier-3 approval; the cost table was 0.71 h vs 2.85 h vs
      45.6 h for 12 / 24 / 96 d at 5 seeds).
    tier: 3
  box_length_y:
    value: 9.6
    unit: um
    source: "12 d -- ours, square cross-section. Approved with box_length_x."
    tier: 3
  box_length_z:
    value: 100
    unit: um
    source: "the paper's stated cell thickness"
    tier: 0
  cross_section:
    value: 9.6
    unit: um
    source: >-
      Ours, not the paper's (which is 77 um). 12 d, chosen as the smallest that
      leaves the minimum image comfortable (r_c = 1.1225 d needs > 2.245 d) while
      keeping N affordable. The paper's 77 um would be N = 37,500.
    tier: 3

external:
  kind: gravity
  form: "U(z) = (m - m_fluid) g z = kT z / l_g, uniform force F_z = -kT/l_g"
  source: >-
    paper: gravity is the whole point of the system. Implemented as
    md.force.Constant; md.external.field has no gravity class (bd-hoomd line 421).
  boundary:
    kind: two_walls
    form: "Gaussian repulsion at z = 0 and z = L_z"
    epsilon_kT: 20
    sigma_d: 0.3
    source: >-
      Ours. The paper's cell has real glass walls top and bottom. Gaussian rather
      than LJ on purpose: an LJ wall reaches F = 1517 kT/d at h = 0.4 d and a
      particle passes straight through at dt = 1e-3 with no NaN (bd-hoomd trap 22,
      measured). Gaussian's force is bounded at eps/(sigma sqrt(e)) = 40.4 kT/d.

interactions:
  kind: wca
  form: "U(r) = 4 eps [(d/r)^12 - (d/r)^6] + eps for r < 2^(1/6) d, else 0"
  epsilon_kT: 1
  source: >-
    Ours, a stand-in for the hard sphere the paper reports. ⚠ This is the
    substitution the Carnahan-Starling comparison is ABOUT: the simulation imposes
    a soft core, not a hard one, so a deviation from CS is a result and not a bug
    (rule 7'). knowledge/wiki/findings/wca-reproduces-carnahan-starling.md is this
    repository's own prior measurement of the same substitution.

targets:
  - name: density_profile          # Phi(z) -- the primary
  - name: gravitational_length     # l_g fitted from ln n(z); the implementation check
  - name: local_equation_of_state  # Z(Phi) from the hydrostatic relation, vs Carnahan-Starling
  - name: lateral_diffusion        # D in x,y -- self-consistency against kT/gamma

numerics:
  dt_star: 2.0e-4            # bound by the WCA core at r = 0.90 d (F = 139 kT/d)
  production_tau_sed: 5      # multiples of tau_sed = l_g^2/D_0 = 178.9 tau_d
  discard_fraction: 0.5      # the first half is discarded, the second half measured
  samples_per_tau_sed: 40
  n_seeds: 5                 # the 12 d primary arm
  n_seeds_fs: 2              # the 24 d finite-size arm
  lxy_fs_d: 24               # the second cross-section, in diameters
  min_sep_d: 1.0             # RSA rejection radius; d puts the closest pair at the WCA cutoff

# ── structural choices — the basis for dimensionality and size (D9) ────────
structure:
  dim:
    value: 3
    basis: given
    source_kind: artefact
    source_file: ../../knowledge/source/papers/2014-newman-yethiraj-sedimentation-equilibrium.md
    source: >-
      The distillation records confocal z-stacks of 77 x 77 x 108 um and a
      density profile along z. A sedimentation profile is a statement about the
      third dimension, so the source states the dimensionality by construction.
    alternatives: [2]
    why_not: >-
      2D is not available: gravity acts along z and the observable IS the z
      profile, so removing z removes the question. `required` would also hold for
      that reason, but `given` takes precedence when the source states it.
    what_would_change: >-
      Everything. The barometric law's decay length is dimension-independent, but
      the equation of state is not: Carnahan-Starling is the 3D hard-sphere EOS
      and the 2D analogue is a different function. A 2D run compared against CS
      would be wrong with no symptom.
  size:
    role: system
    n: 584
    phi: 0.017
    pins: L
    fixed_by: cost
    stated_in_source: null
    finite_size: >-
      PARTIAL — two cross-sections, 12 d (5 seeds, the primary) and 24 d
      (2 seeds), which is a 4x change in N at fixed density and fixed cell
      height. That tests the lateral axis, which is the only one not pinned by
      physics: the z extent IS pinned (125 d = 9.35 l_g, walls at both ends, so
      no periodic lid contaminates the tail) and phi is the paper's.
      ⚠ Still NOT a scaling study — two points can show that the profile does not
      move, and cannot fit an exponent. The paper's own cross-section is 96 d,
      8x wider than the primary arm and 45.6 h of compute, so the third point is
      out of budget (A3) rather than forgotten.
    finite_size_status: partial
    what_would_change: >-
      L is pinned and N follows from phi, so N is not free. The cell height is the
      paper's 100 um and the volume fraction is the paper's 0.017; the only choice
      is the cross-section, and it enters through cost alone (N scales as L_xy^2,
      and the measured rate is 8724 steps/s at N = 584). A wider cross-section
      would narrow the per-slab Poisson error and change nothing else in the
      one-body profile -- which is the claim the not_done above leaves open.
