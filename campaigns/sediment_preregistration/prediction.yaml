schema: bdbot.prediction/0.1
campaign: sedimentation-eos-S31
case: sediment-pmma-3d
written: 2026-09-16
revision: 5
sealable: true

# ══════════════════════════════════════════════════════════════════════════
# ⚠⚠ THE RUNNING CAMPAIGN IS SEALED AGAINST REVISION 4, NOT THIS FILE.
#
# `runs/<run_id>/prediction.yaml` in all eight run directories carries revision
# 4 and its seals verify. This file diverged from them AFTER they were sealed,
# and the divergence is exactly two fields:
#
#     P2 `Z_dilute_tail`         role: implementation_check -> measurement
#     P5 `profile_halves_chi2_nu` role: implementation_check -> measurement
#
# Nothing else. No prediction, threshold, window, seed, arm or cost differs.
#
# ★ Which reading governs, and why this is a documentation defect rather than a
#   change of the registered plan: revision 4 ALREADY pre-registers both
#   demotions, in three places that are inside the sealed copies --
#   `design_power.gates_as_revised` (twice, each with its rule 7' argument) and
#   the revision-4 disclosure, which says in terms that "the two statistics whose
#   thresholds would have failed had their ROLE corrected instead". What revision
#   4 failed to do was update these two vestigial `role:` fields to match, so the
#   sealed document contradicts itself and the favourable reading happens to be
#   the correct one. That is stated here rather than resolved quietly.
#
# ⚠ The argument for both demotions does not depend on any measured value: Z -> 1
#   in the dilute tail holds only at equilibrium, and drift is the expected
#   signature of the losing hypothesis. Both would be true had nothing been run.
#
# Caught by `tests/test_plan_is_implemented.py`, which compares every sealed role
# against the role the case sets. DO NOT run `--prepare` while the campaign is
# running: it would re-copy this file over the sealed revision-4 copies and split
# the campaign across two documents.
# ══════════════════════════════════════════════════════════════════════════

question: >-
  Does free-draining Brownian dynamics with a soft (WCA) core reproduce the
  hard-sphere equation of state that Newman & Yethiraj report for this
  sedimentation cell -- and does it do so only after the excluded volume is
  mapped to a Barker-Henderson effective diameter, or at the nominal diameter as
  well?

why_this_system: >-
  A sedimentation profile is a Boltzmann distribution in an external potential,
  so ONE run sweeps the equation of state over a whole range of local volume
  fraction: phi falls from 0.159 at the wall to 1e-4 at the top of the cell,
  where Carnahan-Starling runs from 98 % above the ideal gas down to 1. The
  source reports the zero-field EOS as "hard sphere without any re-scaling of
  particle size" and in "excellent agreement" with Carnahan-Starling, but gives
  no percentage -- so the threshold has to be ours, and it is inherited rather
  than invented (see `threshold`).

why_this_run_exists: >-
  ★ The scientific question is the vehicle. The deliverable is that this
  repository can take a paper WITH NO PUBLIC CODEBASE -- arXiv:1412.3190 is a
  2014 experimental paper, no repository, no supplementary, the PDF not even
  obtained -- and produce a defended quantitative answer from the text alone.
  Gravity and a wall did not exist here before 2026-09-16
  (`verify/verify_sedimentation_wall.py`), so this is also the first run of a new
  system card.

# ── rule 7': what the simulation IMPOSES vs what the theory ADDS ───────────
what_the_simulation_imposes:
  - "a WCA core with eps = 1 kT and sigma_LJ = 2^(-1/6) d, so the repulsion
     vanishes at r = d. NOT a hard sphere."
  - "a uniform force F_z = -kT/l_g with l_g/d = 13.375, the paper's measured value"
  - "a bounded Gaussian wall at each end of a 125 d cell (eps_w = 20 kT,
     sigma_w = 0.3 d)"
  - "periodic x, y over 12 d (or 24 d in the finite-size arm) -- OURS, not the
     paper's 96 d"
  - "free-draining dynamics: a scalar gamma, no hydrodynamic interactions"
  - "N = 584 (or 2338), fixed by the paper's phi = 0.017 and the box"
  - "the initial profile. ★ TWO ARMS, and this is the design change revision 2
     records: the primary arm starts from the CARNAHAN-STARLING hydrostatic
     profile (the solution of d(phi Z)/dz = -phi/l_g with Z = Z_CS), and a
     separate single-seed arm starts from the IDEAL-GAS exponential and runs
     twice as long. Neither is the answer; the primary arm tests STATIONARITY of
     the state it starts in, and the ideal arm tests CONVERGENCE to it from
     somewhere else. `init` is in `params`, so it is hashed into the run_id --
     two runs differing only in where they started are two different runs."

what_the_theory_adds:
  - "Carnahan-Starling Z(phi) -- the 3D hard-sphere EOS. The simulation imposes
     no equation of state at all, so a mismatch is a RESULT."
  - "the Barker-Henderson mapping phi_eff = phi (d_BH/d)^3 with d_BH/d = 0.9048
     at eps = 1 kT. Whether the mapping is REQUIRED is the question."
  - "the ideal-gas limit Z -> 1 as phi -> 0, which is exact and is used as a
     correctness check rather than a result."
  - "★ the CS hydrostatic profile is used as the primary arm's INITIAL GUESS, so
     Carnahan-Starling enters the run twice: once as the thing being tested and
     once as a starting point. That is why the primary arm's verdict rests on
     STATIONARITY (it must not drift away from where it started) and why the
     ideal-gas arm exists at all (it must arrive at the same place from a
     profile that is 54 % denser at the wall). Reading the primary arm alone
     would be circular, and this is the sentence that says so before the run."

# ── the runs ───────────────────────────────────────────────────────────────
runs:
  common:
    case: sediment-pmma-3d
    phi: 0.017
    l_g_star: 13.375
    L_z_star: 125.0
    eps_wca_kT: 1.0
    eps_wall_kT: 20.0
    sig_wall_d: 0.3
    rcut_wall_d: 2.0
    min_sep_d: 1.0
    wall_margin_d: 0.5
    dt_star: 1.5e-4
    n_eq: 0
    samples_per_tau_sed: 40
    production_tau_sed: 4.0        # the DEFAULT; an entry may override it
    init: cs                       # the DEFAULT; an entry may override it
  entries:
    #  ── arm A: start at CS(phi_eff) -- "the mapping IS required" ──────────
    - {arm: cs_eff,      lxy: 12, N: 584,  seed: 11, init: cs_eff}
    - {arm: cs_eff,      lxy: 12, N: 584,  seed: 12, init: cs_eff}
    - {arm: cs_eff,      lxy: 12, N: 584,  seed: 13, init: cs_eff}
    #  ── arm B: start at CS(phi_nominal) -- "no mapping needed" ────────────
    - {arm: cs_nominal,  lxy: 12, N: 584,  seed: 21, init: cs}
    - {arm: cs_nominal,  lxy: 12, N: 584,  seed: 22, init: cs}
    - {arm: cs_nominal,  lxy: 12, N: 584,  seed: 23, init: cs}
    #  ── arm C: start far from both ────────────────────────────────────────
    - {arm: convergence, lxy: 12, N: 584,  seed: 31, init: ideal, tau_sed: 8.0}
    #  ── arm D: the same question at 4x the cross-section ──────────────────
    - {arm: finite_size, lxy: 24, N: 2338, seed: 41, init: cs_eff, tau_sed: 3.0}
  ★_the_two_initial_conditions_ARE_the_experiment: >-
    This is the design change of revision 3, and it makes the campaign
    DISCRIMINATING rather than merely calibrated.

    A stationary profile IS an equilibrium profile. The two hypotheses are two
    different profiles for this cell -- phi(0) = 0.11237 if the Barker-Henderson
    mapping is required, 0.10306 if it is not -- and they differ by 17.05 % in Z
    at the wall. So start at each, and ask which one does not move. **At most one
    can be stationary.** Whichever arm holds its profile is the answer, and the
    arm that drifts says which way.

    Revision 2 started every production seed at CS(phi_nominal) and then compared
    the result against CS(phi_eff). That was answerable but awkward: the run began
    6.5 % away from the value the prior finding predicts, so the stationarity test
    and the EOS test were measuring the same drift and the analysis plan had to
    carry a paragraph admitting the circularity. Splitting the seeds across the
    two candidates removes it -- neither arm is privileged, and the comparison is
    between two arms rather than between one arm and a curve.
  ⚠_three_seeds_per_arm_and_why_that_is_enough: >-
    `verify/verify_sediment_design_power.py` measures the primary statistic's
    per-seed noise at 0.40 % and the gap between the hypotheses at 6.5 %, which
    is 15.6 sigma. ONE seed decides it. The three per arm buy a seed-to-seed
    standard deviation (A2 forbids a number without an error bar) and protection
    against a single bad realisation -- not statistical power, which is already
    far in excess. ⚠ nu = 2 on that sd is thin and is listed under
    `thin_margins_accepted`.
  ⚠_seeds_do_not_overlap_between_arms_in_revision_3: >-
    11-13, 21-23, 31, 41. Revision 2 shared seed 11 between the primary and
    convergence arms for legibility; here the arms are COMPARED against each
    other, so a shared RNG stream would make two arms correlated in a way the
    seed-to-seed sd could not see. All eight truncate to themselves inside HOOMD.
  how_T_obs_was_fixed: >-
    ★ MEASURED on a pilot, not chosen. tau_sed = l_g^2/D_0 = 178.9 tau_d is the
    slowest mode of the EQUILIBRIUM state; the time to fall the height of the
    cell is tau_fall = L_z l_g/D_0 = 1672 tau_d, nine times longer. An 8 tau_sed
    pilot started from the ideal-gas profile moved phi(wall) only 77 % of the way
    from 0.1589 to the CS value 0.1031 and its L4 drift check on <U>/N still read
    6.3 sigma -- so an ideal-gas start needs roughly 25 tau_sed per seed, which is
    4.7 h for the primary arm alone and fails A3 at the approved budget.
    Hence the two arms below.
  why_two_initial_conditions: >-
    ★ The design change of revision 2, and the reason the pilot is disclosed.
    Starting the primary arm from the CS hydrostatic profile removes the fall,
    but it cannot by itself demonstrate equilibrium -- a run that starts at the
    answer and stays there proves only that it is a fixed point of nothing in
    particular. So the claim is split:
      primary (5 seeds, 4 tau_sed, init=cs)      -- STATIONARITY. The profile
        must not drift away from its start, and the L4 drift check on <U>/N plus
        the first-half/second-half profile comparison are what say so.
      convergence (1 seed, 8 tau_sed, init=ideal) -- APPROACH. Starting 54 %
        denser at the wall, it must move TOWARD the primary arm's profile, and
        the direction and the remaining gap are reported whether or not it
        arrives. 8 tau_sed is affordable for one seed and is NOT claimed to be
        converged.
    ⚠ If the convergence arm ends up far from the primary arm, the primary arm's
    Z is reported as CONDITIONAL on its initial condition and the campaign
    verdict is INCONCLUSIVE. Written here so that outcome cannot be reinterpreted
    later as a pass.
  why_two_cross_sections: >-
    The lateral width is the only free parameter -- the cell height and phi are
    the paper's. For a ONE-BODY profile it should set the statistical error and
    nothing else, and the 4x change in N at fixed density is what tests that.
    ⚠ Two points is not a ladder; `structure.size.finite_size_status` is
    `partial` and the production point is not covered. The paper's own 96 d would
    be 45.6 h (A3).
  why_the_seeds_are_not_shared_across_arms: >-
    The arms have different N or a different initial sampler, so the RNG stream
    cannot be matched particle-for-particle anyway. The seeds overlap in value
    only.
  ⚠_why_the_seeds_are_small_integers_and_not_dates: >-
    ★ THE SEEDS WERE CHANGED FROM 20260916..20260920 TO 11..15 BEFORE SEALING,
    and the reason is a trap this repository had already written down and this
    campaign had walked straight past. `hoomd.Simulation(seed=...)` TRUNCATES to
    16 bits (`bd-hoomd` trap 12, measured in a predecessor: seeds 65536 apart gave
    a maximum coordinate difference of EXACTLY 0.000e+00 over 2000 steps). The
    spec hashes the UNtruncated seed, so two such runs get two different run_ids
    and one thermal-noise stream -- and a seed-to-seed sd computed over them is
    not an error bar.
    The 8-digit dates happened to be safe (they truncate to 10292..10296, still
    distinct) and an audit of all archived specs found 0 replicate groups
    affected. They were changed anyway, because trap 12's own advice is "use
    small consecutive integers" and a convention that cannot fail beats a
    convention that fails silently plus a checker -- the same reasoning that
    picked a bounded Gaussian wall over a Lennard-Jones one.
    ⚠ The checker was kept as well, for the cases that do use date seeds:
    `campaigns/s31_sedimentation.py::seed_collisions` refuses to `--prepare` a
    campaign whose truncated seeds collide within an arm, and
    `tests/test_seed_truncation.py` audits every archived spec. Trap 12 had been
    documented since 2026-08 and enforced nowhere, which is this repository's
    most frequently repeated failure.
  why_seed_1_is_not_used: >-
    The two disclosed pilots are seed 1. Keeping the production seeds off it
    means no sealed run can be confused with a pilot in a log.
  why_the_convergence_arm_shares_seed_11_with_P1: >-
    So that the pair differs in `init` and duration and nothing else. The RNG
    stream diverges immediately anyway -- the two initial samplers consume it
    differently -- so this buys legibility, not a paired comparison, and is
    recorded as such rather than claimed as variance reduction.

# ── the primary statistic ──────────────────────────────────────────────────
primary_statistic:
  name: Z_dev_wmean_vs_CS_eff
  definition: >-
    The Poisson-weighted mean of 100*(Z - Z_CS(phi_eff))/Z_CS(phi_eff) over the
    comparison window, in percent, where Z is read from the density profile by
    the hydrostatic relation and phi_eff = phi (d_BH/d)^3.
  window: >-
    slabs with h >= 2.0 d (above the wall's reach: the Gaussian wall has
    U(2 d) = 4.5e-9 kT, so this is clean by construction, not by inspection) AND
    with at least 200 accumulated counts.
  Z_is_read_from_the_profile_not_from_hoomd: >-
    ★ Z = (1/(l_g phi(z))) * integral_z^Lz phi dz', the hydrostatic relation.
    HOOMD's pressure is NOT used: it carries a kinetic term built from
    velocities, and overdamped BD velocities are not physical
    (`findings/wca-reproduces-carnahan-starling.md` trap 2, measured
    kT_kin = 1.0009-1.015). The sedimentation route never touches them.
  ⚠_why_a_weighted_mean_and_not_the_maximum: >-
    The maximum over slabs is unusable at this sampling and that was MEASURED,
    not suspected. A 0.5 d slab at phi = 0.05 collects 6.9 particles per frame,
    so ~200 frames give ~1370 counts = 2.7 % Poisson on that slab's Z, and the
    max over ~40 such slabs is about 2.5 sigma * 2.7 % = 7 % from noise alone --
    it would break a 2 % band whatever the physics did. `goal.yaml` originally
    named the max; it was changed to the weighted mean BEFORE sealing, which is
    what the pre-registration window is for. The max is still REPORTED, as a
    `measurement` with no verdict, so the noise floor stays visible beside the
    statistic that carries one.
  estimator_is_validated_against_a_known_answer: >-
    `tests/test_sediment_eos.py`. For an ideal gas in a finite cell the exact
    answer is Z = 1 - exp(-(L_z - z)/l_g), and the estimator reproduces it with a
    maximum error of (bin/l_g)^2 / 8 over three decades of bin/l_g -- which is
    1.7e-4 (0.017 %) at the production bin of 0.5 d. ⚠ The FIRST version used a
    plain cumsum, which integrates from each bin's lower edge and was high by
    bin/(2 l_g) = +1.65 % at exactly these settings. That would have consumed the
    whole 2 % band and been reported as a deviation from Carnahan-Starling.

secondary_statistic:
  name: Z_dev_wmean_vs_CS_nominal
  definition: "the same weighted mean, against Z_CS(phi) with NO mapping"
  role: >-
    ★ THE DISCRIMINATOR. CS(phi_eff) and CS(phi_nominal) differ by -17.05 % at
    the wall of this cell, so the two hypotheses are separable by this
    measurement. No prediction is attached to this number; the GAP between it and
    the primary is the answer.

# ── ★ DESIGN POWER, measured before the data exists (revision 3) ──────────
design_power:
  computed_by: verify/verify_sediment_design_power.py
  method: >-
    The two hypotheses are made concrete as two profiles -- `cs_hydrostatic_profile`
    with `scale = 1` and with `scale = (d_BH/d)^3 = 0.740726`. Poisson counts are
    drawn on each and the CASE'S OWN estimators are imported and run on them, 800
    realisations per arm per hypothesis. A power calculation run against a second
    copy of the estimator measures the copy.
  ⚠_why_this_section_did_not_exist_in_revisions_1_and_2: >-
    It should have. Revisions 1 and 2 stated three correctness gates as fixed
    percentages and never computed the noise those percentages were meant to sit
    outside of. Two of the three did not survive the calculation:
      l_g_fitted_tail  bias +10.4 %, 3 sigma 18.3 %, against a 5 % tolerance --
        the band was NARROWER THAN ITS OWN 1 SIGMA. With the sealed decision rule
        reading "a failed correctness gate means IMPLEMENTATION FAILURE and no
        physics", the campaign was ~82 % likely PER SEED to call a working
        implementation broken.
      Z_dilute_tail    bias -2.0 %, 3 sigma 8.6 %, against a 5 % tolerance --
        1.7 sigma, so ~7 % per seed.
    Neither was detectable by inspection, and neither needed a run to find.
  per_seed_at_the_primary_arm:       # L_xy = 12 d, 4 tau_sed, 160 frames
    Z_dev_wmean_vs_CS_eff: {bias_pct: -0.066, sigma_pct: 0.384, separation_sigma: 15.6}
    l_g_fitted_dense:      {mean_eff_d: 16.485, mean_nom_d: 17.554, sigma_d: 0.064,
                            separation_sigma: 15.0}
    phi_wall_measured:     {mean_eff: 0.1118, mean_nom: 0.1029, sigma: 0.0019,
                            separation_sigma: 4.7}
    l_g_fitted_tail:       {bias_pct: 10.44, sigma_pct: 6.09, separation_sigma: 0.1}
    Z_dilute_tail:         {bias_pct: -2.04, sigma_pct: 2.87, separation_sigma: 0.4}
    Z_dev_max_vs_CS_eff:   {mean_pct: 14.20, sigma_pct: 3.19, separation_sigma: 0.9}
  at_the_finite_size_arm:            # L_xy = 24 d, 3 tau_sed, 120 frames
    Z_dev_wmean_vs_CS_eff: {bias_pct: -0.050, sigma_pct: 0.227, separation_sigma: 27.0}
    l_g_fitted_dense:      {sigma_d: 0.036, separation_sigma: 27.9}
  what_it_says:
    - "★ THREE INDEPENDENT DISCRIMINATORS, at 15.6, 15.0 and 4.7 sigma. That is
       `A1` satisfied by construction rather than by argument: the weighted-mean Z
       deviation, the dense-window decay length and the wall volume fraction are
       three different reductions of the profile -- an integral, a slope and a
       single bin -- so they fail differently."
    - "The primary statistic is UNBIASED against its matching hypothesis
       (-0.066 %), which is the `eos_from_profile` half-bin fix verified a second
       way. The first version of that estimator was +1.65 %, i.e. four times the
       per-seed noise."
    - "⚠ `Z_dev_max_vs_CS_eff` is 0.9 sigma of separation with a 3 sigma of
       9.6 % -- it cannot decide anything and its noise floor is five times the
       threshold. Already a `measurement`; this is the calculation that says the
       change from max to weighted mean was not merely prudent."
    - "⚠ `l_g_fitted_tail` and `Z_dilute_tail` are 0.1-0.4 sigma. That is CORRECT
       and is why they are the correctness gates: the dilute tail is ideal-gas
       under either hypothesis, so a statistic there cannot be contaminated by the
       physics question. It also means neither can ever support the verdict."
  the_tail_fit_cannot_be_a_gate_at_L_xy_12: >-
    Raising `fit_decay_length`'s count floor was tried and makes it WORSE, because
    it truncates the window and collapses the lever arm: floor 20 gives 40 bins
    over 22.8 d and sigma = 6.1 %, floor 50 gives 15 bins over 8.7 d and
    sigma = 30 %. The cause is that `E[ln n] != ln E[n]` for Poisson counts, which
    biases the fitted slope low where counts are small and so inflates `l_g`. At
    L_xy = 24 d the same window carries 4x the counts and the bias falls to
    +3.4 % with sigma = 1.9 %. So `l_g_fitted_tail` is a `measurement`, reported
    with its own standard error -- which the Monte Carlo confirms is honest
    (reported/actual = 0.96 to 1.04 across the arms).
  ★_MEASURED_BLOCK_SEMS_revision_4: >-
    Revision 4 replaces the Monte Carlo's sigma with the RUN'S OWN block SEM,
    measured on a production-length pilot (seed 91, cs_eff, 4 tau_sed, 16 blocks
    of ~29 frames). The profile is now accumulated per block, so every
    profile-derived statistic carries an error bar that has temporal correlation
    in it -- which no Monte Carlo on a static profile can supply.
  measured_block_sem_vs_monte_carlo:
    Z_dev_wmean_vs_CS_eff: {block_sem_pct: 0.399, mc_sigma_pct: 0.384, ratio: 1.04}
    l_g_fitted_dense:      {block_sem_d: 0.167, mc_sigma_d: 0.064, ratio: 2.6}
    phi_wall_measured:     {block_sem: 0.00151, mc_sigma: 0.0019, ratio: 0.8}
    Z_dilute_tail:         {block_sem: 0.0417, mc_sigma: 0.0287, ratio: 1.45}
  ⚠_and_the_detour_that_produced_those_numbers: >-
    Between revision 3 and revision 4 the integrated autocorrelation time of the
    MEAN PARTICLE HEIGHT was measured at 86-132 frames out of 478, giving
    N_eff = 3.6-5.5 and an apparent 10x inflation of every sigma. Applied to the
    primary statistic that would have made the campaign 1.7 sigma rather than
    15.6 sigma and unaffordable. It was WRONG to apply it there: `h_mean` tracks
    the slow global drift on tau_fall = 9.35 tau_sed, while the dense-region
    statistics that carry the verdict decorrelate far faster -- the measured block
    SEM of the primary statistic is 1.04x the Monte Carlo's sigma, not 10x.
    Recorded because the wrong inference was nearly acted on, and because the
    lesson is that a correlation time measured on ONE observable does not
    transfer to another.
  gates_as_revised:
    Z_dilute_tail:      {role_in_revision_4: measurement, why: "★★ RULE 7' CORRECTION. Z -> 1 in the dilute tail is exact AT EQUILIBRIUM and not on a relaxing run, and equilibrium is what this campaign measures. Measured on the cs_eff pilot: 0.831, while phi(wall) rose 8.9 % above its start and the tail's apparent decay length fell to 10.8 d -- one coherent story of mass moving down, and every part of it is the physics the run is for. As an implementation_check it would have reported IMPLEMENTATION FAILURE and stopped the analysis before any of that was read. What verifies gravity instead is verify/verify_sedimentation_wall.py stage 3, which fitted l_g = 13.3731 +- 0.1125 against an imposed 13.3750 on NON-INTERACTING particles -- no equilibrium assumption, and already on record"}
    profile_halves_chi2_nu_role: {role_in_revision_4: measurement, why: "★★ THE SAME RULE 7' CORRECTION. Drift is the EXPECTED signature of the losing hypothesis -- the verdict is which arm does NOT move, so a moving arm is the informative one. Measured 2.686 on the cs_eff pilot, i.e. that candidate is not the equilibrium, which is a finding and not a bug"}
    ⚠_what_is_left_to_gate_on: "D_xy (the clock, 20 %) and min_sep_placed. THIS IS A STRUCTURAL WEAKNESS OF THE SYSTEM, not an oversight: every profile statistic in a sedimentation cell presupposes equilibrium, and equilibrium is the measurement. So the per-run correctness gates are weak and the implementation is verified OUT OF BAND, by the non-interacting capability check. Stated here so a reader does not mistake a short gate list for a thorough one"
    D_xy:               {predicted: 1.0,   tolerance: "20 %",  why: "a CLOCK check, not a precision measurement of collective diffusion -- it catches factors, which is what a wrong dt or D_0 produces. Two observations gave 0.966 and 1.061, so 10 % was ~1.7 sigma. Widened deliberately and the reason stated rather than left as a tight-looking number that would fail for the wrong reason"}
    profile_halves_chi2_nu: {predicted: 1.0, tolerance: "100 %, i.e. the band [0,2]", why: "chi^2 per degree of freedom between the two half-window profiles; 2 is twice the Poisson variance"}
  not_calibrated_by_this_calculation:
    - "`D_xy`. The Monte Carlo generates a static profile, so it says nothing
       about the lateral MSD. Its tolerance comes from two run observations, which
       is thin, and it is named here rather than presented as calibrated."
    - "`profile_halves_chi2_nu`. The synthetic realisations are independent by
       construction, so a chi^2 between two halves of them is 1.0 trivially. What
       the calculation CANNOT give is the effect of real temporal correlation
       between successive frames, which inflates it. The [0,2] band is therefore
       a sanity bound, not a calibrated test."

# ── the threshold, inherited rather than invented ──────────────────────────
threshold:
  value: 2.0
  units: percent of Z
  basis: >-
    `knowledge/wiki/findings/wca-reproduces-carnahan-starling.md`, this
    repository's own prior measurement of the SAME substitution: WCA reproduces
    Carnahan-Starling to within 2 % for phi_eff <~ 0.38 once the
    Barker-Henderson diameter is used, with measured deviations of -0.32 % at
    phi ~ 0.10 and -0.51 % at phi ~ 0.21 at eps = 1 kT. This run's range tops out
    at phi_eff = 0.118, inside that.
  ⚠_not_reproduced_by_us_here: >-
    That finding carries `status: proposed` and was measured in a different
    geometry (bulk, periodic, no gravity) with the EOS read from the virial
    rather than from a profile. So it is a BASIS for the threshold, not a
    verification of this run. If the two disagree, the disagreement is itself the
    result and must not be averaged away.
  expected_sign: >-
    NEGATIVE against CS(phi_nominal). d_BH = 0.9048 d < d, so the effective
    particles are smaller than nominal and the column is less crowded than a
    hard-sphere fluid at the same nominal phi. Stated in advance so that getting
    the sign right is not mistaken for a confirmation.

# ── the decision rule, fixed before the data exists ────────────────────────
decision_rule:
  applied_in_this_order: true
  steps:
    - "1. Verify the seal on every run directory before reading any number. A
       broken seal ends the analysis."
    - "2. CORRECTNESS GATES first, and they can end it: l_g_fitted_tail within
       5 % of 13.375, Z_dilute_tail within 5 % of 1, D_xy within 10 % of 1. If any
       fails, report IMPLEMENTATION FAILURE and no physics. ⚠ The TAIL window is
       the gate, not the dense one -- see P1/P1b."
    - "3. STATIONARITY, for the primary arm: the L4 drift check on <U>/N must
       pass, AND the profile measured over the first half of the run must agree
       with the second half within Poisson error over the comparison window. The
       primary arm starts from the CS profile, so this is the whole content of
       its equilibrium claim and it is checked two ways rather than assumed.
       A run that is still drifting is reported as not stationary and its profile
       is not used."
    - "3b. CONVERGENCE, from the ideal-gas arm: its phi(wall) must lie between
       the ideal-gas start (0.1589) and the primary arm's value, i.e. it must
       have moved in the right direction, and the remaining gap is REPORTED.
       ⚠ It is not required to arrive. If it has moved less than half way after
       8 tau_sed the primary arm's Z is reported as CONDITIONAL on its initial
       condition and the campaign verdict is INCONCLUSIVE."
    - "4. Read the primary statistic over the 5 primary-arm seeds: mean and
       seed-to-seed sd. A2 forbids a number without an error bar."
    - "5. ★ THE VERDICT COMES FROM THE CONTRAST BETWEEN ARM A AND ARM B, not
       from one arm against a curve. Arm A starts at CS(phi_eff), arm B at
       CS(phi_nominal). Exactly three outcomes are pre-registered:
         MAPPING REQUIRED -- arm A is stationary and arm B drifts TOWARD arm A's
           profile. Confirmed by |Z_dev_wmean_vs_CS_eff| < 2 % in arm A, and by
           arm B's `profile_half_shift_pct` being negative with
           `profile_halves_chi2_nu` > 2.
         MAPPING NOT REQUIRED -- the mirror image: arm B stationary, arm A
           drifting toward it. This CONTRADICTS the prior finding and would be the
           more interesting result.
         INCONCLUSIVE -- both stationary (the run cannot tell them apart within
           4 tau_sed), or neither (both drift to some third profile, in which case
           the third profile is the finding and Z is read from it)."
    - "5b. The three discriminators must AGREE, and disagreement is not averaged
       (`A1`): Z_dev_wmean_vs_CS_eff (15.6 sigma), l_g_fitted_dense (15.0 sigma,
       16.485 vs 17.554 d) and phi_wall_measured_vs_cs_eff (4.7 sigma, 0.1118 vs
       0.1029). They are an integral, a slope and a single bin of the same
       profile, so they fail differently. If two of the three point one way and
       the third the other, the verdict is INCONCLUSIVE and the disagreement is
       the reported result."
    - "6. The finite-size arm is read LAST and only as a consistency check on the
       profile: the two cross-sections' phi(h) must agree within their Poisson
       errors over the comparison window. It does not change the verdict. ⚠ It
       starts at CS(phi_eff), so it can corroborate arm A and cannot corroborate
       arm B -- stated so that its agreement with A is not counted as independent
       evidence for A."

predictions:
  - id: P1
    quantity: l_g_fitted_tail
    predicted: 13.375
    unit: d
    window: "h in [55, 100] d, where phi < 1e-3 and the fluid is effectively ideal"
    tolerance: "none -- reported with its own standard error"
    role: measurement
    ⚠_demoted_from_implementation_check_in_revision_3: >-
      The Monte Carlo puts its bias at +10.4 % and its 1 sigma at 6.1 % at
      L_xy = 12 d, so no symmetric band around 13.375 is both passable and
      informative there. Raising the fit's count floor makes it worse by
      collapsing the lever arm. It is reported with the fit's own standard error,
      which the Monte Carlo confirms is honest (reported/actual = 1.04), and at
      L_xy = 24 d the bias falls to +3.4 % with sigma = 1.9 % so the number is
      meaningful in arm D. See `design_power`.
    basis: >-
      For POINT particles the profile is exactly exp(-z/l_g), and the
      non-interacting capability check reached -0.014 % (0.02 sigma) at this l_g
      (`verify/verify_sedimentation_wall.py` stage 3). In the TAIL the
      interacting profile is still exponential: integrating the CS hydrostatic
      equation and fitting this window gives 13.50 d, +0.9 %, inside 5 %.
    a_mismatch_means: "a bug in the gravity, the wall or the profile accumulation"
  - id: P1b
    quantity: l_g_fitted_dense
    predicted: 16.45
    unit: d
    window: "h in [2, min(6 l_g, L_z - 2)] d, and only bins with >= 20 counts"
    tolerance: "3 %"
    role: hypothesis
    ★_this_is_the_SECOND_discriminator: >-
      16.485 d if the mapping is required, 17.554 d if it is not, with a per-seed
      sigma of 0.064 d -- 15.0 sigma apart, which is as decisive as the primary
      statistic and arrives by a completely different route (a weighted slope
      rather than a cumulative integral). The prediction 16.45 sits at the
      CS(phi_eff) value, rounded down to cover the 0.7 % spread between arms that
      the >= 20-count floor introduces; 3 % is 4.7 sigma wide and still 6.3 %
      clear of the alternative.
    ⚠_revision_2_predicted_15.442_and_that_was_wrong_by_13_percent: >-
      15.442 is what a fit over the CONTINUOUS profile on the NOMINAL window
      [2, 80] returns. The estimator does not see that: the >= 20-count floor
      truncates the window near h = 63 d at this frame count, and a shorter window
      sits where the profile is flatter, which RAISES the apparent decay length.
      The Monte Carlo gives 17.554 for the same hypothesis -- 31 sigma from the
      sealed prediction. Predicting for an idealisation of the estimator rather
      than the estimator is the same error class as revision 1's rule 7' mistake,
      one level down.
    basis: >-
      ★ THIS WAS A RULE 7' ERROR, CAUGHT BEFORE SEALING. `l_g_fitted` over the
      dense window was originally a single `implementation_check` against 13.375.
      It is not one: integrating d(phi Z)/dz = -phi/l_g with Z = Z_CS over this
      cell gives an APPARENT decay length of 15.442 d over [2, 80], +15.5 %,
      because Z > 1 extends the column. A 5 % check against 13.375 there would
      have called a correct result a bug. The prediction here comes from the CS
      ODE, so it is a hypothesis about the EOS, and the 8 % is the spread between
      the effective-diameter and nominal-diameter versions of that ODE.
    a_mismatch_means: >-
      A RESULT about the EOS, read a second and independent way: the dense-window
      decay length and the weighted-mean Z deviation are two different reductions
      of the same profile, so they must agree in sign.
  - id: P2
    quantity: Z_dilute_tail
    predicted: 1.0
    tolerance: "none in revision 4 -- reported as an equilibration diagnostic"
    role: measurement
    ★_demoted_in_revision_4_and_this_field_was_missed_once: >-
      A rule 7' correction, and the same field-level miss as P5: revision 4
      changed this role in the gate table and in the case and left THIS field
      saying `implementation_check`, so the analyzer went on gating it and
      reported IMPLEMENTATION FAILURE on A1. Caught by
      `tests/test_plan_is_implemented.py`.
      Why it is a measurement: Z -> 1 in the dilute tail is exact AT EQUILIBRIUM
      and not on a relaxing run, and equilibrium is what this campaign measures.
      Measured: 0.874 on A1 and 1.051 on B4 -- an 18 % spread between two seeds,
      with a within-run block SEM of 0.036, which is the tail being
      statistically thin rather than the gravity being wrong.
    ★_what_it_WAS_going_to_gate: >-
      With P1 demoted, this is the statistic that says the imposed gravity, the
      profile accumulation and the hydrostatic integral agree with each other. It
      is directly sensitive to the failure that matters: if the force used one
      l_g and the analysis divides by another, Z in the tail reads the RATIO
      rather than 1. Its 0.4 sigma of separation between the hypotheses is the
      point -- the dilute tail is ideal-gas either way, so this gate cannot be
      contaminated by the physics question, and equally can never support the
      verdict.
    ⚠_tolerance_widened_from_5_to_10_percent_in_revision_3: >-
      Measured bias -2.0 %, 3 sigma 8.6 % at the primary arm. The 5 % band was
      1.7 sigma and would have failed on a correct run about 7 % of the time per
      seed. See `design_power`.
    basis: >-
      Exact: with n = n0 exp(-z/l_g) the column above z is l_g n(z), so Z = 1
      identically. Costs nothing and catches a wrong cumulative sum, bin width or
      l_g. ★ It is also the sharpest EQUILIBRATION diagnostic available: measured
      on a 1 tau_sed pilot it read 1.046, and 14.32/13.375 = 1.069 -- the ratio of
      the still-relaxing decay length to the imposed one -- explains almost all of
      it.
    a_mismatch_means: "not equilibrated, or the hydrostatic read is wrong"
  - id: P3
    quantity: Z_dev_wmean_vs_CS_eff
    predicted: 0.0
    unit: percent
    tolerance: "2 % (inherited -- see threshold)"
    role: hypothesis
    basis: "the prior measurement of the same substitution, in a different geometry"
    a_mismatch_means: >-
      A RESULT: either the soft core does not stand in for a hard sphere in a
      density GRADIENT the way it does in a bulk fluid, or the prior finding does
      not transfer. Not a bug.
  - id: P3b
    quantity: phi_wall_measured_vs_cs_eff
    predicted: 0.1118
    tolerance: "5 %"
    role: hypothesis
    ★_the_THIRD_discriminator_and_the_cheapest: >-
      0.1118 +- 0.0019 if the mapping is required, 0.1029 +- 0.0018 if it is not:
      4.7 sigma at L_xy = 12 d and 7.5 at 24 d. One histogram bin, so it touches
      neither the hydrostatic integral nor the slope fit -- a different KIND of
      evidence (`A1`) rather than a restatement of P3. The ideal-gas start is
      0.1589, far above both, so arm C's approach is visible on the same number.
  - id: P4
    quantity: D_xy
    predicted: 1.0
    unit: d^2/tau_d
    tolerance: "20 %"
    role: implementation_check
    ⚠_tolerance_widened_from_10_to_20_percent_and_NOT_calibrated: >-
      This is a CLOCK check, and a wrong dt or a wrong D_0 is a factor, not a
      percent -- a 20 % band catches every failure it exists to catch. It was 10 %
      in revisions 1-2, which two observations (0.966 on a short run, 1.061 on the
      8 tau_sed pilot) put at about 1.7 sigma. ⚠ The design-power Monte Carlo
      generates a static profile and so says NOTHING about the lateral MSD: this
      tolerance rests on two observations and is named as uncalibrated rather than
      presented as measured.
    basis: >-
      x and y are unconfined and periodic, so the lateral MSD is 4 D t with
      D = D_0 = 1 in these units. Excluded volume at phi <~ 0.16 lowers the
      long-time value by a few percent, hence 10 %. ⚠ the VERTICAL MSD saturates
      at ~l_g^2 and is NOT fitted.
    a_mismatch_means: "the clock is wrong, which invalidates every time-based number"
  - id: P5
    quantity: profile_halves_chi2_nu
    predicted: 1.0
    tolerance: "none in revision 4 -- reported against the band [0, 2] as a guide"
    role: measurement
    ★_demoted_in_revision_4_and_this_field_was_missed_once: >-
      A rule 7' correction: drift is the EXPECTED signature of the losing
      hypothesis, since the verdict is which arm does NOT move. Measured 2.746 on
      B4 (the CS(phi_nominal) arm) against 1.516 on A1 -- exactly the intended
      signal, and an implementation_check would have called it a bug.
      ⚠ Revision 4 changed this role in the gate table and in the case and left
      THIS field saying `implementation_check`. Caught by
      `tests/test_plan_is_implemented.py`, which compares every sealed role
      against the role the case sets. Two copies of one declaration is two things
      to forget, and the document had both.
    ★_the_stationarity_test_and_the_whole_basis_of_the_verdict: >-
      chi^2 per degree of freedom between the profile over the first half of the
      production window and the second half, Poisson error on each. 1.0 if
      stationary. Since the verdict is "which arm does not move", this statistic
      IS the experiment, and `profile_half_shift_pct` beside it says which way a
      moving one moved.
    ⚠_the_run_could_not_produce_this_before_revision_3: >-
      The half-window histograms are accumulated during the run and `Build.gsd_path`
      is declared in `bdbot/run.py` and never read by it, so no trajectory is
      written and the split cannot be recovered afterwards. Revision 2's sealed
      plan required this comparison and the output could not support it -- found by
      reading the plan against the code, 12 minutes into the first production run,
      which was stopped rather than the plan being edited to match the code.
    ⚠_not_calibrated: >-
      The Monte Carlo's realisations are independent by construction, so a chi^2
      between two halves of them is 1.0 trivially. What it cannot give is the
      inflation from real temporal correlation between successive frames. [0, 2]
      is a sanity bound, not a calibrated test, and a value in [1, 2] will be
      reported as "consistent with stationary" rather than "stationary".
  - id: P6
    quantity: phi_wall_measured
    predicted: null
    role: measurement
    basis: >-
      No prediction. The ideal-gas value is 0.159 and the interacting equilibrium
      must be LOWER (Z > 1 extends the column), so this number is one of the
      things the run is for. Recorded so that the direction is checkable.

what_this_campaign_will_NOT_claim:
  - "anything about K_L = -2.80 in D = D_0(1 + K_L phi), the source's headline
     dynamical result. It is a HYDRODYNAMIC correction and free-draining BD with a
     scalar gamma cannot produce it -- not 'will probably miss it', cannot.
     Declared out of scope BEFORE the run (rule 7')."
  - "anything about the applied-field dipolar cluster physics, which is most of
     the paper. Zero field only."
  - "any phase behaviour. phi(wall) = 0.159 is far below freezing at 0.494."
  - "any statement about polydispersity. The paper reports < 5 %; this runs
     monodisperse."
  - "a finite-size EXPONENT. Two cross-sections can show the profile does not
     move; they cannot fit a scaling."
  - "that the paper's 'excellent agreement' has been reproduced. The paper gives
     no percentage, so there is nothing to reproduce TO -- our threshold is ours."

disclosures:
  - "★ TWO PILOTS WERE RUN BEFORE SEALING, and they were used for THREE things.
     They are `runs/sediment-pmma-3d__lxy12-t1-s1__e6c574cdf3` and
     `runs/sediment-pmma-3d__lxy12-t8-s1__e8158a40f5`: 1 and 8 tau_sed,
     L_xy = 12 d, **seed 1**, ideal-gas start. ⚠ Their specs predate the `init`
     parameter, so they carry `init: null` and cannot be regenerated by the
     current case -- they are archived evidence under a superseded spec shape,
     and no production run cites them. None of the eight sealed runs uses seed 1.
     Listing
     them individually because 'a pilot informed the design' is the sentence a
     pre-registration exists to prevent:
       (a) fixing `production_tau_sed`. The 1 tau_sed pilot's L4 drift check read
           7.1 sigma and the 8 tau_sed pilot's read 6.3 sigma, i.e. lengthening
           the run barely moved it -- which is what said the problem was the
           INITIAL CONDITION and not the duration.
       (b) CHANGING THE INITIAL CONDITION, which is the substantive design change
           of revision 2. The 8 tau_sed pilot reached phi(wall) = 0.1158 against
           an ideal-gas start of 0.1589 and a CS target of 0.1031, i.e. 77 % of
           the way, so ~25 tau_sed per seed would be needed and the primary arm
           would cost 4.7 h. The CS start plus the separate convergence arm is
           the response.
       (c) confirming the correctness gates fire at all. The pilot's
           Z_dilute_tail = 0.8958 and l_g_fitted (dense) = 16.09 are both OUTSIDE
           their bands, which is the correct behaviour for a run that has not
           equilibrated, and is how P2's role as an equilibration diagnostic was
           established."
  - "⚠ WHAT THE PILOTS DID NOT SET, each with the reason it did not:
       the 2 % threshold -- inherited from a prior finding, see `threshold`;
       the statistic's definition -- changed from max to weighted mean on a
         Poisson-noise calculation that uses only N, the bin width and the frame
         count, not any measured Z;
       P1b's 15.442 -- computed by integrating the CS hydrostatic ODE, which does
         not involve the pilot at all;
       P3's zero -- the prior finding's value.
     The pilot's own Z_dev_wmean_vs_CS_eff was -3.79 %, OUTSIDE the 2 % band.
     It is stated here so that a primary-arm result inside the band cannot be
     presented later as though nothing had ever fallen outside it."
  - "The primary statistic changed from the maximum to the weighted mean between
     `goal.yaml` being written and this document being sealed. The reason is a
     noise calculation that does not involve the measured values."
  - "★ REVISION 4 WAS WRITTEN AFTER TWO PRODUCTION RUNS HAD COMPLETED, and that
     is a weaker position than revision 3's. What was seen: A1 (cs_eff, seed 11)
     and B4 (cs_nominal, seed 21) finished before the campaign was stopped, plus a
     deliberate production-length pilot (seed 91, cs_eff). Their values are on
     record -- Z_dilute_tail = 0.874, 1.051 and 0.831 respectively. So the
     following must be read knowing that:
       (a) the two role demotions are rule 7' corrections whose ARGUMENT does not
           depend on the values: Z -> 1 in the tail holds at equilibrium and the
           runs are relaxing, and drift is the losing hypothesis's expected
           signature. Both would be true had nothing been run.
       (b) the block SEMs ARE measured from the pilot, deliberately, and that is
           the point of measuring them -- an error bar from the data is what A2
           asks for. No THRESHOLD was moved to accommodate a measured value; the
           two statistics whose thresholds would have failed had their ROLE
           corrected instead, which removes their verdict rather than widening it.
       (c) the pilot's scientific signal was seen: phi(wall) rose 8.9 % above the
           CS(phi_eff) start, to 6.6 sigma above BOTH candidates, with Z 3.7 %
           below CS(phi_eff) and 10.0 % below CS(phi_nominal). That points at the
           decision rule's pre-registered 'neither stationary' branch. It is
           disclosed rather than used: no prediction below was changed to match
           it, and P3's 2 % threshold and P1b's 16.45 are untouched."
  - "★ REVISION 3 CHANGED THE DESIGN AFTER REVISION 2 WAS SEALED, and the
     legitimacy of that rests on one fact: NO PRODUCTION RUN HAD COMPLETED. The
     first run was stopped at 20 % of its production window and no run directory
     held a `metrics.json`. Everything revision 3 changes was found by reading the
     sealed documents against the code and by a Monte Carlo on the two candidate
     profiles -- never by looking at an outcome. The three findings, in the order
     they were found:
       (a) the sealed plan's step 3 required a first-half/second-half profile
           comparison that the run output could not produce, because
           `Build.gsd_path` is declared and never read so no trajectory exists.
           The campaign was stopped rather than the plan edited to match the code.
       (b) the design-power calculation, which revisions 1-2 never did, found two
           correctness gates whose tolerance was narrower than their own noise --
           one of them at 82 % chance per seed of failing on a correct run -- and
           one hypothesis prediction wrong by 31 sigma.
       (c) the two candidate profiles, once written down as profiles, turned out
           to BE the experiment. That is the arm split."
  - "★ `l_g_fitted` was split in two between revision 1 and revision 2. In
     revision 1 it was a single `implementation_check` against 13.375 over the
     dense window -- a rule 7' error, because the CS hydrostatic profile's
     apparent decay length over that window is 15.442 d, so a correct result
     would have been reported as a bug. Revision 1 was never sealed; the split is
     P1 (tail, check) and P1b (dense, hypothesis)."
  - "The lateral box width is ours, tier 3, approved by the user on 2026-09-16
     against a cost table. It is the one parameter the paper does not fix."
  - "`T` and `eta` are DERIVED from the paper's own numbers, not stated by it.
     Only d, l_g, D_0 and phi are independent inputs, so recomputing l_g from T
     or D_0 from eta would be circular and no such check is made."

cost:
  #  A3: measured on this machine and this build, both sizes, with the neighbour
  #  list warm. Not extrapolated from one N -- 584 -> 2338 is a 4.04x slowdown at
  #  a 4.00x particle count, which is the number that makes the finite-size arm
  #  the most expensive of the three despite being the shortest.
  measured_rate_steps_per_s: {584: 8748.6, 2338: 2164.2}
  measured_at: "WCA + two Gaussian walls + gravity, dt = 1.5e-4, osx-arm64, CPU, no MPI"
  dt_gate_binding: "wca, at U = 8 kT (r = 0.800 d, F = 161 kT/d) -> dt_max = 1.85e-4"
  dt_chosen: 1.5e-4
  ⚠_dt_was_refused_once: >-
    dt = 2.0e-4 was REFUSED by the hard separation check at 1.08x the WCA gate.
    The gate was not relaxed to fit dt; dt was set from the gate.
  total_steps: 36_977_000
  total_core_hours: 1.671
  per_arm_core_hours: {cs_eff: 0.455, cs_nominal: 0.455, convergence: 0.303,
                       finite_size: 0.460}
  ⚠_this_is_LOWER_than_the_1.979_h_of_revision_2: >-
    Revision 3 spends 6 production seeds instead of 7 and one finite-size seed
    instead of two, and buys a DISCRIMINATING contrast with the difference. The
    design-power calculation is what licenses the reduction: at 15.6 sigma of
    separation per seed, the marginal seed adds nothing to the verdict and only
    to the error bar, so seeds were moved from replication into the second arm.
  how_this_was_obtained: >-
    Each run's n_prod read out of the spec the run will actually use, divided by
    the measured rate for that N. Nothing here is a product of hand arithmetic,
    which is the point: the predecessor cost table was typed and the 2338-particle
    arm had been extrapolated linearly from 584.
  ⚠_what_this_does_NOT_include: >-
    The RSA placement (a few seconds at N = 2338), the analysis, and the pilot
    runs already spent. And it is single-threaded wall time on one core: the eight
    runs are sequential because `--run` stops on the first non-zero exit, so an
    implementation failure in P1 costs 9 minutes rather than 2 hours.
  not_included_and_why: >-
    A dt/2 convergence replicate. The capability check already measured 1.575 %
    between dt = 5e-4 and 2e-4 on the non-interacting profile; with excluded
    volume the binding gate is the WCA core and a replicate would cost another
    1.3x the primary arm. Named as a choice, not an oversight.

revision_history:
  1: "never sealed. `l_g_fitted` was a single implementation_check against 13.375
      over the dense window -- a rule 7' error, because the CS hydrostatic ODE
      gives 15.442 d there. Split into a tail check and a dense hypothesis."
  2: "sealed into 8 run directories on 2026-09-16, and superseded the same day
      without any production run completing. Its defects are listed in the
      revision-3 disclosure above."
  5: "THIS FILE. Identical to revision 4 except that P2's and P5's vestigial
      `role:` fields now say `measurement`, matching the demotions revision 4
      already pre-registered in its gate table and its disclosure. The eight
      running runs are sealed against REVISION 4 -- see the banner at the top."
  4: "sealed into the 8 running run directories. Two rule 7' role corrections (`Z_dilute_tail` and
      `profile_halves_chi2_nu` from implementation_check to measurement), the
      primary statistic's sigma replaced by the run's own block SEM, and the
      block accumulation that makes that possible. Same arms, same seeds, same
      1.671 core-hours -- so the approval of revision 3 covers it, and the
      changes are disclosed above. Written after two production runs and one
      production-length pilot had been seen."
  3: "superseded the same day. Added `design_power`, splits the production seeds across the
      two candidate initial conditions, demotes P1, recalibrates P1b, P2 and P4
      from the Monte Carlo, adds P3b and P5, and costs 0.31 h less."

thin_margins_accepted:
  - "dt/dt_max[wca] = 0.81, i.e. a 1.2x margin. Reported by the report renderer as
     a thin margin and accepted: the alternative is 1.33x more steps for a gate
     that is already evaluated at a separation the run reaches with probability
     e^-8 = 3.4e-4."
  - "`finite_size_status: partial`. Two cross-sections, not a ladder, and the
     production point is not covered by a sweep."
  - "3 seeds per competing arm gives a seed-to-seed sd with nu = 2. Thinner than
     revision 2's nu = 4, and accepted because the design-power calculation says
     the verdict does not rest on it: the separation is 15.6 sigma PER SEED, so
     the seeds buy an error bar and protection against one bad realisation, not
     power. The within-run Poisson error (0.38 % on the primary statistic) is
     reported beside the seed-to-seed sd, and if the two disagree that
     disagreement is reported rather than averaged."
  - "ONE finite-size seed, down from two. It is a consistency check that does not
     enter the verdict, and it starts at CS(phi_eff) so it can corroborate only
     arm A."
  - "`D_xy` at 20 % and `profile_halves_chi2_nu` at [0,2] are NOT calibrated by
     the design-power Monte Carlo -- it generates a static, temporally
     uncorrelated profile. Both are sanity bounds. Named here rather than left
     looking as measured as the other four."
  - "One system size for the EOS itself. The profile is a one-body quantity, which
     is the reason this is acceptable and also the reason it is only a reason and
     not a proof."
