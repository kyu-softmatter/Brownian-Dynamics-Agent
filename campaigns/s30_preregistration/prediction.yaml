disclosures:
  - what: "pilot runs at the target coupling, seen before this document was written"
    detail: >-
      Three smoke runs at A_case = 34.938, N = 144, T_obs = 3 tau_B, r_c = 5
      a_mean: hex start psi6_local 0.6291 / psi6_global 0.4435; matched random
      start 0.5784 / 0.2897; random start in a square box 0.5521. The arms are
      separated in the expected direction at 3 tau_B.
    why_it_does_not_answer_the_question: >-
      3 tau_B is 33x shorter than the production window and N = 144 vs 400.
      Nothing has relaxed: the archived random-start runs at this same Gamma end
      at psi6_global 0.09-0.20 for N >= 256, so the random arm has most of its
      decay still ahead of it at 3 tau_B. The pilot fixes neither arm's endpoint.
    kept: "runs/soft-r3-2d-A-sweep__A34.938-smoke*"
  - what: "a timing probe at the control coupling"
    detail: "A_case = 106.224, T_obs = 0.5 tau_B, 17,091 steps in 8.4 s -> 2043.8 steps/s"
    why: "axiom A3 wants a measured cost, not an extrapolated one"
  - what: "the author knows the random-start answer, from the archive"
    detail: >-
      hexwin and ascan are read and quoted throughout this document. What is not
      known, and is not derivable from them, is the crystal-start answer.

