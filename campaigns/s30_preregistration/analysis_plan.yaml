schema: bdbot.analysis_plan/0.1
campaign: soft-r3-melting-hysteresis-S30
written: 2026-09-14
sealed_with: prediction.yaml

why_this_is_sealed_too: >-
  `bdbot.runcard.write_seal` refuses to seal a prediction without an analysis
  plan. Sealing the prediction alone leaves the choice of figure open, and the
  choice of figure is where a null result becomes a finding. Every figure and
  every comparison this campaign will produce is named below, before the data
  exists. Anything not named here is exploratory and will be labelled so.

# ─────────────────────────────────────────────────────────────────────────
figures:
  - id: F1
    title: "psi6_global(t), both arms, three seeds each"
    x: "t / tau_B, 0 to 100"
    y: "psi6_global = |<psi_6i>|"
    series:
      - "H: crystal start, 3 seeds, one line each"
      - "R: random start, 3 seeds, one line each"
      - "horizontal band: C1 (deep crystal reference) +- its block SEM"
      - "horizontal band: R's own last-quarter mean +- block SEM"
      - "horizontal line: PSI6_CRYSTAL_FLOOR = 0.5 -- the SURVIVED threshold"
    decides: P1
    what_is_wrong_should_be_visible: >-
      If the crystal arm is still descending at t = 100 tau_B, the lines are not
      flat, and the drift gate fires. A reader must be able to see that without
      reading the verdict.

  - id: F2
    title: "the paired comparison, one number with its error bar"
    content: >-
      Delta = <psi6_global>_H - <psi6_global>_R, with sigma from the seed
      scatter, drawn against the three pre-registered bands (3 sigma, 5 sigma)
      shaded. The verdict is read off the figure, not asserted beside it.
    decides: P1

  - id: F3
    title: "coordination and defects"
    content: >-
      Voronoi coordination histogram for H, R, C1, C2 at the end of the window,
      side by side; defect_fraction = 1 - f(6) annotated with the archived
      random-start value 0.285 from hexwin.
    decides: "P3, P4, and the qualitative reading of P1"

  - id: F4
    title: "the initial conditions, side by side"
    content: >-
      The t = 0 configuration of H (perfect 20x20 lattice) and R (RSA), and the
      t = 100 tau_B configuration of each, as scatter plots in the real
      rectangular box.
    why: >-
      A four-panel picture is how a reader checks that "crystal start" means
      what it says, and that the box is the same in both arms.

  - id: F5
    title: "sealed prediction vs measurement"
    content: >-
      One table: every prediction P1-P5, its sealed value and tolerance, the
      measurement, the deviation, the role, and the verdict. Generated by
      `tools/ledger.py` from the run records, not typed.
    why: >-
      This is the campaign's actual deliverable -- the first row of it that
      exists in this repository.

# ─────────────────────────────────────────────────────────────────────────
computations:
  psi6_global:
    from: "runs/<run_id>/observables.npz, column psi6_global"
    estimator: "freud.order.Hexatic(k=6, weighted=True) with Voronoi neighbours; |mean of the per-particle complex order|, per sample"
    decision_window: >-
      psi6_global_late = mean over samples 301-400 (75-100 tau_B). THE DECISION
      USES THIS, not the full window -- see prediction.yaml
      primary_statistic.window for why.
    also_reported: "the full-window mean, as a diagnostic only"
    error: "bdbot.stats.block_sem over the decision window (within-run), and the seed-to-seed sd (between-run). Both reported; the decision uses the seed-to-seed one."
  defect_fraction:
    from: "runs/<run_id>/metrics.json -> result.coord_hist"
    definition: "1 - coord_hist[6]"
    ⚠_corrected_before_sealing: >-
      This said `extra.coord_hist`. There is no `extra` key in metrics.json:
      `bdbot/run.py` writes what `finalize()` returns under `result`. A plan
      that reads a key which does not exist is unexecutable, and the error would
      only have surfaced after the runs were done.
  drift_gate:
    definition: >-
      |mean(Q4) - mean(Q3)| > 3 * sqrt(block_sem(Q3)^2 + block_sem(Q4)^2),
      Q3 = samples 201-300, Q4 = samples 301-400. Report tau_int beside it.
    ⚠_corrected_before_sealing: >-
      The denominator was `3 * block_sem(last 200)` -- the SE of one 200-sample
      mean, for a statistic that is the difference of two 100-sample means.
      Measured false-positive rate on stationary data: 15-41 % depending on
      tau_int; 0.4-4.2 % with the SE of the difference.
  Delta:
    definition: "mean over 3 seeds of H's psi6_global_late, minus the same for R"
    sigma: "sqrt(sd_H^2/3 + sd_R^2/3), sd = sample sd over the 3 seeds (ddof=1)"

# ─────────────────────────────────────────────────────────────────────────
order_of_operations:
  - "1. Verify the seal on every run directory (`bdbot.runcard.verify_seal`) BEFORE reading any number."
  - "2. Evaluate P2 and P3 -- the controls. If either fails, STOP: P1 is void and the campaign reports a protocol failure, not a physics result."
  - "3. Apply the drift gate to H. If it fires, the verdict is INCONCLUSIVE and the bands are not consulted."
  - "4. Only then compute Delta and read the band."
  - "5. Evaluate P4 and P5 and report them whatever P1 said."
  why: >-
    Fixed in advance so that the controls cannot be re-read after the primary is
    known. The first three steps can each end the analysis.

# ─────────────────────────────────────────────────────────────────────────
not_in_this_plan:
  - "any fit of g_6(r)"
  - "any finite-size exponent eta_6 -- one system size is run"
  - "any dynamic Lindemann parameter -- not implemented in this repository"
  - "any phase NAME for the H arm beyond ordered / not ordered"
  - >-
    any re-run at a different A chosen after seeing these results, presented as
    part of this campaign. A follow-up sweep is a new pre-registration.

failure_modes_this_plan_accepts:
  - >-
    Three seeds per arm is few. The 5 sigma band and the explicit INCONCLUSIVE
    band exist because of it, not in spite of it.
  - >-
    100 tau_B may be too short for the crystal arm. The drift gate detects that
    and reports it rather than absorbing it into a verdict.
  - >-
    One system size means a SURVIVED verdict cannot distinguish a true
    thermodynamic phase from a finite-size-stabilised crystal. Stated in the
    conclusion either way.
