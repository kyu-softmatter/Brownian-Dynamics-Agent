# S2 PREDICTION — pre-registration, **stage 2** (a sequential design)
#
# ⚠ This file is sealed before S5 runs (SEALED.sha256). No editing after the run.
#
# ★★ This is stage 2 of a sequential design. Stage 1 (k=256) ended INCONCLUSIVE, and
#   the cause of that failure was identified: **the input to stage 1's design power
#   was a biased pilot value.**
#   Stage 2's k was recomputed from stage 1's trustworthy estimate (k=254).
#
# ★ **There is no stage 3.** Whatever comes out at k=1536 is the answer. Raising it
#   until it turns significant is optional stopping, and then σ means only "a lot was
#   run".

question: >
  In the soft-r3 2D system, does the initial-placement→steady-state defect
  relaxation time τ differ between A=0.1 and A=1.

stage: 2
parent_run: runs/2026-07-29_soft-r3-relax-seeds        # stage 1 (k=256, INCONCLUSIVE)
grandparent_run: runs/2026-07-29_soft-r3-time-resolved  # the k=16 pilot

# --- why stage 1 failed -------------------------------------------------------
stage1_postmortem:
  predicted_sigma: 4.19
  observed_sigma: 1.61
  verdict: "INCONCLUSIVE (one of the pre-registered outcomes)"
  cause_1_biased_diff:
    k16_diff: 0.010897
    k254_diff: 0.0069625
    change_pct: -36.1
    note: >
      A low-seed bias. τ at A=1 decreased monotonically: k=4 → 0.0613,
      k=16 → 0.0420, k=254 → 0.0367. Stage 1's prediction named this scenario in its
      alternatives ③.
      Cause hypothesis: in an exponential fit τ and the amplitude are correlated, and
      the noise pulls τ upward. As the seed-mean curve's noise shrinks as 1/√k, so
      does that bias.
  cause_2_underestimated_se:
    se_ratio_bootstrap_over_fit_A0.1: 1.43
    se_ratio_bootstrap_over_fit_A1: 1.5488
    note: >
      The curve_fit covariance underestimated the seed-to-seed variation by
      1.4-1.6x. Stage 1's se_ratio item (1.0 ± 1.5) passed, but **it departed
      significantly from 1** -- meaning neither the 1.05σ from the k=16 era nor the
      curve_fit-based 2.48σ at k=254 can be trusted.
  arithmetic_check: >
    4.19 × (0.006964/0.010897) / 1.55 = 1.72 ≈ the observed 1.61.
    The two causes account quantitatively for the prediction-observation gap.

# --- stage 2's design power: from a trustworthy input -------------------------
design_power:
  prior_k: 254                    # ★ based on 254, not 16 — the difference from stage 1
  prior_diff_tau_d: 0.0069624990569
  prior_se_diff_tau_d: 0.0043207073039   # the bootstrap SE (not curve_fit)
  prior_sigma: 1.6114
  k_for_3sigma: 886
  k_chosen: 1536
  k_chosen_expected_sigma: 3.9627
  k_chosen_rationale: >
    886 is the 3σ lower bound and 1536 gives 3.96σ, leaving margin. The margin is
    taken because of what stage 1 taught -- the estimate may still move a little
    further. Cost 3072 runs ≈ 7 min.
  cost_runs: 3072
  cost_wall_min_estimate: 6.8

decision_rule:
  primary_statistic: tau_relax_diff_sigma
  se_source: bootstrap_over_seeds
  threshold_sigma: 3.0
  verdict_if_above: "DIFFERENT — τ depends on A even deep in the liquid region"
  verdict_if_below: >
    INCONCLUSIVE — indistinguishable even at k=1536. Not a proof of equality but
    "a difference of this size cannot be seen with this sample". **Stage 3 is not
    run.**
  n_resample: 400
  bootstrap_seed: 20260729
  no_stage_3: true

items:
  - quantity: tau_relax__A0.1
    value: 0.0297528
    tolerance: ±0.003
    basis: >
      k=254 measured 0.029750 ± 0.001000 (bootstrap). Raising k 6x must leave the
      central value unmoved -- this A has an amplitude/noise of 44x, so the bias is
      already small. The tolerance is 3x the k=254 SE.
    discriminates: had the τ estimate at A=0.1 already converged at k=254
  - quantity: tau_relax__A1
    value: 0.0367153
    tolerance: ±0.013
    basis: >
      k=254 measured 0.036714 ± 0.004200. ★ This value has decreased monotonically
      over k=4 → 16 → 254 (0.0613 → 0.0420 → 0.0367). If it keeps falling the
      difference shrinks further and INCONCLUSIVE is reinforced. The tolerance is 3x
      the k=254 SE -- that scenario is left open.
    discriminates: is τ at A=1 still falling with the seed count (residual low-seed
      bias)
  - quantity: tau_relax_diff_sigma
    value: ">3"
    tolerance: ">3"
    basis: "3.96σ if the difference holds at k=1536. The run's first-class prediction."
    discriminates: does τ differ between A=0.1 and A=1
    competing_value: "under 3σ — either the difference is smaller than observed or a bias remains"
  - quantity: tau_relax_diff
    value: 0.0069625
    tolerance: ±0.004
    basis: >
      The difference itself. The k=254 observation is predicted as is. If this value
      keeps shrinking, the low-seed bias had not fully vanished even at k=254 -- and
      that is this run's second result.
    discriminates: had the bias converged at k=254
  - quantity: se_ratio_bootstrap_over_fit__A1
    value: 1.5488
    tolerance: ±0.5
    basis: >
      k=254 measured 1.55. This checks whether the ratio holds independently of k --
      if it does, one can say "the curve_fit SE structurally underestimates by 1.5x
      in this fit", and that is a result applying beyond this system.
    discriminates: is the curve_fit SE underestimate structural or sampling noise
  - quantity: init_config_failures_per_1000_seeds
    value: 7.8
    tolerance: ±6
    basis: >
      In stage 1, 2 of 256 seeds (61, 110) failed to produce an initial placement by
      rejection sampling (min_sep = 0.8 d, 20000 tries). That is 7.8/1000. 12±4
      expected at k=1536.
      **What matters is that this is independent of A** -- the same seeds failed at
      both A values.
    discriminates: is the initial-placement failure independent of A (it has to be,
      or it creates a bias)

alternatives:
  - >
    The most likely outcome is barely crossing or barely missing 3σ (3.96σ is
    expected, but in stage 1 the expectation was 2.6x optimistic). On a miss it closes
    as INCONCLUSIVE and stage 3 is not run -- chasing a 20 % difference with seeds has
    diminishing returns.
  - >
    Physically, a difference existing is the natural expectation. τ increases
    monotonically over A=0.1 → 1 → 10 (0.0298 → 0.0367 → 0.0982) and A=10 already
    separated at 4.7σ.
    ⇒ Even with this run INCONCLUSIVE, the "monotonic trend" claim is held up by
    A=10.
  - >
    This run does not change the dimensionless physics -- the same system, the same
    dt, the same box, only different seeds. All it gains is the error bar. dt
    convergence and N convergence are still unrun, and this run does not stand in for
    them.
