# S2 PREDICTION — pre-registration
#
# ⚠ This file is sealed before S5 runs (SEALED.sha256). No editing after the run.
#
# ★★ The point of this run is **fixing the sample size in advance.**
#   Raising the seed count until it turns significant is optional stopping, and then
#   the σ distance reflects only the fact that a lot was run -- it is not evidence.
#   The target k was computed before running, with
#   simbot.estimators.seeds_for_target_sigma.

question: >
  In the soft-r3 2D system, does the initial-placement→steady-state defect
  relaxation time τ differ between A=0.1 and A=1. The prior observation (16 seeds)
  could not tell them apart: diff = +0.01090 ± 0.01041 τ_d = 1.05σ.

parent_run: runs/2026-07-29_soft-r3-time-resolved
parent_finding: knowledge/wiki/findings/coarse-sampling-hides-the-whole-transient.md

# --- design power: computed before running -----------------------------------
design_power:
  prior_k: 16
  prior_diff_tau_d: 0.010897
  prior_se_diff_tau_d: 0.010407
  prior_sigma: 1.047
  basis: >
    SE ∝ 1/√k, so k_needed = k_current · (target quantile / current σ)².
    A t correction is applied -- at small k the SE itself swings by 41 %, so the
    normal quantile underestimates
    (findings/tolerance-from-a-4-seed-se-is-not-a-3-sigma-test.md).
    Computed with simbot.estimators.seeds_for_target_sigma.
  k_for_2sigma: 61
  k_for_3sigma: 137          # includes the t(ν) correction. 132 on a normal z=3
  k_at_64_sigma: 2.09        # ★ the 64 the user proposed does not reach 3σ
  k_chosen: 256
  k_chosen_rationale: >
    4.19σ if the observed difference is the true one. If the true difference is half
    the observed one it falls to 2.1σ, and INCONCLUSIVE coming out in that case is
    the honest outcome -- that too was decided in advance.
    At a cost of 780 runs ≈ 150 s, the margin was worth taking.

# --- the decision rule: fixed before running ---------------------------------
decision_rule:
  primary_statistic: tau_relax_diff_sigma      # (τ_A1 − τ_A0.1) / SE_diff
  se_source: bootstrap_over_seeds              # ★ NOT the curve_fit covariance
  se_rationale: >
    fit_relaxation's tau_se is the fit uncertainty of *one seed-mean curve*.
    This repository's convention is that "the seed ensemble is the honest error
    estimate", so what is used is the spread of the distribution obtained by
    resampling the seeds and refitting (bootstrap_relaxation_over_seeds).
  threshold_sigma: 3.0
  verdict_if_above: "DIFFERENT — τ depends on A"
  verdict_if_below: "INCONCLUSIVE — indistinguishable at this seed count (not a proof of equality)"
  n_resample: 400
  bootstrap_seed: 20260729

items:
  - quantity: tau_relax__A0.1
    value: 0.031104
    tolerance: ±0.008
    basis: >
      16 seeds measured 0.031104 ± 0.002793. Raising the seeds 16x must leave the
      central value unchanged (if there is no bias). The tolerance is about 3x the
      16-seed SE -- the central value moving more than that means the low-seed
      estimate was biased.
    discriminates: is the low-seed τ estimate biased
  - quantity: tau_relax__A1
    value: 0.042003
    tolerance: ±0.030
    basis: >
      16 seeds measured 0.042003 ± 0.010033. ★ This value already moved by more than
      1σ, from 0.061 at 4 seeds to 0.042 at 16. A low-seed bias is suspected, so the
      tolerance is kept wide (3x the 16-seed SE). Kept narrow it would fail to detect
      the bias and produce nothing but a FAIL.
    discriminates: does τ at A=1 keep moving with the seed count
  - quantity: tau_relax_diff_sigma
    value: ">3"
    tolerance: ">3"
    basis: >
      If the observed difference holds at k=256, 4.19σ is expected. This is the
      run's first-class prediction.
    discriminates: does τ differ between A=0.1 and A=1
    competing_value: "the difference is under 3σ — the true difference is smaller than observed"
  - quantity: se_ratio_bootstrap_over_fit__A1
    value: 1.0
    tolerance: ±1.5
    basis: >
      The ratio of the bootstrap SE to the curve_fit SE. Close to 1 means the two
      error estimates agree and the prior run's 1.05σ was trustworthy. Far from it
      means **the fit uncertainty did not represent the seed-to-seed variation**, and
      then the 1.05σ was itself meaningless.
    discriminates: was the prior run's σ distance trustworthy in the first place
  - quantity: defect_at_t0
    value: 0.5150
    tolerance: ±0.02
    basis: >
      The initial-placement defect fraction. It has to be unchanged going from 16
      to 256 seeds -- it is set by the rejection sampling (min_sep = 0.8 d) and does
      not depend on A.
    discriminates: does initial-placement generation give the same statistics
      regardless of seed count

alternatives:
  - >
    INCONCLUSIVE is possible. If the true difference is half the observed one
    (0.0109), even k=256 gives 2.1σ. In that case it does not say "they are equal" --
    indistinguishable is not a proof of equality.
  - >
    The relaxation amplitude at A=1 is only 4.1x the noise (11.7x at A=0.1, 10.6x
    at A=10). It is where the signal determining τ is weakest, so the SE is largest.
    Raising the seeds shrinks the seed-mean curve's noise as 1/√k and improves the
    amplitude/noise ratio -- that is this run's mechanism.
  - >
    A possible low-seed bias. τ at A=1 was 0.0613 at k=4 and 0.0420 at k=16. If the
    decrease is monotonic it could fall further at k=256, and then the difference
    from A=0.1 **shrinks** (= reinforcing INCONCLUSIVE). That scenario is left open
    by the wide tolerance on tau_relax__A1.
  - >
    This run does not change the dimensionless physics -- the same system, the same
    dt, the same box, only different seeds. All it gains is the error bar.
