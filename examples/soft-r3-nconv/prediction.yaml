alternatives:
- '★ The most important competing hypothesis: that ψ₆ = 0.248 at A=10 is the
  **finite-size floor**. If p ≈ 0.5 comes out, card §8.3''s ''hexatic-like'' reading
  has to be weakened -- it would mean 0.248 was merely the floor at N=100.'
- 'Two points cannot verify the power-law **form**. Only the exponent is extracted,
  and that limit is carried by psi6_finite_size_exponent''s n_points. Discussing the
  form needs three or more (N=64, 144, 400, say).'
- A=0.1 and A=1 should give p ≈ 0.5 (they are deep liquids). If those come out small
  too, the exponent estimate itself is wrong -- so **A ≤ 1 serves as the control.**
- Energy per particle cannot be compared directly between N values -- power_law_table
  shifts U(r_cut) to 0, so changing r_cut changes the shift. It is recorded but not
  raised as a prediction item.
- The coverage control (3.71 %) is **not run.** The reduced config is bit-identical,
  so it is an arithmetic identity -- pinned by
