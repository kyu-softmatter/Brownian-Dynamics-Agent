  HOOMD Brownian reproduces bit-for-bit, which would make the late-window comparison
  an arithmetic identity.
- INCONCLUSIVE expected — 'it reached equilibrium' cannot be decided by this run. In
  the prior run the ψ₆ drift at A=10 was −0.013 ± 0.008 (1.6σ), indistinguishable
  from 0, and indistinguishable means 'not visible at this length', not
  'equilibrium'.
- INCONCLUSIVE expected — the ψ₆ difference between A=0.1 and A=1 (0.049 vs 0.063) is
  below the finite-size floor (1/√N = 0.1). Their orientational order can only be
  called 'absent in both'.
- N=100 does not satisfy A=10's r_cut requirement (N ≥ 252, card §9).
  βU(r_cut) = 0.09 kT remains in the A=10 result — an N-convergence check is outside
  this run's scope.
- The reference discs overlapping at A=0.1 is a property of the model, not a code
  error. Removing the overlap would require dropping the coverage below 3.71 %, and
  then the dimensionless result is unchanged and only τ_d moves.
