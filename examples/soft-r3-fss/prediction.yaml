alternatives:
- ★ The case where the form breaks (χ²/dof > 3) carries the most information. It
  would void the claim that 'A=10 is not a hexatic' made from a single exponent, and
  card §8.5 would have to be weakened again. That possibility is left open.
- N=64 has L* = 8, so r_cut = 3.80 is 95 % of L/2 — almost no minimum-image margin.
  If that point dominates the residuals it has to be re-examined with 3 points
  (144, 256, 400).
- The p at A=10 may come out different from the two-point run. Three axes (r_cut, run
  length, seeds) change at once, so on a mismatch **this run alone cannot tell which
  axis caused it** -- that would need runs that revert one axis at a time.
- This run does not scan the hexatic window (A = 10.03-10.75). Method verification
  comes first; only once the form is confirmed can the η₆ of that window be
  believed.
