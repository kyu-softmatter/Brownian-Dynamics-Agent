# S2 PREDICTION — the answer is written down before the simulation
#
# ⚠ This file is sealed before S5 runs (SEALED.sha256). No editing after the run.
# Every number is the output of a simbot function — no hand calculation:
#   simbot.spec.derive · simbot.estimators.euler_maruyama_trap_variance_bias
#   simbot.analysis.trap.em_uniform_noise_excess_kurtosis
#
# tolerance forms: ±X% (relative to the prediction) · ±X (absolute) · >X / <X (one-sided)
# competing_value: the competing hypothesis. Used for the design power |pred-competing|/SE.

items:
  - quantity: var_x_star
    value: 1.0025062656641603
    tolerance: ±1%
    basis: Euler-Maruyama stationary variance 1/(1-dt*/2). estimators.euler_maruyama_trap_variance_bias
    discriminates: whether the integrator scheme is EM or exact
    competing_value: 1.0
  - quantity: var_x_nm2
    value: 414.19469999999995
    tolerance: ±1.5%
    basis: equipartition <x^2> = kT/k (exact, no approximation). Independent of a and eta
    discriminates: set by k and T alone — independent of the assumptions
    unit: nm^2
  - quantity: var_r_nm2
    value: 828.3893999999999
    tolerance: ±1.5%
    basis: <r^2> = d kT/k
    discriminates: the dimension (2D vs 3D differ by a factor 3/2)
    unit: nm^2
  - quantity: msd_plateau_star
    value: 4.010025062656641
    tolerance: ±2%
    basis: 'MSD(t->inf) = 2d <x*^2> (reduced units).  ★ <x*^2> carries the EM bias,
      so the plateau is high by the same amount: 2d(1+bias) = 4 x 1.0025063 = 4.010025.
      Predicting exactly 2d = 4 is off by 3.54 sigma — that is leaving a known bias
      out of the prediction, and the wide tolerance (±2%) hides it as a PASS
      (found 2026-07-28)'
    note: 'plateau and <x*^2> are independent paths (time series vs snapshot) but
      **they share the same bias**. Path independence is checked separately by
      plateau_over_2d_var'
  - quantity: tau_star
    value: 1.0
    tolerance: ±5%
    basis: tau_fit/tau_trap = 1 (by definition in the card's units)
    discriminates: does the MSD fit recover gamma/k
  - quantity: tau_trap_ms
    value: 8.064405509911927
    tolerance: ±5%
    basis: tau_trap = gamma/k = 6 pi eta a / k. Linear in eta and a
    discriminates: the only window that verifies eta and a
    unit: ms
  - quantity: msd_r_squared
    value: '>0.99'
    tolerance: '>0.99'
    basis: the MSD has the single-exponential form plateau(1-exp(-t/tau))
  - quantity: kT_conf_star
    value: 1.0
    tolerance: ±2%
    basis: configurational temperature <|grad U|^2>/<lap U> = kT. guards.configurational_temperature
    note: in a pure harmonic trap this is algebraically identical to the <x^2> check — not an independent check
  - quantity: plateau_over_2d_var
    value: 1.0
    tolerance: ±1%
    basis: 'self-consistency: MSD plateau (time series) / 2d<x^2> (snapshot) = 1'
    discriminates: an error in the analysis code — two independent paths disagreeing means a code problem
regimes:
  k_star_sigma: 241432.3505346641
  l_trap_over_sigma: 0.002035177387846081
  tau_D_over_tau_trap: 241432.35053466403
  note: k*_sigma is 5.4 decades away from the boundary (~1) — extremely strong confinement. Excluded volume is irrelevant to the dynamics.
alternatives:
  - At large dt*, <x*^2> comes out high by 1/(1-dt*/2) = 1.00251 — that is correct behaviour.
  - The position-distribution kurtosis is 2.9940, not exactly 3 (HOOMD's noise is uniform). Exactly 3.000 would be the suspicious outcome.
  - tau_trap disagreeing with the prediction signals that either the eta assumption or the a interpretation (A2) is wrong. <x^2> is unaffected, so the two can be told apart.
  - 'INCONCLUSIVE expected: for var_x_star the 0.25 % EM bias is smaller than the
    statistical error (4 seeds, ~0.45 %), so it cannot be told apart from the exact
    scheme. A limit foreseen in advance.'
