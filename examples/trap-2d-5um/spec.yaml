card: passive-sphere--harmonic-trap
question: 'Quantify the thermal fluctuation of a 5 um-radius particle held in this optical trap and compare against the analytic solution. Side check: does tau_D-based non-dimensionalization actually fail for this system.'
geometry:
  dim:
    value: 2
    provenance: inference
    basis: the expression r = sqrt(x^2+y^2) has no z, and only the x,y axes are drawn
    confidence: medium
    ambiguity: A1
  boundary:
    value: periodic
    provenance: rule
    basis: a single confined particle. The box only has to be much larger than l_trap, and no wall is needed
  box_over_ref:
    value: 200.0
    unit: l_trap
    provenance: rule
    basis: l_trap = 20.35 nm, so L = 4.07 um. Trap card §7 gate (L >> l_trap)
species:
  - name: probe
    n_simulated:
      value: 1000
      provenance: rule
      basis: non-interacting, so 1 snapshot = 1000 independent samples (the Barakat 2022 approach, [source, not reproduced]). Effective sample measured at 996/1000
    radius_si:
      value: 5.0e-06
      unit: m
      provenance: from_drawing
      basis: the R = 5 um leader line points directly at the circle
      confidence: medium
      ambiguity: A2
    density_si:
      value: 1050.0
      unit: kg/m^3
      basis: polystyrene. Used only for the overdamped check; no effect on the BD dynamics
      confidence: low
      sensitivity: none
    n_physical:
      value: 1
      provenance: from_drawing
      basis: one circle in the drawing
medium:
  T_si:
    value: 300.0
    unit: K
    provenance: from_drawing
    basis: T = 300 K (~27 C) stated explicitly
  eta_si:
    value: 0.00085566
    unit: Pa*s
    basis: IAPWS table interpolation (not extrapolation). knowledge/wiki/concepts/water-298k.md
    confidence: medium
    affects:
      - tau_trap
      - D0
  rho_fluid_si:
    value: 996.5
    unit: kg/m^3
    basis: same source. Used only for the Reynolds check
    confidence: medium
  species:
    value: water
    basis: the standard medium for a colloidal optical-tweezer experiment. Not stated in the drawing
    confidence: medium
friction:
  note: 'Unbounded-medium Stokes. A wall within 5a = 25 um would need a Faxen correction, but there is no wall in the drawing. Limits: knowledge/wiki/concepts/stokes-drag-corrections.md'
external:
  - kind: harmonic_trap
    params:
      k_si:
        value: 1.0e-05
        unit: N/m
        provenance: from_drawing
        basis: k_t = 10 pN/um = 10e-12 N / 1e-6 m
      center_si:
        - 0.0
        - 0.0
        - 0.0
      active_axes:
        - true
        - true
        - false
    implementation: simbot.forces.HarmonicTrap (md.force.Custom)
    note: center is the drawing's "potential trap at (0,0)"
timing:
  equil_in_tau:
    value: 10.0
    unit: tau_trap
    provenance: rule
    basis: t_equil >= 10 tau_trap (card §7)
  prod_in_tau:
    value: 40.0
    unit: tau_trap
    provenance: derived
    basis: simbot.estimators.trap_run_length(n=1000, rel_err=0.01)
  sample_interval_in_tau:
    value: 2.0
    unit: tau_trap
    provenance: rule
    basis: secures independence along time
  target_precision:
    value: 0.01
    provenance: rule
    basis: the target relative statistical error on <x^2>
numerics:
  dt_star:
    value: 0.005
    unit: tau_trap
    provenance: rule
    basis: Euler-Maruyama systematic bias = 1/(1-dt*/2)-1 = +0.251 %. One quarter of the 1 % target statistical precision
  n_seeds:
    value: 4
    provenance: rule
    basis: config/run_policy.yaml. Efficiency is 93 % for k<=4, so 4 seeds cost about the same as 1
gates:
  overdamped:
    status: pass
  stokes_reynolds:
    status: pass
  equipartition:
    status: required
    reason: this card's first-class gate
  em_bias_reproduced:
    status: required
    reason: <x*^2> = 1/(1-dt*/2)
  configurational_temperature:
    status: required
  dt_over_tau_trap:
    status: pass
    reason: dt* = 5e-3 <= 1e-2
  box_much_larger_than_l_trap:
    status: pass
  equilibration_detection:
    status: applicable
    reason: it reaches thermal equilibrium
  step_displacement_vs_sigma:
    status: 'off'
    reason: no pair interaction, so overlap cannot occur
  r_cut_le_half_box:
    status: 'off'
    reason: no pair potential
  polydispersity:
    status: 'off'
    reason: no interaction, so crystallization is impossible
  hydrodynamics_neglected:
    status: pass
    reason: a single particle with no wall → unbounded-medium Stokes is exact
tier: explore
