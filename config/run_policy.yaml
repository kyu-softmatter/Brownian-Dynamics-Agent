# =============================================================================
#  Simulation run policy  —  Simulation Bot
# =============================================================================
#  This file is the single source of truth for "the simulation conditions".
#
#  ▸ The agent reads this file on every run, presents the condition table, then runs.
#  ▸ There is **exactly one** place a human edits: the `overrides:` block at the
#    bottom. Whatever is written there overrides every default above.
#  ▸ A value tagged `measured:` is a measurement. Do not touch it unless the
#    hardware changed. (To re-measure: the procedure in master_plan.md §7.3)
#
#  Basis: master_plan.md §7.3 (the CPU measurement), §7.4 (deriving the conditions)
#         knowledge/parameters/local_cpu_parallelism.md (the raw data)
# =============================================================================

meta:
  version: 1
  measured_on: "2026-07-28"
  machine: "Apple M4 (Mac16,12) · 4 P-core + 6 E-core · 16 GB"


# -----------------------------------------------------------------------------
# 1. Measured hardware values  [measured — do not change]
# -----------------------------------------------------------------------------
hardware:
  n_cores_total: 10
  n_cores_performance: 4
  n_cores_efficiency: 6
  e_core_relative_speed: 0.32      # measured: effective E-core / P-core performance

  # The throughput constant. The basis for wall-time prediction:
  #   wall ≈ N * steps / (throughput * eta_k)
  # ⚠ The exponent sign is mandatory (`6.3e+6`). YAML 1.1 reads `6.3e6` as a
  #   **string**, and then the cost estimate either raises a quiet TypeError or
  #   silently does string arithmetic.
  #   load_policy() rejects a string that looks like a number (simbot/policy.py).
  throughput_particle_steps_per_s: 6.3e+6   # measured, within ±9% for N=500-32000

  # Per-process efficiency eta_k at concurrency k  [measured]
  efficiency_by_k:
    1:  1.000
    2:  0.948
    3:  0.926
    4:  0.925
    5:  0.774
    6:  0.696
    8:  0.617
    10: 0.547
    12: 0.443     # a total-throughput regression against k=10. Do not use

  # HOOMD parallelization availability [measured]
  hoomd_mpi_enabled: false         # conda-forge has no MPI build at all
  hoomd_threads_per_sim: 1         # TBB removed in v3+. Entirely single-threaded
  gpu_available: false


# -----------------------------------------------------------------------------
# 2. Concurrency policy
# -----------------------------------------------------------------------------
concurrency:
  default: 8            # 90% of peak throughput. Leaves 2 cores for the analysis,
                        # the agent and the OS
  interactive: 4        # while the user is working alongside. P-cores only, 93%
  batch: 10             # unattended. Absolute peak throughput
  hard_max: 10          # never exceed (a -2.7% regression measured at k=12)

  # Downgrade to interactive when the user appears to be running something heavy
  auto_downgrade_when_busy: true


# -----------------------------------------------------------------------------
# 3. The central policy: error bars are free
# -----------------------------------------------------------------------------
# Efficiency is 93% for k<=4, so running 4 independent seeds concurrently costs
# about the same as running 1. So "4 short runs" beats "1 long run" almost always.
seeds:
  default: 4            # user decision 2026-07-28 ("four seems enough")
  minimum: 4            # a single-seed production run is forbidden (no error bar)
  explore_tier: 2       # T2 exploration prioritizes more sweep points, so 2 seeds
  report_spread: true   # always report the seed spread as a systematic-error indicator

  # Note: lab practice uses more — Xu 2023 averages 20 realizations
  #   (knowledge/wiki/findings/lab-bd-conventions.md §5, reproduced: no).
  #   Start with 4, and raise it when an S7 verdict comes out INCONCLUSIVE.
  #   An 8-seed T2 batch at k=8 is about 1.7 min, so escalating is cheap.
  escalate_to: 8        # the seed count to propose automatically on INCONCLUSIVE


# -----------------------------------------------------------------------------
# 4. Run tiers
#    wall_s_per_proc = N * steps / (throughput * eta_k)
#    t_total_tau_B   = steps * dt_star
# -----------------------------------------------------------------------------
tiers:

  smoke:                        # T0 — only checks that the code runs
    purpose: "code-path check. No physical meaning"
    N: 200
    steps: 2_000
    dt_star: 5.0e-5
    concurrency: 1
    seeds: 1
    expected_wall_s: 0.06
    required_before: [pilot]

  pilot:                        # T1 — the mandatory S5-2 stage
    purpose: "check for guard violations and dt validity + predict the real run's wall time"
    N: from_spec                # identical to production
    steps_fraction_of_production: 0.005
    dt_star: from_spec
    concurrency: 1
    seeds: 1
    wall_cap_s: 30              # stop immediately and report if exceeded
    mandatory: true             # cannot be skipped

  explore:                      # T2 — regime exploration / parameter sweep
    purpose: "identify the regime in dimensionless space. Not a precise measurement"
    N: 1_000
    steps: 400_000
    dt_star: 5.0e-5
    concurrency: 8
    seeds: 2
    expected_wall_s_per_proc: 103
    note: "an 8-point sweep is about 1.7 min. Ideal for mapping a regime"

  production:                   # T3 — the default tier
    purpose: "the real measurement. The data S7 verifies"
    N: 4_000
    steps: 1_000_000
    dt_star: 5.0e-5
    concurrency: 4
    seeds: 4
    expected_wall_s_per_proc: 686
    note: "4 seeds concurrently → about 11.4 min. t_total = 50 tau_B"

  long:                         # T4 — approval required
    purpose: "full-band GSER / MIPS coarsening / long-time diffusion in a dense system"
    N: 4_000
    steps: 10_000_000
    dt_star: 5.0e-5
    concurrency: 4
    seeds: 4
    expected_wall_s_per_proc: 6860
    requires_user_approval: true


# -----------------------------------------------------------------------------
# 5. Budget and gates
# -----------------------------------------------------------------------------
budget:
  wall_time_per_run_s: 600            # 10 min. Report before running if exceeded
  wall_time_per_batch_s: 1800         # 30 min
  on_exceed: report_and_ask           # report_and_ask | shrink | abort
  disk_per_run_mb: 2000               # GSD trajectory cap. Widen the dump interval
                                      # if exceeded

  # A system seen for the first time cannot skip this order
  required_tier_ladder: [smoke, pilot, explore]


# -----------------------------------------------------------------------------
# 6. The quantity to measure → the t_total it requires (the basis for automatic
#    tier selection)
# -----------------------------------------------------------------------------
observable_requirements:
  diffusion_coefficient:
    min_t_total_tau_B: 10
    recommended_tier: explore
  long_time_diffusion_dense:
    min_t_total_tau_B: 100
    recommended_tier: production
  rdf_structure:
    min_t_total_tau_B: 20
    note: "20 tau_B after equilibrium. L > 2 x the correlation length is the stronger constraint"
  gser_moduli:
    min_t_total_tau_B: 100
    recommended_tier: long
    note: "the MSD needs 3-4 decades. production is marginal"
  mips_coarsening:
    min_t_total_tau_B: 1000
    min_N: 10_000
    recommended_tier: long
  trap_relaxation:
    min_t_total_tau_B: 10
    note: "the real constraint is tau_k = 1/k_star. t_total > 100 tau_k"


# -----------------------------------------------------------------------------
# 7. dt selection constraints (master_plan.md §5.4)
#    The minimum of the 4 constraints is taken. Which one dominated is always
#    recorded.
# -----------------------------------------------------------------------------
timestep:
  # ⚠ The gate is on "displacement per step", not on dt/tau_B.
  #   Basis: BD_agent/knowledge/wiki/findings/dt-gate-should-be-displacement-based.md
  #   Converting 3 measurements onto the same axis (predecessor slit 0.045σ /
  #   Xu2023 0.0063σ / Quah's code 0.018σ), the dt/tau_B basis spreads over a factor
  #   of 50 and rejects 2 runs that actually made it into papers.
  #   On the displacement basis they fall inside a factor of 7 (since
  #   displacement ∝ sqrt(dt)).

  displacement_convention: per_component   # sqrt(2*dt*) — per component (lab
                                           # convention). The d-dimensional total is
                                           # this times sqrt(d)

  max_thermal_displacement_sigma: 0.03     # sqrt(2*dt*) <= this. A threshold
                                           # calibrated against lab measurements
  max_force_displacement_sigma: 0.005      # max|F*| * dt* <= this (obtain it from an
                                           # actual force computation)
  relaxation_safety_factor: 0.01           # dt* <= 0.01 * min(1/k*, 1/D_r*, ...)
  max_active_displacement_sigma: 0.01      # v0* * dt* <= this

  # ★ The stability gate — a different kind from the three above. It prevents
  #   divergence, not inaccuracy.
  #   dt <= s * 2*gamma/lambda_max,  lambda_max = 4*k_bond + 16*k_angle/b^2
  #   Only on for systems with bonds or angles. The displacement gates cannot catch
  #   it: a straight chain is a stationary point with max|F*| = 0, so the force gate
  #   is toothless, and it blows up even at kT=0.
  #   The measured critical dt is 1.22-2.80x this bound (bisection over 10
  #   combinations) -> s=0.2 leaves a 6-14x margin.
  #   Basis: knowledge/wiki/findings/dt-gate-needs-a-stability-term-for-stiff-bonds.md
  stability_safety_factor: 0.2

  default_dt_star: 5.0e-5                  # displacement 0.010σ — a third of the
                                           # threshold above. A conservative default
  hard_ceiling: 4.5e-4                     # corresponds to displacement 0.030σ. The
                                           # previous value (1e-4) was wrong because
                                           # it rejected Quah's code (1.67e-4)
  hard_floor: 1.0e-7                       # below this, reconsider the modelling

  # S3 (the pre-gate) and S7 (the post-hoc diagnosis) have to look at the same
  # quantity to be consistent
  post_hoc_max_displacement_sigma: 0.10    # S7 diagnosis: a measured maximum
                                           # displacement above this is a sign of
                                           # blow-up
  convergence_ladder: true                 # confirm convergence by re-running at
                                           # dt/2 (S7)

  # For the record (not a gate) — needed when comparing against another paper
  log_dt_over_tau_B: true


# =============================================================================
# 8. OVERRIDES  ←──────  the place a human writes. This is the only place to edit.
# =============================================================================
#  Overrides every value above. Uncomment a line, put a value in, and the agent
#  follows it immediately.
#  Writing a `_why` makes S8 record it as the basis in knowledge/parameters/.
# -----------------------------------------------------------------------------
overrides: {}

  # --- Example 1: this session has the machine to itself, so batch everything ---
  # concurrency:
  #   default: 10
  # _why: "unattended overnight run. No interactive work"

  # --- Example 2: make production bigger and longer ---
  # tiers:
  #   production:
  #     N: 8_000
  #     steps: 2_000_000
  # budget:
  #   wall_time_per_run_s: 3600
  # _why: "a dense phi=0.5 system, so the correlation length is large and L has to grow"

  # --- Example 3: skip the tier ladder and go straight to production ---
  # budget:
  #   required_tier_ladder: [pilot]
  # _why: "a run that only adds seeds to an already-verified system"

  # --- Example 4: raise the seed count (when more error bar is needed) ---
  # seeds:
  #   default: 8
  # tiers:
  #   production:
  #     concurrency: 8
  # _why: "an S7 verdict came out INCONCLUSIVE, so the statistics need reinforcing"
