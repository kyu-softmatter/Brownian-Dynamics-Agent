# ═══════════════════════════════════════════════════════════════════════
# What changed between revision 1 and 2, and why
# ═══════════════════════════════════════════════════════════════════════
# Revision 1 was attacked by four independent adversarial reviews before
# sealing. All four said do not seal. Seven objections; all seven are addressed
# here and the four structural ones changed what this campaign CLAIMS, not just
# how it is worded.
#
#   K1  The melting happened in an unsampled window. `bdbot.run` builds the
#       equilibration phase with `collect=False`, and at the case default
#       `eq_frac = 0.2` that is the first 20.00 tau_B of a 100 tau_B window --
#       so a crystal that melts quickly did so entirely out of sight, and the
#       time-series figure could not show what it promised.
#       FIXED IN CODE: `--eq-frac 0`, and `n_eq = 0` drops the phase rather than
#       running a zero-step one. Every run below records from t = 0.
#
#   K2  MELTED was a non-rejection sold as a literature-contradicting finding:
#       the band was |Delta| <= 3 sigma with no equivalence margin anywhere.
#       FIXED: "no difference" now requires a two-one-sided-tests result inside
#       an explicit margin, and failing BOTH tests is its own verdict
#       (UNDERPOWERED) rather than being absorbed into one of the others.
#
#   K3  SURVIVED was the same kinetic statement this document was written to
#       reject. A random start bounds the boundary from ABOVE because a
#       supercooled liquid is steady; a crystal start bounds it from BELOW for
#       the identical reason, and 100 tau_B closes neither.
#       FIXED: the claim is no longer about the boundary. See `question`.
#
#   K4  No band meant "the literature is right". At Gamma_Z = 57.87 Zahn
#       predicts HEXATIC -- positional order already lost -- while SURVIVED
#       required psi6_global > 0.5, which is a crystal. The outcome the
#       literature actually predicts mapped to no verdict.
#       FIXED: Zahn is now the REASON THIS COUPLING WAS CHOSEN, not the
#       proposition under test. This design cannot see a hexatic phase and no
#       longer pretends to adjudicate one.
#
#   and three smaller, each measured rather than argued:
#     * 3 sigma / 5 sigma were z-thresholds on a sigma estimated from 3+3 seeds.
#       At nu = 4, P(|t| > 3) = 0.0399 and P(|t| > 5) = 0.0075 -- 15x and
#       13,065x the normal-theory values. `findings/tolerance-from-a-4-seed-se-
#       is-not-a-3-sigma-test.md` already recorded this and revision 1 did not
#       cite it. Bands are now t quantiles with their p-values printed.
#     * `r_c` appeared nowhere in `runs:` although the case default is 5.0
#       a_mean, this campaign needs 7.8, and `r_c_star` is inside the hashed
#       `params`. Every run entry now carries the full parameter set.
#     * tau_d was never converted. tau_d = (a_mean/d)^2 tau_B = 2.2440 tau_B, so
#       the archive's "10 tau_d" is 22.44 tau_B and this campaign's 100 tau_B is
#       4.46x it, not 10x.
#
# Revision 1 is in git (commit 6997f5f) with its own `sealable: false` header.
#
# ═══════════════════════════════════════════════════════════════════════
# What changed between revision 2 and 3
# ═══════════════════════════════════════════════════════════════════════
# Revision 2 was attacked by two further reviews. Both said do not seal, and
# both kills were SELF-CONTRADICTIONS inside my own two documents. Verified by
# computation, not by reading:
#
#   K5  THE TWO SEALED FILES NAMED DIFFERENT THRESHOLDS FOR ONE VERDICT.
#       prediction.yaml printed `|t| > 4.604 = t(nu=4, two-sided 0.01)` as a
#       constant; analysis_plan.yaml said `|t| > t(nu, 0.01)` with nu by
#       Welch-Satterthwaite. Welch nu reaches 4 only when sd_H == sd_R exactly:
#       measured t(nu, 0.995) runs 4.604 at sd ratio 1, 5.958 at 2, 7.394 at 3,
#       9.532 at 9. So the printed constant was the MOST PERMISSIVE value of the
#       rule the plan mandated, and P(|t| > 4.604) is 0.0100 at nu = 4 but
#       0.0193 at nu = 3 and 0.0441 at nu = 2 -- a threshold labelled 0.01
#       running at up to 4.4x its nominal size. A pre-registration whose whole
#       claim is "the rule was fixed before the data" cannot leave two sealed
#       files naming different rules: whichever you obey afterwards, the other
#       licensed the opposite answer.
#       FIXED: the rule is stated ONCE, in `primary_statistic` /
#       `equivalence_margin` / `decision_rule` here. The analysis plan
#       references this block and restates nothing. nu is computed and printed;
#       no numeric threshold appears anywhere.
#
#   K6  THE EQUIVALENCE BAND WAS STATED THREE INCOMPATIBLE WAYS IN ONE RULE,
#       and the word "Equivalently" was simply false. "the 90 % CI lies inside
#       +-0.10" means a half-width of t(4,0.95) = 2.1318; the printed
#       "|Delta| + 2.776*sigma < 0.10" uses t(4,0.975) = 2.7764, which is a
#       95 % CI, i.e. TOST at 0.025 per side; and the plan's "TOST at 0.05"
#       with Welch nu gives t(3.2,0.95) = 2.2946. A 1.302x spread, and
#       P(equivalence | true Delta = 0) swings 0.43 / 0.58 / 0.66 depending on
#       which sentence of the same sealed rule you obey.
#       FIXED: one form, TOST at 0.05 PER SIDE, written as
#       |Delta| + t(nu, 0.95) * sigma < 0.10, with no constant.
#
#   and the scientifically important wound:
#
#   W   |t| > threshold NEVER BINDS, so the verdict was being decided by the
#       step labelled "descriptive, decided by nothing". If the crystal
#       survives, Delta is 0.5-0.7 and |t| is 27-41; if it melts, Delta ~ 0.
#       Nothing parks Delta near 0.10. Meanwhile the one regime the campaign
#       exists to probe -- nucleation-limited melting, where seeds DISAGREE --
#       gives a median |t| of 2.46 at 1-of-3 melting, so the threshold fired
#       20 % of the time and UNDERPOWERED was the modal verdict exactly there.
#       FIXED, and it changed the design: the primary statistic is now
#       `n_survive`, a COUNT of seeds above the crystal floor. A count cannot be
#       averaged into noise, needs no variance estimate, and its intermediate
#       values ARE the physics -- `SPLIT` is a pre-registered result rather than
#       a failure. Delta is secondary and valid only when the arm is unanimous.
#
#   and two consequences of taking the noise seriously for the first time:
#     * delta = 0.10 had been justified against the SIGNAL only; no sigma
#       appeared anywhere in revision 2. The archive gives seed-to-seed
#       sd(psi6_global) = 0.0394 at N = 400, so at three seeds the equivalence
#       band fires on truly-null data only 57 % of the time.
#       FIXED: FIVE seeds per arm, which takes it to 94.9 %. Cost 1.80 -> 2.90
#       core-h, inside the band already approved.
#     * the drift gate was campaign-ending across three arms at a ~4 %
#       per-arm false-positive rate, i.e. a ~12 % chance of aborting for
#       nothing. Now per-arm.

# ═══════════════════════════════════════════════════════════════════════
question: >-
  At Gamma_Zahn = 57.87, do a perfect hexagonal crystal and a random
  configuration -- same coupling, same box, same seeds, same everything but the
  positions -- reach DIFFERENT states within 100 tau_B?

  That is a question about kinetics on an accessible timescale, and it is the
  question this design can actually answer. It is not the question of where the
  equilibrium phase boundary lies: both arms give one-sided bounds, and for the
  same reason. A random start bounds the boundary from above because a
  supercooled liquid is indistinguishable from a steady one; a crystal start
  bounds it from below because a superheated crystal is too. 100 tau_B closes
  neither bound. What the PAIR measures is whether the two bounds are separated
  at all, i.e. whether the answer depends on where you start -- and if it does,
  then neither arm's reading is thermodynamic, including the archived
  isotropic-liquid reading this campaign was prompted by.

why_this_coupling: >-
  Gamma_Z = 57.87 is the centre of Zahn's hexatic window (55.87-59.88), and
  `hexwin` measured exactly here, from random starts, and read isotropic liquid
  at N = 256/576/1024. Zahn is the reason to look at this coupling and not a
  proposition under test: this design has one system size, no g_6(r) fit and no
  dynamic Lindemann parameter, so it cannot identify a hexatic phase and does
  not try. Correction 3 of
  `findings/order-parameter-magnitude-cannot-identify-a-phase` is what makes the
  crystal arm worth running -- it argues the random-start reading is a
  supercooling upper bound -- and it is an argument, not a measurement. This
  campaign measures whether the initial condition matters at all.

why_this_run_exists: >-
  The scientific question is the vehicle. The deliverable is the first run GATED
  AT EXECUTION by a sealed prediction, and the first `runs/` directory to carry
  a seal at all.

  ⚠ Revision 1 said "the first pre-registered run in this repository" and that
  is false, refuted by a file this document cites. `runs_s1s8/` holds 9 sealed
  campaign directories and 7 of those seals cover an `02_prediction.md`;
  `2026-07-29_soft-r3-relax-seeds` opens "S2 PREDICTION -- 사전 등록
  (pre-registration) / this file is sealed before S5 runs, do not edit
  afterwards", fixes k = 256 in advance to forbid optional stopping, and
  pre-registers its own INCONCLUSIVE branch. The discipline is older than this
  campaign.

  What is new and checkable: none of those 9 was gated by `bdbot.run.execute` --
  the seal was verified by a sibling tool afterwards, not by the function that
  would otherwise proceed -- and `runs/`, where all 262 bdbot-engine runs live,
  carries zero seals. Until 2026-09-13 it could not: `prepare_outdir` deleted
  SEALED.sha256 before `execute()` looked for it, so `require_seal=True` could
  only refuse and never be satisfied, and a TAMPERED seal was downgraded to
  "[warn] unsealed" while the run proceeded. Fixed in 63fde87.

