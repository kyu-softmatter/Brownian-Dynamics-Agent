disclosures:
  - what: "pilot runs at the target coupling, seen before this document was written"
    detail: >-
      Three smoke runs at A_case = 34.938, N = 144, T_obs = 3 tau_B, r_c = 5
      a_mean, eq_frac = 0.2: crystal start psi6_local 0.6291 / psi6_global
      0.4435; matched random start 0.5784 / 0.2897; random start in a square box
      0.5521 / --. The arms are separated in the expected direction at 3 tau_B.
    why_it_does_not_answer_the_question: >-
      3 tau_B is 33x shorter than the production window, N = 144 against 400,
      r_c = 5 against 7.8 a_mean, and 20 % of even that window was unsampled.
      The archived random-start runs at this same Gamma end at psi6_global
      0.09-0.20 for N >= 256, so the random arm has most of its decay still
      ahead of it at 3 tau_B. The pilot fixes neither arm's late-window value.
    reproducible: >-
      Yes, and checked: the crystal pilot's directory had been cleared by a
      later `--force`, so it was re-run and returns psi6_local 0.6291,
      psi6_global 0.4435 -- identical to the numbers above. All three pilots
      carry a full metrics.json.
      ⚠ Revision 1 claimed `kept: runs/...smoke*` while the crystal pilot's
      directory held 2 files and no metrics -- a sealed number with no run
      behind it.
  - what: "a timing probe at the deep-crystal coupling"
    detail: >-
      A_case = 106.224, T_obs = 0.5 tau_B, 17,091 steps in 8.4 s -> 2043.8
      steps/s at production geometry. Axiom A3 wants a measured cost, not an
      extrapolated one.
    and_it_is_also_the_control: "see G1 -- the same parameters, which revision 1 did not notice"
  - what: "the author knows the random-start answer, from the archive"
    detail: >-
      hexwin and ascan are read and quoted throughout. What is not known, and is
      not derivable from them, is the crystal-start answer: no run in this
      repository has ever started from anything but a random configuration.

