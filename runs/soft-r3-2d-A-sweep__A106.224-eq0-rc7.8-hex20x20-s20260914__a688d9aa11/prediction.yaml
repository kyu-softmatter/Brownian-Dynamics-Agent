predictions:
  - id: P1
    name: "does the outcome depend on the initial condition?"
    role: hypothesis
    statistic: "n_survive (primary); Delta (secondary, unanimous arms only)"
    prediction: "(n_survive_H, n_survive_R) = (5, 0) -- HYSTERESIS"
    basis: >-
      Correction 3 of the finding argues the archived random-start reading is a
      supercooling upper bound. If that argument bites at this coupling, the
      crystal arm does not reach the same state in the same window.
    if_it_disagrees: >-
      A RESULT, not a bug. NO HYSTERESIS DETECTED would mean the archived
      reading is robust to the initial condition at this coupling, and that
      correction 3's argument -- which is this repository's own, and unmeasured
      -- does not bite here.
    confidence_before_the_run: >-
      Genuinely uncertain, and the one archived fact pointing each way is worth
      stating. FOR: `ascan` A13.3 at Gamma_Z = 74.06 FROZE spontaneously from a
      random start, so the random-start freezing boundary is bracketed in
      [60.14, 74.06] -- above Zahn's melting boundary of 59.88, which is itself
      a hysteresis signature. AGAINST: nothing in the archive says a crystal
      survives below 60.14, because no crystal has ever been started.

  - id: G1
    name: "C1, deep crystal, stays ordered -- a GATE"
    role: implementation_check
    is_a_prediction: false
    rule: "psi6_global_late(C1) > 0.5 and defect_fraction(C1) < 0.10"
    already_measured: >-
      ⚠ NOT a prediction. `runs/soft-r3-2d-A-sweep__A106.224-rc7.8-hex20x20__53cdbc49da`
      has params BIT-IDENTICAL to C1 -- A_case 106.224, phi 0.35, N 400,
      r_c_star 11.684375924541376, init hex, n_x 20, n_y 20 -- differing only in
      seed (20260803 vs 20260914) and length (0.5 vs 10 tau_B). It measured
      coord_hist[6] = 1.0 exactly, i.e. defect_fraction = 0.0000, and
      psi6_local = 0.9158. Both thresholds are already known to hold. That
      directory is the one disclosed below as a timing probe: it was run to
      measure steps/s at production geometry and it happens to be the control.
    what_it_is_for: >-
      A protocol gate, which is what a control is: its answer SHOULD be known.
      Scored, reported, and not counted as a prediction that came true. C1 is a
      fresh seed at 20x the probe's duration, so it is also a reproducibility
      check.
    if_it_fails: "a BUG. P1 is void -- the crystal arm melting would carry no information."

  - id: G2
    name: "C2, deep liquid, melts the crystal -- a GATE"
    role: implementation_check
    is_a_prediction: false
    rule: "psi6_global_late(C2) < 0.30 and defect_fraction(C2) > 0.20"
    basis: >-
      Gamma_Z = 16.57 is 3.4x below the isotropic edge, and the archived case
      run at this exact A_case (= 10) is a liquid.
    if_it_fails: "a BUG. P1 is void in the other direction -- HYSTERESIS would be vacuous."

  - id: P2
    name: "the matched random arm reproduces the archived defect fraction"
    role: implementation_check
    prediction: "defect_fraction(R) = 0.285 +- 0.014 (5 %)"
    basis: >-
      hexwin at Gamma_Z = 57.911, random start, gives 0.2849 / 0.2870 / 0.2863
      at N = 256/576/1024 -- flat to 0.7 % over a 4x range of N, so N = 400 is
      interpolation. `ascan` A10 gives 0.2925 at N = 400. The case engine's own
      pilot gives 0.2626 at N = 144.
      ⚠ Revision 1 set +-20 % and justified the width by "a different psi_6
      estimator", which does not apply to a coordination count at all. The
      engines differ in box shape (square vs the 1.1547 rectangle) and in
      window length (22.44 vs 100 tau_B); r_cut agrees exactly, because simbot's
      reduced length unit IS a_mean, so its 7.80 is 7.8 a_mean by construction.
    if_it_disagrees: >-
      A BUG in one of the two implementations. It does not void P1, which is a
      within-engine comparison, but it must be reported.

  - id: P3
    name: "energy consistency"
    role: implementation_check
    prediction: "|<U>/N (force sum) - (rho/2) integral U g(r) 2 pi r dr| <= 2 %"
    basis: "an identity for any g(r); the case computes both sides"
    measured_before: "-0.0087 % in runs/soft-r3-2d-A-sweep__A100__30caa5c9e0 -- a standing invariant re-checked, not an open question"
    if_it_disagrees: "A BUG: g(r) binning or the potential definition"

