what_this_campaign_will_NOT_claim:
  - >-
    That the state is hexatic, or that it is not. Zahn's crystal->hexatic
    boundary is defined by the DYNAMIC Lindemann parameter gamma_M crossing
    0.033; this repository does not implement it, and psi_6 magnitude plus
    defect fraction cannot separate hexatic from crystal. Zahn is why this
    coupling was chosen and nothing more.
  - >-
    A value, or a bracket, for the equilibrium boundary. Both arms give
    one-sided bounds and neither is converged. A HYSTERESIS verdict says the
    bounds are separated; it does not say where the boundary is between them.
  - >-
    That a crystal surviving the window is thermodynamically stable. It is a
    lower bound on a lifetime, exactly as the archived liquid reading is an
    upper bound, and for the same reason.
  - >-
    A finite-size exponent eta_6. That needs three system sizes and a cutoff
    controlled at the exponent level rather than the value level -- correction 2
    of the finding measured a 2.9 sigma shift in p between r_cut 3.80 and 7.80
    while fixed-N psi_6 agreed within 3 sigma. One size is run here.
  - >-
    Anything from a run at a coupling chosen after seeing these results. A
    follow-up sweep is a new pre-registration.

