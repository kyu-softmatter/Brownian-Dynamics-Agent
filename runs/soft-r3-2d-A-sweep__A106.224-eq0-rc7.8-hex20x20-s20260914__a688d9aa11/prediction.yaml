# ═══════════════════════════════════════════════════════════════════════
# THE STATISTIC. One rule, stated once, here. The analysis plan references this
# block and does not restate it -- revision 2 restated it and the two copies
# disagreed.
# ═══════════════════════════════════════════════════════════════════════
primary_statistic:
  name: "(n_survive_H, n_survive_R)"
  definition: >-
    the number of seeds in EACH arm whose psi6_global_late exceeds
    PSI6_CRYSTAL_FLOOR = 0.5. A pair of integers in 0..5. No sigma, no
    tolerance, no distributional assumption.
  ⚠_the_pair_not_just_H: >-
    Written before sealing, after noticing that a rule stated on the crystal
    arm alone has a hole. If the RANDOM arm also orders, the arms agree and
    "hysteresis" is the wrong word -- and it is not impossible here: `ascan`
    A13.3 at Gamma_Z = 74.06 crystallised spontaneously from a random start, so
    this engine does nucleate at some coupling. hexwin reads liquid at this
    coupling, but that is the archived claim this campaign is re-measuring, not
    an assumption it may rest on.
  psi6_global: "|<psi_6i>| -- the magnitude of the MEAN over particles, per sample"
  late: >-
    mean over the last quarter of the production samples (75-100 tau_B for the
    H/R arms). Not the full window: a crystal melting cleanly at t = 40 tau_B
    has a full-window mean that sits between the two references. The late window
    is also the one the drift gate certifies as stationary.
  crystal_floor:
    value: 0.5
    source: "simbot.analysis.structure.PSI6_CRYSTAL_FLOOR, pinned by test_phase_reading_does_not_call_a_crystal_hexatic"
    why: "at least 5x the finite-size disorder floor 1/sqrt(N) = 0.05 at N = 400"
  why_a_count_and_not_a_mean: >-
    ★ REVISION 3. Melting behind a nucleation barrier is not a small continuous
    shift in a mean -- it is a per-trajectory event, and with a handful of seeds
    the arm can be BIMODAL. Revision 2's Delta averaged over that, and the
    consequence was measured: at 1 of 3 seeds melting (Delta = 0.38,
    sd_H = 0.31) the median |t| is 2.46 and the pre-registered threshold fires
    only 20 % of the time, so UNDERPOWERED was the modal verdict precisely in
    the regime the campaign exists to probe. A count cannot be averaged into
    noise, it needs no variance estimate, and the four-or-six-way outcome is
    itself the physics.

secondary_statistic:
  name: Delta
  definition: "mean over seeds of psi6_global_late(H) minus the same for R"
  sigma: >-
    Welch, sqrt(sd_H^2/n + sd_R^2/n) with sd at ddof=1 and nu by
    Welch-Satterthwaite. nu is COMPUTED and PRINTED; no constant threshold is
    quoted anywhere, which is what revision 2 got wrong.
  valid_only_when: >-
    BOTH arms are unanimous and on opposite sides or the same side -- the pair
    is (5, 0) or (0, 0). A mean over a bimodal arm is not a state, and the Welch
    t assumes exchangeable draws within each arm.
  guard: >-
    if sd_H / sd_R > 3, report the per-seed values and state that the arms are
    not exchangeable and the Welch t does not apply here. The ratio is printed
    either way.
  why_global_not_local: >-
    `findings/order-parameter-magnitude-cannot-identify-a-phase`: the local
    <|psi_6i|> is flat in N (0.5756/0.5736/0.5733 over N = 256/576/1024 at this
    coupling) and is not the discriminant; the global |<psi_6i>| carries the
    N-scaling that is (0.2043/0.1574/0.0942). Only the local one was recorded by
    this case before 2026-09-14. The global one returns exactly 1.0 on the
    perfect lattice (tests/test_lattice.py).

equivalence_margin:
  delta: 0.10
  units: psi6_global
  test: >-
    TOST, 0.05 PER SIDE. Fires when |Delta| + t(nu, 0.95) * sigma < 0.10, with
    nu by Welch-Satterthwaite. That is the 90 % two-sided CI on Delta lying
    entirely inside +-0.10, and it is stated once, in this form, with no
    numeric constant.
    ⚠ Revision 2 wrote three incompatible versions of this in one rule and
    called them equivalent: t(4,0.95) = 2.1318, a printed "2.776" which is
    t(4,0.975) and therefore a 95 % CI at 0.025 per side, and the plan's
    t(nu,0.95). A 1.302x spread, and P(equivalence | Delta = 0) swings 0.43 to
    0.66 across them.
  delta_basis_signal: >-
    the in-engine references bracket the range of interest: R will sit near the
    liquid value (the archived ladder extrapolates to 0.16-0.18 at N = 400) and
    the crystal floor is 0.5, so the gap that matters is about 0.34. A
    difference below 0.10 is under a third of that and cannot separate ordered
    from liquid at this N.
  delta_basis_noise:
    seed_sd_psi6_global_at_N400: 0.0394
    how: >-
      pooled from the two N = 400 estimates in the archive (fss A10 sd = 0.0287,
      ascan A10 sd = 0.0477), nu = 6, chi-square 95 % CI [0.0254, 0.0867]. Every
      archived `psi6_global_se` is a 4-seed `aggregate_seeds` SE, so sd = 2*se
      and the whole hexwin/ascan/fss/nconv archive is a direct seed-scatter
      measurement. At the exact target coupling (hexwin A10.4) the pooled value
      is 0.0302; all hexwin liquid points pooled (nu = 45) give 0.0215.
    sigma_Delta_at_5_seeds: 0.0249
    P_equivalence_fires_given_true_Delta_zero: 0.949
    measured_how: "Monte Carlo, 200,000 trials, TOST at 0.05 per side, sd = 0.0394"
    at_3_seeds_it_would_have_been: 0.565
    ⚠_and_this_is_why_there_are_five_seeds: >-
      delta = 0.10 was chosen against the SIGNAL in revision 2 and never against
      the NOISE, and no sigma appeared anywhere in the document. At three seeds
      the equivalence verdict fires on truly-null data 57 % of the time -- the
      band existed but was close to a coin flip.
      `findings/low-seed-pilots-give-optimistic-design-power` applies here to
      the NUISANCE parameter rather than the effect: sigma_Delta is what three
      seeds cannot pin, and the sd input is itself uncertain by 3.4x at nu = 6.
      Five seeds cost 1.11 core-h more and take it to 0.949.
    ⚠_a_longer_window_does_not_substitute: >-
      measured: nconv's 44.88 tau_B window at N = 256 gives sd 0.0261 while
      three 8.98 tau_B windows at the same coupling and N pool to 0.0153 --
      LARGER, not smaller. tau_int(psi6_global) is 0.10-0.20 tau_B, below one
      production sample interval, and the within-run SEM of the late mean is
      about 0.005 against a between-seed sd of 0.030-0.048. A 6-8x ergodicity
      gap: only seeds move sigma.

decision_rule:
  applied_in_this_order: true
  steps:
    - step: 1
      name: "the controls"
      rule: "evaluate G1 and G2. If either fails, STOP."
      verdict_if_it_ends_here: "PROTOCOL FAILURE -- no physics is reported"
    - step: 2
      name: "the drift gate, PER ARM"
      rule: >-
        For each arm separately (H, R, C1): fire when
        |mean(Q4) - mean(Q3)| > 3 * sqrt(block_sem(Q3)^2 + block_sem(Q4)^2),
        where Q3 and Q4 are the third and last quarters of that arm's
        production samples. Report tau_int beside it.
      consequence: >-
        The arm that fires is reported as NOT STATIONARY and its late mean is
        not used. It does not end the campaign: with a corrected
        false-positive rate of about 4 % per arm, a campaign-ending gate on
        three arms would abort about 12 % of the time for nothing. If H fires,
        n_survive is still reported -- a per-seed threshold crossing does not
        need stationarity, only the late mean does.
      ⚠_corrected_twice: >-
        revision 1 used `3 * block_sem(last 200)`, the SE of one 200-sample
        mean, for a statistic that is the difference of two 100-sample means --
        measured false-positive rate 15-41 % by tau_int. Revision 2 fixed the
        denominator but made the gate campaign-ending across three arms.
    - step: 3
      name: "the primary read"
      rule: >-
        the pair (n_survive_H, n_survive_R), each the count of that arm's seeds
        with psi6_global_late > 0.5. Every case below is exhaustive over the
        36 possible pairs.
      outcomes:
        - pair: "(5, 0)"
          verdict: HYSTERESIS
          means: >-
            Every crystal seed is still ordered at 100 tau_B and no random seed
            is. The outcome at this coupling depends on where you start, so
            NEITHER arm's reading is thermodynamic -- including the archived
            isotropic-liquid reading this campaign was prompted by.
        - pair: "(0, 0)"
          verdict: "see step 4 -- the equivalence test decides"
          means: >-
            Neither arm is ordered. Whether that is "the same state" or merely
            "both disordered" is what the equivalence test is for; two counts
            of zero do not establish agreement on their own.
        - pair: "n_survive_R > 0, i.e. any random seed ordered"
          verdict: "BOTH ARMS ORDER"
          means: >-
            ★ Not hysteresis, whatever n_survive_H is: if the random arm
            crystallises too, the arms agree and the word does not apply. It is
            also a direct contradiction of the archived reading at this
            coupling, which read isotropic liquid from random starts at
            N = 256/576/1024 -- so it is a RESULT and it puts P2 (the
            defect-fraction reproduction) under suspicion. Report both counts,
            every per-seed value, and P2's deviation, and do not report Delta as
            a state.
          not_impossible_because: >-
            `ascan` A13.3 at Gamma_Z = 74.06 crystallised spontaneously from a
            random start, so this engine nucleates at some coupling. Whether it
            does at Gamma_Z = 57.87 is the archived claim being re-measured.
        - pair: "n_survive_H in 1..4 with n_survive_R = 0"
          verdict: SPLIT
          means: >-
            ★ A RESULT, not a failure of the design. Crystal seeds at identical
            parameters reach different states, which is what a nucleation
            barrier looks like on this timescale. Report every per-seed
            psi6_global_late, both counts, and sd_H/sd_R. Delta is NOT reported
            as a state: a mean over a bimodal arm is not one. With 5 seeds the
            four intermediate counts are distinguishable and the Wilson interval
            on the survival fraction is quoted.
    - step: 4
      name: "the secondary read -- only when the H arm is unanimous"
      rule: >-
        With n_survive in {0, 5}: compute Delta, sigma, nu, the two-sided t
        with its p-value, and the TOST at 0.05 per side against delta = 0.10.
        Quote nu and t(nu, 0.995) as computed -- never a constant.
      bands:
        - verdict: "NO HYSTERESIS DETECTED"
          rule: "n_survive = 0 AND the TOST fires"
          means: >-
            The two arms agree to within 0.10 in psi6_global. The answer at
            this coupling does not depend on where you start, on this
            timescale, at this resolution, so the archived reading is robust to
            the initial condition. A positive statement, and it requires the
            equivalence test -- not the absence of a significant difference.
        - verdict: UNDERPOWERED
          rule: "n_survive = 0 AND the TOST does not fire"
          means: >-
            The seeds agree that nothing is ordered, but the arms cannot be
            shown equivalent within 0.10. Report Delta, its CI, sigma, and the
            seeds that would settle it.
        - verdict: "HYSTERESIS, with the magnitude quoted"
          rule: "n_survive = 5; Delta and |t| are reported as the size of the effect"
          means: >-
            ⚠ |t| is a detection flag here, not a measure of precision. At the
            archive sd it is expected to exceed any sensible threshold by
            20-40 sigma if the crystal survives and to sit at ~0 if it melts;
            there is no mechanism that parks Delta near the margin. Reported so
            the effect size is on the record, not to decide the verdict.
    - step: 5
      name: "descriptive"
      rule: >-
        Report psi6_global_late for every seed of every arm against the crystal
        floor, and defect_fraction for all four configurations. Names no phase.

