# Rule 7' -- the two lists, written separately and before the run.
what_the_simulation_imposes:
  - "U(r)/kT = A_case (d/r)^3 with A_case = 34.938, plus a WCA core of 1 kT, at phi = 0.35"
  - "overdamped Brownian dynamics, no hydrodynamic interactions"
  - "a periodic 20x20 commensurate box, L_x/L_y = 1.1547, r_c = 7.8 a_mean"
  - "the initial positions: a perfect hexagonal lattice (H) or RSA (R)"
  - "the observation window, 100 tau_B, sampled from t = 0"
  - "NOTHING about whether the outcome depends on the initial condition."

what_the_theory_adds:
  - source: "correction 3, knowledge/wiki/findings/order-parameter-magnitude-cannot-identify-a-phase.md"
    claim: >-
      A random start near a first-order transition can remain liquid arbitrarily
      long behind a nucleation barrier, and a supercooled liquid is also steady,
      so the archived isotropic-liquid reading at this coupling is an upper
      bound on the boundary rather than the boundary.
    what_it_implies_here: >-
      If that argument holds at this coupling, a crystal start should NOT reach
      the same state within the same window -- the two arms separate. If the
      arms agree, the argument does not bite here.
    status: "an argument in this repository's own notes, never measured. That is what makes it a hypothesis."
  - source: "Zahn 1999 PRL 82 2721 (knowledge/source/papers/1999-zahn-two-stage-melting-2d.md)"
    claim: "Gamma_Z > 59.88 crystal; 55.87 < Gamma_Z < 59.88 hexatic; Gamma_Z < 55.87 isotropic liquid"
    role_here: >-
      Motivation for the choice of coupling only. NOT under test -- see
      `what_this_campaign_will_NOT_claim`. Marked `[source, not reproduced]` in
      the distillation.

