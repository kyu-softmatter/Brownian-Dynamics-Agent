schema: bdbot.analysis_plan/0.1
campaign: soft-r3-melting-hysteresis-S30
written: 2026-09-14
revision: 3
sealed_with: prediction.yaml

why_this_is_sealed_too: >-
  `bdbot.runcard.write_seal` refuses to seal a prediction without an analysis
  plan. Sealing the prediction alone leaves the choice of figure open, and the
  choice of figure is where a null result becomes a finding. Every figure and
  every comparison this campaign will produce is named below, before the data
  exists. Anything not named here is exploratory and will be labelled so.

# ═══════════════════════════════════════════════════════════════════════
figures:
  - id: F1
    title: "psi6_global(t), every arm, from t = 0"
    x: "t / tau_B, 0 to 100"
    y: "psi6_global = |<psi_6i>|"
    series:
      - "H: crystal start, 5 seeds, one line each"
      - "R: random start, 5 seeds, one line each"
      - "shaded: the late window, samples 301-400 (75-100 tau_B), which is what the test uses"
      - "horizontal line: PSI6_CRYSTAL_FLOOR = 0.5, descriptive only"
    decides: P1
    starts_at_zero_because: >-
      ⚠ Revision 1 could not draw this. The case's default `eq_frac = 0.2` puts
      the first 20.00 tau_B in a phase built with `collect=False`, so no sample
      exists there and a crystal that melts quickly melts out of sight. Every
      run in this campaign uses `--eq-frac 0`.
    what_is_wrong_should_be_visible: >-
      If an arm is still descending at t = 100 tau_B the lines are not flat and
      the drift gate fires. A reader must be able to see that without reading
      the verdict.

  - id: F2
    title: "the primary read: five seeds, one threshold"
    content: >-
      psi6_global_late for each of the 5 H seeds and each of the 5 R seeds, as
      individual points against the crystal floor 0.5, with n_survive printed.
      Bimodality is visible by construction. Delta and its 90 % CI are drawn
      beside it against the +-0.10 equivalence band ONLY when the H arm is
      unanimous, and are omitted with a stated reason when it is not.
    decides: P1
    ⚠_replaces: >-
      Revision 2's F2 drew Delta against a |t| = 4.604 line. At the archive sd
      that figure would have shown a 30-sigma bar against a 4.6-sigma line --
      true, and the reason the threshold was not doing any work.

  - id: F3
    title: "coordination and defects"
    content: >-
      Window-averaged Voronoi coordination histogram (all 400 production
      samples, which is how `coord_hist` is accumulated and normalised -- it is
      NOT an end-of-window snapshot) for H, R, C1 and C2, side by side.
      defect_fraction = 1 - coord_hist[6] annotated with the archived
      random-start value 0.285 from hexwin.
    decides: "G2, P2, and the qualitative reading of P1"

  - id: F4
    title: "the initial and final configurations, in the real box"
    content: >-
      Four panels: H and R at t = 0, and H and R at t = 100 tau_B, as scatter
      plots in the commensurate rectangle -- x in +-16.097 d, y in +-13.940 d.
      t = 0 from `traj_A.gsd` frame 0; the final frame from `result.final_xy`.
    why: >-
      It is how a reader checks that "crystal start" means what it says and that
      the box is identical in both arms.
    the_box_is_the_real_one_because: >-
      ⚠ `make_plots` drew `xlim = ylim = +-L_star/2 = +-14.980 d`, the
      area-equivalent square, which puts particles outside the frame in x and
      leaves margin in y. Fixed in the case before sealing.

  - id: F5
    title: "sealed prediction against measurement"
    content: >-
      One table: P1, G1, G2, P2, P3 -- the sealed rule, the measurement, the
      deviation, the role, and the verdict.
    generated_by: >-
      `campaigns/soft2d_hysteresis.py --analyze`, reading `observables.npz` and
      `metrics.json["result"]` for each of the 8 run directories, plus
      `bdbot.runcard.verify_seal` for the seal column.
      ⚠ NOT `tools/ledger.py`, which revision 1 named: that reads
      `runs/*/record.json` `observables`, and this case emits only two
      `MET.observable` entries (the energy identity and the lattice NN
      distance). P1 and the gates are campaign-level statistics across eight
      directories and no per-run record can hold them.
    also: "`tools/postmortem.py runs/<run_id>` for each, per the working practice"

# ═══════════════════════════════════════════════════════════════════════
computations:
  psi6_global:
    from: "runs/<run_id>/observables.npz, column psi6_global"
    estimator: >-
      freud.order.Hexatic(k=6, weighted=True) on Voronoi neighbours;
      |mean of the per-particle complex order| per sample. Verified to return
      exactly 1.0 on the perfect lattice (tests/test_lattice.py).
    decision_window: "psi6_global_late = mean over samples 301-400 (75-100 tau_B)"
    also_reported: "the full-window mean and the four quarter means, as diagnostics"
    error: >-
      `bdbot.stats.block_sem` over the decision window (within-run) and the
      seed-to-seed sd (between-run). Both reported; the test uses the
      seed-to-seed one. block_sem uses 20 blocks and its own docstring records a
      1.09-2.28x underestimate, so tau_int is printed beside it.
  defect_fraction:
    from: "runs/<run_id>/metrics.json -> result.coord_hist"
    definition: "1 - coord_hist[6]"
    note: >-
      ⚠ Revision 1 said `extra.coord_hist`. There is no `extra` key --
      `bdbot/run.py` stores what `finalize()` returns under `result`. A plan
      that reads a key which does not exist is unexecutable, and the error would
      have surfaced only after the runs were done.
  drift_gate:
    definition: >-
      |mean(Q4) - mean(Q3)| > 3 * sqrt(block_sem(Q3)^2 + block_sem(Q4)^2),
      Q3 = samples 201-300, Q4 = samples 301-400.
    applied_to: "H, R and C1 -- every arm whose late-window mean the test uses"
    note: >-
      ⚠ Revision 1 used `3 * block_sem(last 200)`, the SE of one 200-sample
      mean, for a statistic that is the difference of two 100-sample means.
      Monte Carlo false-positive rate on stationary data: 15-41 % by tau_int;
      0.4-4.2 % with the SE of the difference. And revision 1 applied it to H
      only, while R is the arm more likely to fail it.
  n_survive:
    definition: "see prediction.yaml primary_statistic -- NOT restated here"
    computed_as: >-
      for EACH arm: sum(psi6_global_late[seed] > 0.5). Reported as the pair
      (n_survive_H, n_survive_R).
    also_report: "all ten per-seed psi6_global_late values individually, always"
  Delta:
    definition: "see prediction.yaml secondary_statistic -- NOT restated here"
    ⚠_why_not_restated: >-
      Revision 2 restated the threshold here and the two copies disagreed:
      prediction.yaml printed a constant 4.604 while this file said
      t(nu, 0.01) with nu by Welch. Welch nu reaches 4 only at sd_H == sd_R, so
      the constant was the most permissive value of the rule this file
      mandated, and the two returned different verdicts on the same data in
      9-27 % of realizations. One rule, one place.
    also_report: >-
      nu and t(nu, 0.995) as computed; the two-sided p; the TOST p; sd_H/sd_R;
      and the sd of the per-seed differences. The seeds are shared between arms
      but `init="hex"` never draws from the numpy RNG, so the noise is not
      matched trajectory-for-trajectory -- if the paired sd differs from the
      unpaired sigma by more than a factor 1.3, say so.

# ═══════════════════════════════════════════════════════════════════════
order_of_operations:
  # ⚠ THIS BLOCK WAS NOT VALID YAML in revisions 1 and 2. It mixed a sequence
  #   (`- "1. ..."`) and mapping keys (`why:`) at the same indentation, which
  #   YAML forbids -- so a document with a .yaml extension, committed and about
  #   to be sealed, could not be loaded at all. Nothing checked it:
  #   `write_seal` hashes bytes, and `--check` parsed prediction.yaml only.
  #   Both documents are now parsed before sealing.
  steps:
    - "1. Verify the seal on every one of the 12 run directories (bdbot.runcard.verify_seal) BEFORE reading any number. A broken seal ends the analysis."
    - "2. Evaluate G1 and G2, the controls. If either fails, STOP and report PROTOCOL FAILURE. No physics."
    - "3. Apply the drift gate PER ARM to H, R and C1. An arm that fires is reported as not stationary and its late mean is not used; it does not end the campaign."
    - "4. Read the pair (n_survive_H, n_survive_R). If n_survive_R > 0 the verdict is BOTH ARMS ORDER; if n_survive_H is 1-4 with n_survive_R = 0 it is SPLIT. Either way report the per-seed values and stop -- no Delta."
    - "5. Only if the pair is (5, 0) or (0, 0): compute Delta, sigma, nu, the two-sided t and p, and the TOST at 0.05 per side, and read the band."
    - "6. Report the descriptive step: every seed of every arm against the crystal floor, and defect_fraction for all four configurations."
    - "7. Evaluate P2 and P3 and report them whatever P1 said."
  why: >-
    Fixed in advance so the controls cannot be re-read once the primary is
    known. Steps 1, 2 and 4 can each end the analysis.
  the_runs_execute_in_this_order_too: >-
    C1, C2, then H1-5, R1-5. The controls the plan reads first are the runs that
    finish first, so a protocol failure is known after about 8 minutes rather
    than after three core-hours. Revision 1 ordered them H, R, C1, C2.

# ═══════════════════════════════════════════════════════════════════════
not_in_this_plan:
  - "any fit of g_6(r)"
  - "any finite-size exponent eta_6 -- one system size is run"
  - "any dynamic Lindemann parameter -- not implemented in this repository"
  - "any phase NAME for any arm. 'Ordered' and 'not ordered' are the vocabulary."
  - "any statement about where the equilibrium boundary is"
  - "any dt/2 convergence replicate -- named in the cost block as a choice, not an oversight"
  - "any Delta for a SPLIT arm. A mean over a bimodal arm is not a state."

failure_modes_this_plan_accepts:
  - >-
    Five seeds per arm is still few. UNDERPOWERED is a pre-registered verdict
    rather than a fallback, and at the archive sd it is expected in about 5 % of
    truly-null realizations.
  - >-
    n_survive is a count over five draws. It is exact, but the survival fraction
    it estimates carries a wide Wilson interval -- 5/5 gives [0.57, 1.00].
  - >-
    100 tau_B may be too short for either arm. The drift gate detects that and
    reports it rather than absorbing it into a verdict.
  - >-
    One system size means an ordered H arm cannot be distinguished from a
    finite-size-stabilised crystal. Stated in the conclusion either way.
  - >-
    A HYSTERESIS verdict is a statement about 100 tau_B. It does not become a
    statement about infinite time by being significant.
