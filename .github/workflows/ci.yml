# The badge in README.md reports this workflow, so what it covers has to be
# stated rather than implied.
#
# Two jobs, cheapest first, and each one answers a different question.
#
#   seals        did any sealed document change after it was sealed?
#   tests-hoomd  does the suite hold, engine included?
#
# `seals` needs nothing but coreutils, so it reports in seconds and is the one
# to read first.
#
# Measured on 2af7536, ubuntu-latest, hoomd 7.1.0 CPU from conda-forge:
# 1008 passed, 2 skipped in 100.7 s, and 18 sealed documents verified. `-rs`
# prints every skip and its reason into each run's log, which is the only
# reason those two counts can be trusted.
#
# Not covered: osx-arm64 -- the environment CLAUDE.md documents and the one the
# work is actually done in. hoomd ships a separate build per platform, so a
# green badge here says linux-64 holds and says nothing about the development
# machine. Adding macos-latest to a matrix would close that, at roughly ten
# times the per-minute cost.
#
# There is deliberately no engine-free job. The first attempt at one failed
# during collection: `simbot/forces.py` imports hoomd at module scope, and
# `cli.py` plus three test modules reach it, so **no configuration of this
# repository imports without the engine.** The `importorskip` fixtures in
# tests/conftest.py protect the tests that use them, not the import graph above
# them. A curated ignore-list would go green and would go stale the first time
# anyone adds a test, which is worse than not having the job.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  seals:
    name: prediction seals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SEALED.sha256 is plain `sha256sum` format, so this check does not import
      # a line of this repository's code -- which is the point. A seal verified
      # by the same codebase that wrote it is not verified.
      #
      # Recorded paths are repo-relative. Where a run directory was renamed after
      # sealing, the recorded path no longer resolves; that is reported as a
      # warning and the document is then verified next to its own seal. Content
      # integrity gates this job. A stale path does not.
      - name: Every sealed document still hashes to its seal
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          checked=0
          drifted=0

          while IFS= read -r seal; do
            dir=$(dirname "$seal")
            while read -r want rel || [ -n "${want:-}" ]; do
              if [ -z "${want:-}" ]; then continue; fi
              checked=$((checked + 1))

              target="$rel"
              if [ ! -f "$target" ]; then
                target="$dir/$(basename "$rel")"
                drifted=$((drifted + 1))
                echo "::warning file=${seal}::recorded path '${rel}' does not resolve; verifying '${target}' instead"
              fi

              if [ ! -f "$target" ]; then
                echo "::error file=${seal}::sealed document is missing: ${rel}"
                fail=1
                continue
              fi

              got=$(sha256sum "$target" | cut -d' ' -f1)
              if [ "$got" != "$want" ]; then
                echo "::error file=${target}::seal broken -- recorded ${want}, computed ${got}"
                fail=1
              fi
            done < "$seal"
          done < <(git ls-files '*SEALED.sha256')

          echo "${checked} sealed documents checked, ${drifted} with a stale recorded path"
          if [ "$checked" -eq 0 ]; then
            echo "::error::no SEALED.sha256 found -- this job silently passed on nothing"
            fail=1
          fi
          exit "$fail"

  tests-hoomd:
    name: tests with HOOMD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # environment.yml pins python=3.12 and hoomd=7.1; conda-forge has
      # hoomd-7.1.0-cpu_py312 for linux-64. The development environment is
      # macOS arm64 with the same CPU build -- see CLAUDE.md, "Run environment".
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          init-shell: bash

      - name: Report what the engine actually is
        shell: micromamba-shell {0}
        run: |
          python -c "import hoomd; print('hoomd', hoomd.version.version)"
          python -c "import hoomd; print('gpu build:', hoomd.version.gpu_enabled)"
          python -c "import freud; print('freud', freud.__version__)"

      - name: python -m pytest
        shell: micromamba-shell {0}
        run: python -m pytest -q -rs
